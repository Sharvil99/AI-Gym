  setRow(set, i, state, unit){
    const diff = set.done && (set.w !== set.pw || set.r !== set.pr) ? 'diff' : '';
    return `<div class="setrow ${state}">
      <span class="sn">${i + 1}</span>
      <span class="val ${diff}" data-act="openLog" data-arg="${i}">${kg(set.w)}<small>${unit === 'kg each' ? 'kg ea' : 'kg'}</small></span><span class="x">${icon('x', 14)}</span>
      <span class="val ${diff}" data-act="openLog" data-arg="${i}">${set.r}<small>reps</small></span>
      <button class="chk ${set.done ? 'done' : ''} ${set.pop ? 'pop' : ''}" data-act="check" data-arg="${i}" aria-label="Log set ${i + 1} as planned">${icon('check', 18, 'stroke-width="2.5"')}</button></div>`;

  sheet(content){
    return `<div class="backdrop" data-act="closeSheet"></div><div class="sheet"><div class="grabber"></div>${content}</div>`;
  },
  closeBtn(act = 'closeSheet'){ return `<button class="btn-ic" style="width:36px;height:36px" data-act="${act}">${icon('x',18)}</button>`; },
  spark(data, w = 72, h = 28, color = 'var(--accent)'){
    const mn = Math.min(...data), mx = Math.max(...data), st = w / (data.length - 1);
    const pts = data.map((v, i) => [i * st, h - 3 - ((v - mn) / (mx - mn || 1)) * (h - 6)]);
    const p = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    const last = pts[pts.length - 1];
    return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
  },
  opt({ act, arg, on, ic, em, t, s, danger }){

      <div class="h2" style="margin-top:6px">${PROGRAM.name}</div>
      <div class="t13 muted" style="margin-top:2px">${PROGRAM.level} · ${PROGRAM.perWeek} workouts a week · plan v${s.planVer}</div>
      <div class="sbar mt16"><i style="width:${done / 4 * 100}%"><b>${done}/4</b></i></div>
      <div class="row between mt16">${C.coachBadge()}<span class="row t13 muted" style="font-weight:600">View plan${icon('chev-r',16)}</span></div>
    </div>

    <div class="grid2" style="margin:12px 16px 0">
      <div class="card" style="padding:16px">
        <div class="row gap8"><span class="tile-ic">${icon('cal',18)}</span><span style="font-weight:600;font-size:14px">This week</span></div>
        <div class="segbar mt16">${[0,1,2,3].map(i => `<i class="${i < done ? 'on' : ''}"></i>`).join('')}</div>
        <div class="bigstat"><b class="num">${done}</b><span>/4 workouts</span></div></div>
      <div class="card" style="padding:16px">
        <div class="row gap8"><span class="tile-ic">${icon('qr',18)}</span><span style="font-weight:600;font-size:14px">November</span></div>
        <div class="ticks mt16" style="height:6px">${Array.from({ length:19 }, (_, i) => `<i class="${VISITS.includes(i + 1) ? 'on' : ''}" style="${VISITS.includes(i + 1) ? 'background:var(--accent)' : ''}"></i>`).join('')}</div>
        <div class="bigstat"><b class="num">${VISITS.length}</b><span>visits</span></div></div>
    </div>

    <div class="sec-title"><h3>This week by muscle</h3><a>Sets logged / planned</a></div>
    <div class="card" style="margin:0 16px;padding:20px 16px 24px"><div class="rings">${WEEK_MUSCLES.map(m => { const add = s.completed && m.today ? setsFor(s, m, true) : 0, d = Math.min(m.plan, m.done + add);
      return C.muscleRing({ ...m, pct:d / m.plan * 100, label:`${d}/${m.plan}`, color: d >= m.plan ? 'var(--green)' : 'var(--accent)' }, 72); }).join('')}</div></div>

    <div class="sec-title"><h3>Your trainer</h3><a data-act="tab" data-arg="coach">Message${icon('chev-r',16)}</a></div>
    <div class="card row gap12" style="margin:0 16px;padding:14px 16px">${C.avatarDot('coach', 48)}
      <div style="flex:1;min-width:0"><div style="font-weight:700">Coach ${COACH.name}</div><div class="t13 muted" style="margin-top:2px">On shift ${COACH.shift}</div></div>
      <div style="text-align:right"><div class="t12 muted">Next check-in</div><div style="font-weight:700;margin-top:2px">Thu 26 Nov</div></div></div>

    <div class="sec-title"><h3>Up next</h3><a data-act="go" data-arg="plan">Full week${icon('chev-r',16)}</a></div>
    <div class="card row gap12" style="margin:0 16px;padding:12px 16px 12px 12px">
      <div class="datebox"><span>Fri</span><b>20</b></div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:16px">Lower Body B</div><div class="t13 muted" style="margin-top:2px">Hinge focus · 50 min · 6 exercises</div></div>
      <span class="tag acc">Tomorrow</span></div>`,
    fixed:`${s.running && !s.completed ? C.miniBar(s) : ''}${C.tabBar('workout')}`,
    pb: s.running ? 200 : 128 };
};

/* ---------- Check-in (MEM-07) + readiness (MEM-04) ---------- */
const fakeQR = () => { const c = [[0,0],[0,1],[0,2],[1,0],[2,0],[1,2],[2,2],[2,1]]; let r = '';
  const fin = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="${x + 2.2}" y="${y + 2.2}" width="2.6" height="2.6" rx=".6" fill="#fff"/>`;
  const dots = [[10,1],[12,3],[10,5],[14,1],[16,4],[12,8],[9,10],[11,12],[14,10],[17,12],[10,15],[13,15],[16,16],[19,10],[21,14],[18,18],[12,19],[15,21],[20,20],[9,21],[22,9],[19,7],[11,17]];
  dots.forEach(([x, y]) => r += `<rect x="${x}" y="${y}" width="1.8" height="1.8" rx=".4" fill="#fff"/>`);
  return `<svg class="qr" viewBox="0 0 25 25">${fin(1,1)}${fin(17,1)}${fin(1,17)}${r}</svg>`; };
S.checkin = (s) => {
  if (!s.checkedIn) return { pb:60, body:`${C.nav({ title:'Check in', sub:BRAND.name, right:null })}
    <div class="scan" data-act="checkinQr"><div class="vf"><i></i><i></i><i></i><i></i>${fakeQR()}<span class="line"></span></div>
      <div class="cap">Point at the QR code at the front desk<small>${BRANCH} · checks you in for today</small></div></div>
    <div class="px mt16">
      <button class="hrow" style="width:100%;text-align:left" data-act="checkinLoc"><span class="hi">${icon('pin',20)}</span><span class="mid"><div class="ht">Use my location instead</div><div class="hs">Asks permission once · only when you tap</div></span>${icon('chev-r',18)}</button>
      <button class="hrow" style="width:100%;text-align:left" data-act="checkinDesk"><span class="hi">${icon('user',20)}</span><span class="mid"><div class="ht">Ask the front desk</div><div class="hs">Staff can check you in by name</div></span>${icon('chev-r',18)}</button></div>` };
  const r = s.readiness;
  const fixed = '<div class="fade-b"></div>' + (r === 'pain' ? `<button class="cta" data-act="painReq">${icon('headset',18)}Ask a trainer to come over</button>`
    : `<button class="cta" data-act="begin" ${r ? '' : 'disabled'}>${icon('play',18)}Start ${TODAY.title}</button>`);
  return { pb:130, body:`${C.nav({ title:'Check in', sub:BRAND.name, right:null })}
    <div class="px mt8"><div class="okhero"><span class="ico">${icon('check',22,'stroke-width="2.6"')}</span><div><div style="font-weight:700;font-size:16px">You’re checked in</div><div class="t13 muted" style="margin-top:2px">${TODAY.checkTime} · ${s.checkMethod}</div></div></div></div>
    <div class="px mt32"><div class="h2">How’s your body today?</div><p class="t13 muted" style="margin-top:6px">A quick check before ${TODAY.title}.</p></div>
    <div class="stack gap8 px mt16">${[
      ['ready','zap','Ready to train','No pain, normal energy'],
      ['sore','activity','A bit sore or tired','Your plan stays the same'],
      ['pain','alert','Pain or unusual symptoms','Sharp pain, dizziness, chest pain…',1]].map(([k, ic, t, sub, d]) => C.opt({ act:'ready', arg:k, on:r === k, ic, t, s:sub, danger:d })).join('')}</div>
    ${r === 'sore' ? `<div class="px mt12">${C.info('info', `Some soreness is normal. Do the full warm-up, and tell ${COACH.first} if anything feels sharp.`)}</div>` : ''}
    ${r === 'pain' ? `<div class="px mt12">${C.hold('Today’s workout is on hold', `A trainer needs to check in with you first. If symptoms are severe or sudden, stop and get medical care.`)}</div>` : ''}`,
    fixed };
};

/* ---------- Weekly plan (MEM-08) ---------- */
S.plan = (s) => {
  const chips = Array.from({ length:PROGRAM.weeks }, (_, i) => { const w = i + 1, c = w < 2 ? 'done' : w === 2 ? 'on' : 'fut';
    return `<div class="wchip ${c}"><span>WEEK</span><b>${w < 2 ? icon('check', 16, 'stroke-width="2.6"') : w}</b></div>`; }).join('');
  const rows = WEEK.map(d => {
    const status = d.st === 'done' ? `<span class="st-done">${icon('check',15,'stroke-width="2.5"')}</span>`
      : d.st === 'today' ? `<span class="tag acc">Today</span>` : d.st === 'next' ? `<span class="st-next"></span>` : `<span class="faint">${icon('moon',18)}</span>`;
    const tags = d.tags ? `<div class="tg">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}${d.extra ? `<span class="tag acc">${d.extra}</span>` : ''}</div>` : `<div class="t12 muted" style="margin-top:4px">${d.sub}</div>`;
    return `<div class="dayrow ${d.st === 'rest' ? 'rest' : ''} ${d.st === 'today' ? 'today' : ''}"><div class="dd"><span>${d.d}</span><b>${d.n}</b></div><div class="mn"><div class="tt">${d.t}</div>${tags}</div>${status}</div>`;
  }).join('');
  const v1 = s.planVer === 1;
  return { body:`${C.nav({ title:'Your plan', sub:PROGRAM.name })}
    <div class="card" style="margin:8px 16px 0;padding:16px 18px">
      <div class="row gap12">${C.avatar('coach', 40)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">Plan v${s.planVer} · approved by ${COACH.first}</div><div class="t12 muted" style="margin-top:2px">${v1 ? 'Today · your first version' : '16 Nov · replaces v1 from 9 Nov'}</div></div><span style="color:var(--green)">${icon('badge',22)}</span></div>
      ${v1 ? '' : `<div class="divider mt16"></div><div class="t13 mt12"><span class="muted">What changed:</span> one extra squat set on lower-body days.</div>`}</div>
    <div class="px mt12"><div class="note">
      <div class="row gap12">${C.avatar('coach', 36)}<div style="flex:1"><div style="font-weight:600;font-size:14px">Note from Coach ${COACH.first}</div><div class="t12 muted">Mon, 16 Nov</div></div></div>
      <q>“More squat volume this week. Keep the shoulder press light until I’ve watched a set.”</q></div></div>
    <div class="px row between mt24"><div><div class="h3">4-week program</div><div class="t13 muted" style="margin-top:2px">Started 9 Nov · check-in on 6 Dec</div></div>${C.coachBadge('Approved')}</div>
    <div class="wchips mt16">${chips}</div>
    <div class="card" style="margin:12px 16px 0;padding:12px">
      <div class="row between" style="padding:8px 8px 12px"><div><div style="font-weight:700;font-size:16px">Week 2 · 16–22 Nov</div><div class="t12 muted" style="margin-top:2px">4 workouts · 3 rest days</div></div><span class="pill acc">2 of 4 done</span></div>
      ${rows}</div>
    <div class="card row between" style="margin:12px 16px 0;padding:16px 20px"><div><div style="font-weight:600">Week 3 · 23–29 Nov</div><div class="t13 muted" style="margin-top:2px">Same exercises · weights set by ${COACH.first}</div></div>${icon('chev-d',20)}</div>
    <div class="card row between" style="margin:8px 16px 0;padding:16px 20px"><div><div style="font-weight:600">Week 4 · 30 Nov – 6 Dec</div><div class="t13 muted" style="margin-top:2px">Ends with your 4-week check-in</div></div>${icon('chev-d',20)}</div>`,
    fixed:`${s.running ? C.miniBar(s) : ''}${C.tabBar('workout')}`, pb: s.running ? 200 : 128 };
};

/* ---------- Workout preview (MEM-09) ---------- */
S.detail = (s) => ({ body:`${C.nav({ title:TODAY.title, sub:TODAY.sub })}
  <div class="stats3"><div><span>EXERCISES</span><b>${EX.length}</b></div><div><span>TARGET</span><b>${TODAY.mins} <small>min</small></b></div><div><span>PLAN</span><b>v${s.planVer}</b></div></div>
  <div class="sec-title" style="margin-top:28px"><h3>Target muscles</h3><a>Share of ${metrics(s).total} sets</a></div>
  <div class="rings px">${MUSCLES.map(m => { const n = setsFor(s, m); return C.muscleRing({ ...m, pct:n / metrics(s).total * 100, label:`${n} sets` }, 76); }).join('')}</div>
  <div class="px mt24"><div class="ai-note"><span class="ico">${icon('building',17)}</span><div class="t13" style="line-height:19px"><b style="font-weight:600">Built for ${BRAND.short}.</b> <span class="muted">Every exercise uses a verified station, and Coach ${COACH.first} set the weights. Changes need ${COACH.first}’s approval.</span></div></div></div>
  <div class="card" style="margin:12px 16px 0;padding:16px 16px 8px">
    <div class="row between" style="padding:0 4px 8px"><div><div style="font-weight:700;font-size:17px">Warm-up</div><div class="t12 muted" style="margin-top:2px">9 min · recommended</div></div><span class="toggle ${s.warmup ? 'on' : ''}" data-act="warmup"></span></div>
    <div style="${s.warmup ? '' : 'opacity:.4'}">${WARMUP.map(w => `<div class="lrow">${C.thumb(w.mus, w.view, 48)}<div class="mid"><div class="t" style="font-size:15px">${w.name}</div><div class="s">${w.meta}</div></div></div>`).join('')}</div></div>
  <div class="sec-title"><h3>${EX.length} exercises</h3><a style="color:var(--green)">${icon('badge',15)}Approved</a></div>
  <div class="px">${EX.map((_, i) => { const e = liveEx(s, i); return `<div class="ex-card">${C.thumb(e.mus, e.view)}<div style="flex:1;min-width:0">
    <div style="font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name}</div>
    <div class="t13 muted" style="margin-top:3px">${e.sets} × ${e.reps} · ${e.load}</div>
    <div class="t12 muted row gap4" style="margin-top:3px">${icon('pin',12)}${e.station}${e.note ? `<span style="color:var(--orange);font-weight:600">· Supervised</span>` : ''}</div></div><span class="ex-idx">${i + 1}</span></div>`; }).join('')}</div>`,
  fixed:`<div class="fade-b"></div><button class="cta" data-act="start">${icon(s.checkedIn || s.running ? 'play' : 'qr', 18)}${s.running ? 'Resume workout' : s.checkedIn ? 'Start workout' : 'Check in to start'}</button>`, pb:130 });

/* ---------- Active workout (MEM-10) ---------- */
S.active = (s) => {
  const ex = liveEx(s), log = s.log[s.ex], cur = curSet(s), held = !!s.holds[s.ex];
  const segs = EX.map((_, i) => i < s.ex ? '<i class="on"></i>' : i === s.ex ? `<i class="cur" style="--p:${cur / log.length * 100}%"></i>` : '<i></i>').join('');
  const rows = log.map((set, i) => C.setRow(set, i, held && !set.done ? 'fut held' : set.done ? 'done' : i === cur ? 'cur' : 'fut', ex.unit)).join('');
  const nextEx = s.ex < EX.length - 1 ? liveEx(s, s.ex + 1) : null, allDone = cur >= log.length, nx = log[Math.min(cur, log.length - 1)];
  const hard = s.lastEffort === 'hard' || s.lastEffort === 'max';
  const hint = held ? '' : allDone ? `<div class="sugg">${icon('check',18)}<span>All sets logged. Move on when you’re ready.</span></div>`
    : `<div class="sugg">${icon('clipboard',18)}<span>${hard ? `Last set felt hard. Stay at <b>${kg(nx.w)} ${ex.unit}</b>, don’t add weight. Tell ${COACH.first} if it keeps happening.` : `Next: <b>${kg(nx.w)} ${ex.unit} × ${nx.r}</b>, as set by ${COACH.first}.`}</span><span class="ap">Plan</span></div>`;
  const swapPending = s.swapReq && s.swapReq.ex === s.ex ? `<div class="mt12"><span class="tag warn">${icon('clock',12)}Swap requested · waiting for ${COACH.first}</span></div>` : '';
  let bottom;
  if (held) bottom = `<div class="logbar"><button class="btn cta-in" data-act="${nextEx ? 'nextEx' : 'finish'}">${nextEx ? `Skip to ${nextEx.name}` : 'Finish workout'}${icon('arrow',18)}</button></div>`;
  else if (s.rest != null) bottom = `<div class="rest" style="--p:${(s.rest / s.restTotal) * 100}%"><span class="rl">Rest</span><button class="adj" data-act="restAdj" data-arg="-15">−15s</button><span class="rt" data-tick="rest">${fmt(s.rest)}</span><button class="adj" data-act="restAdj" data-arg="15">+15s</button><button class="pz" data-act="restPause">${icon(s.paused ? 'play' : 'pause', 18)}</button></div>`;
  else if (allDone) bottom = `<div class="logbar"><button class="btn cta-in" data-act="nextEx">${nextEx ? `Next: ${nextEx.name}` : 'Finish workout'}${icon('arrow',18)}</button></div>`;
  else bottom = `<div class="logbar"><button class="btn cta-in" data-act="openLog" data-arg="${cur}">${icon('pencil',18)}Log set ${cur + 1} · ${kg(nx.w)} kg × ${nx.r}</button></div>`;
  return { pb:120, body:`
    ${C.nav({ left:'x', leftAct:'closeActive', title:`Exercise ${s.ex + 1} of ${EX.length}`, sub:`${TODAY.title} · <span data-tick="elapsed">${fmt(s.elapsed)}</span>`, right:'more', rightAct:'finish' })}
    <div class="segs">${segs}</div>
    ${s.offline ? `<div class="offline">${icon('wifi-off',18)}<span><b>No signal.</b> ${s.pendingSync} ${s.pendingSync === 1 ? 'set is' : 'sets are'} saved on this phone and will sync when you’re back online.</span></div>` : ''}
    <div class="illus">${bodyFig({ view:'front', on:ex.mus, h:156 })}${bodyFig({ view:'back', on:ex.mus, h:156 })}</div>
    <div class="card" style="margin:8px 16px 0;padding:18px 20px 14px">
      <div class="row between gap12"><div style="font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:28px;min-width:0">${ex.name}</div><button class="pill acc" style="flex:none" data-act="demo">${icon('play',11)}Setup</button></div>
      <div class="row gap4 t13 muted" style="margin-top:6px">${icon('pin',14)}${ex.station} · ${log.length} × ${ex.reps}</div>
      ${ex.note ? `<div class="row gap8 t13" style="margin-top:8px;color:var(--orange);font-weight:600">${icon('user',14)}${ex.note}</div>` : ''}
      ${ex.bar && !held && !allDone ? C.plates(nx.w, ex.bar) : ''}${swapPending}
      <div class="qa"><button data-act="timer">${icon('timer',20)}Rest timer</button><button data-act="demo">${icon('video',20)}How to</button><button data-act="swap">${icon('swap',20)}Swap</button></div>
    </div>
    ${held ? `<div class="px mt12">${C.hold(`${ex.name} is on hold`, `You reported pain. Don’t log more sets of this exercise until a trainer has checked in with you. Trainer request: <b>${reqWord(s)}</b>.`)}</div>` : ''}
    ${hint}
    <div class="sets"><div class="sets-h"><span>Set</span><span>Weight</span><span></span><span>Reps</span><span></span></div>${rows}
      <div class="addset">${icon('plus',16)}Add set</div></div>
    ${nextEx ? `<div class="px mt16"><div class="t12 muted" style="font-weight:600;letter-spacing:.06em;margin:0 4px 8px">UP NEXT</div><div class="ex-card">${C.thumb(nextEx.mus, nextEx.view, 48)}<div style="flex:1;min-width:0"><div style="font-weight:600">${nextEx.name}</div><div class="t13 muted" style="margin-top:2px">${nextEx.sets} × ${nextEx.reps} · ${nextEx.station}</div></div>${icon('chev-r',18)}</div></div>` : ''}`,
    fixed:`<div class="fab-wrap" style="${s.offline ? 'top:214px' : ''}"><button class="fab" data-act="help">${icon('headset',24)}</button><span>Trainer</span></div>${bottom}` };
};

/* ---------- Sheets ---------- */
const logSheet = (s) => {
  const ex = liveEx(s), e = s.edit, set = s.log[s.ex][e.i];
  return C.sheet(`<div class="sheet-head"><div><div class="h2">Log set ${e.i + 1}</div><div class="t13 muted" style="margin-top:4px">${ex.name} · ${ex.station}</div></div>${C.closeBtn()}</div>
    <div class="planned"><span>Plan from Coach ${COACH.first}</span><b>${kg(set.pw)} ${ex.unit} × ${set.pr}</b></div>
    <div class="qlabel" style="margin:16px 4px 8px">What you actually did</div>
    <div class="grid2" style="gap:8px">
      <div class="stepper"><button data-act="adjW" data-arg="-2.5">−</button><div class="sv"><b>${kg(e.w)}</b><span>${ex.unit}</span></div><button data-act="adjW" data-arg="2.5">+</button></div>
      <div class="stepper"><button data-act="adjR" data-arg="-1">−</button><div class="sv"><b>${e.r}</b><span>reps</span></div><button data-act="adjR" data-arg="1">+</button></div></div>
    <div class="qlabel" style="margin:20px 4px 8px">How hard was it?</div>
    <div class="effort">${[['easy','Easy','3+ reps left'],['good','Good','1–2 left'],['hard','Hard','0–1 left'],['max','Max','couldn’t finish']].map(([k, t, sub]) => `<button class="${e.effort === k ? 'on' : ''}" data-act="setEffort" data-arg="${k}"><b>${t}</b>${sub}</button>`).join('')}</div>
    <div class="btnrow mt16"><button class="btn danger" style="flex:.7" data-act="pain">${icon('alert',16)}Pain</button><button class="btn pri" data-act="saveLog">${icon('check',18,'stroke-width="2.4"')}Save set</button></div>`);
};
const demoSheet = (s) => {
  const ex = liveEx(s), set = s.log[s.ex][Math.min(curSet(s), s.log[s.ex].length - 1)];
  return C.sheet(`<div class="sheet-head"><div><div class="h2">${ex.name}</div><div class="t13 muted row gap4" style="margin-top:4px">${icon('pin',13)}${ex.station} · verified station</div></div>${C.closeBtn()}</div>
    <div class="vid">${bodyFig({ view:ex.view, on:ex.mus, h:176 })}<span class="play">${icon('play',22)}</span><span class="vsrc">${icon('badge',12)}Filmed at ${BRAND.short}</span><span class="vdur">0:38</span></div>
    ${ex.bar ? C.plates(set.w, ex.bar) : ''}
    <div class="qlabel" style="margin:18px 4px 12px">Setup &amp; technique · checked by ${COACH.first}</div>
    <ol class="olist">${ex.cues.map(c => `<li>${c}</li>`).join('')}</ol>
    <div class="mt16">${C.info('activity', `<b>Breathing:</b> breathe in and brace on the way down, breathe out as you push.${ex.bar ? ' Set the safety arms, or ask for a spotter on heavy sets.' : ''}`)}</div>
    <button class="btn pri block mt16" data-act="closeSheet">Got it</button>`);
};
const swapSheet = (s) => {
  const ex = EX[s.ex], opts = SWAPS[s.ex] || [], pend = s.swapReq && s.swapReq.ex === s.ex;
  return C.sheet(`<div class="sheet-head"><div><div class="h2">Swap exercise</div><div class="t13 muted" style="margin-top:4px">Instead of ${ex.name} · verified at ${BRAND.short}</div></div>${C.closeBtn()}</div>
    ${pend ? `<div class="card" style="padding:14px 16px;margin-bottom:12px;border-color:var(--accent-line)"><div class="row gap12"><span class="tile-ic" style="color:var(--orange)">${icon('clock',18)}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">Waiting for ${COACH.first}</div><div class="t12 muted">Keep going with ${ex.name} for now</div></div><button class="t13" style="font-weight:600;color:var(--red);padding:8px" data-act="cancelSwap">Cancel</button></div></div>` : ''}
    ${opts.map((a, i) => `<button class="hrow" style="width:100%;text-align:left" data-act="doSwap" data-arg="${i}">${C.thumb(ex.mus, ex.view, 44)}<span class="mid"><div class="ht">${a.name}</div><div class="hs row gap4">${icon('pin',12)}${a.station}</div></span>${pend && s.swapReq.i === i ? `<span class="tag warn">Requested</span>` : icon('chev-r',18)}</button>`).join('')}
    <div class="row gap8 t12 muted" style="margin-top:16px;padding:0 4px;line-height:16px">${icon('shield',14)}Coach ${COACH.first} approves the swap and sets the weight before you start it.</div>`);
};
const helpSheet = (s) => C.sheet(`

  <button class="hrow primary" style="width:100%;text-align:left" data-act="callCoach" data-arg="spotting"><span class="hi">${icon('hand',22)}</span><span class="mid"><div class="ht">Call a trainer to my station</div><div class="hs">${liveEx(s).station} · spotting or form help</div></span>${icon('chev-r',20)}</button>
  <button class="hrow" style="width:100%;text-align:left;margin-top:8px" data-act="callCoach" data-arg="equipment"><span class="hi">${icon('wrench',20)}</span><span class="mid"><div class="ht">Equipment problem</div><div class="hs">Broken, missing or feels unsafe</div></span>${icon('chev-r',18)}</button>
  <button class="hrow" style="width:100%;text-align:left" data-act="msgCoach"><span class="hi">${icon('chat',20)}</span><span class="mid"><div class="ht">Message Coach ${COACH.first}</div><div class="hs">Goes to your trainer chat</div></span>${icon('chev-r',18)}</button>
  <button class="hrow" style="width:100%;text-align:left" data-act="formCheck"><span class="hi">${icon('video',20)}</span><span class="mid"><div class="ht">Check my form</div><div class="hs">Send a 10-second clip to ${COACH.first}</div></span>${icon('chev-r',18)}</button>
  <button class="hrow" style="width:100%;text-align:left" data-act="swap"><span class="hi">${icon('swap',20)}</span><span class="mid"><div class="ht">Swap this exercise</div><div class="hs">${COACH.first} approves swaps first</div></span>${icon('chev-r',18)}</button>
  <button class="hrow danger" style="width:100%;text-align:left" data-act="pain"><span class="hi">${icon('alert',20)}</span><span class="mid"><div class="ht">I feel pain or discomfort</div><div class="hs">Holds this exercise and calls a trainer</div></span>${icon('chev-r',18)}</button>`);
const calledSheet = (s) => {

/* ---------- Workout complete (MEM-14) ---------- */
S.complete = (s) => {
  const m = metrics(s), partial = m.sets < m.total;
  const conf = [[30,90,'var(--accent)',8,4,20],[70,60,'#fff',6,6,-30],[110,120,'var(--green)',5,10,45],[300,80,'var(--accent)',10,4,-20],[340,140,'var(--orange)',6,6,15],[260,50,'#fff',4,10,60],[50,180,'var(--orange)',8,3,-40],[330,210,'var(--accent)',5,5,30],[160,40,'var(--accent)',4,4,10],[230,110,'var(--green)',8,3,-60]];
  const feels = ['Too easy','Easy','Just right','Hard','Too hard'];
  const bests = EX.map((e, i) => { if (!e.last || s.overrides[i]) return null; const top = s.log[i].filter(x => x.done).sort((a, b) => b.w - a.w || b.r - a.r)[0];
    return top && top.w > e.last ? { name:e.name, w:top.w, r:top.r, last:e.last } : null; }).filter(Boolean);
  const rows = EX.map((_, i) => { const e = liveEx(s, i), l = s.log[i], d = l.filter(x => x.done).length;
    const tag = s.holds[i] ? `<span class="tag bad">On hold · ${d}/${l.length}</span>` : d === l.length ? `<span class="tag good">${icon('check',11,'stroke-width="2.6"')}${d}/${l.length}</span>` : d ? `<span class="tag warn">${d}/${l.length} sets</span>` : `<span class="tag">Skipped</span>`;
    return `<div class="lrow2"><div class="mn"><div class="t" style="font-size:14px">${e.name}</div></div>${tag}</div>`; }).join('');
  return { pb:120, body:`
    ${partial ? '' : `<div class="confetti">${conf.map(([x, y, c, w, h, r], i) => `<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};transform:rotate(${r}deg);--r2:${r + 30}deg;opacity:${c === '#fff' ? .35 : .9};animation-delay:${i * .2}s"></i>`).join('')}</div>`}
    <div style="position:relative;z-index:1">
      <div class="row" style="justify-content:space-between;padding:6px 16px 0"><button class="btn-ic" data-act="done">${icon('x',20)}</button><span class="pill">${icon('cal',13)}${TODAY.date}</span></div>
      <div class="row gap16" style="padding:12px 24px 0">
        <div class="medal" style="width:72px;height:72px;margin:6px 6px 0;flex:none">${icon(partial ? 'check' : 'trophy', 32)}</div>
        <div><div class="h1" style="font-size:28px;line-height:32px">${partial ? 'Workout<br>saved' : 'Workout<br>complete!'}</div><div class="t13 muted" style="margin-top:4px">${TODAY.title} · ${TODAY.sub}</div></div></div>
      <div class="sum3 px mt24">
        <div><span>${icon('clock',14)}Time</span><b>${fmt(m.duration)}</b></div>
        <div><span>${icon('check',14)}Sets</span><b>${m.sets}<small> / ${m.total}</small></b></div>
        <div><span>${icon('dumbbell',14)}Volume</span><b>${m.volume.toLocaleString('en-IN')}<small> kg</small></b></div></div>
      <div class="t12 muted px" style="margin-top:8px;padding-left:20px">From the sets you logged.</div>
      <div class="card row" style="margin:8px 16px 0;padding:12px 16px;gap:12px">
        <div class="row" style="gap:0">${bodyFig({ view:'front', on:['chest','shoulders','triceps','biceps'], h:84 })}${bodyFig({ view:'back', on:['back','traps','triceps','shoulders'], h:84 })}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:15px">Muscles worked</div><div class="chips mt8" style="gap:4px">${MUSCLES.filter(mm => setsFor(s, mm, true)).map(mm => `<span class="tag acc">${mm.k} · ${setsFor(s, mm, true)}</span>`).join('')}</div></div></div>
      ${bests.length ? `<div class="sec-title" style="margin-top:24px"><h3>New bests</h3><a>From your logs</a></div>
      <div class="card" style="margin:0 16px;padding:14px 16px">${bests.map((b, i) => `<div class="row gap12" ${i ? 'style="margin-top:12px"' : ''}><span class="tile-ic acc">${icon(i ? 'up' : 'zap',18)}</span><div style="flex:1"><div style="font-weight:600;font-size:14px">${b.name} · ${kg(b.w)} kg × ${b.r}</div><div class="t12 muted">Up from ${kg(b.last)} kg last week</div></div></div>`).join('')}</div>` : ''}
      <div class="sec-title" style="margin-top:24px"><h3>Plan vs done</h3></div>
      <div class="card" style="margin:0 16px;padding:4px 18px">${rows}</div>
      <div class="sec-title" style="margin-top:24px"><h3>How did it feel?</h3></div>
      <div class="feel px">${feels.map((f, i) => `<button class="${s.feel === i + 1 ? 'on' : ''}" data-act="feel" data-arg="${i + 1}"><span class="lv">${[1,2,3,4,5].map(b => `<i class="${b <= i + 1 ? 'f' : ''}" style="height:${4 + b * 3}px"></i>`).join('')}</span>${f}</button>`).join('')}</div>
      <div class="chips px mt12">
        <button class="chip ${s.chips.pump ? 'on' : ''}" data-act="chip" data-arg="pump">${icon('zap',15)}Good pump</button>
        <button class="chip ${s.chips.sore ? 'on' : ''}" data-act="chip" data-arg="sore">${icon('activity',15)}Sore</button>
        <button class="chip warn ${s.chips.joint ? 'on' : ''}" data-act="chip" data-arg="joint">${icon('alert',15)}Joint pain</button></div>
      ${s.chips.joint ? `<div class="px mt12">${C.info('headset', `Coach ${COACH.first} will follow up before your next workout.`)}</div>` : ''}
      <div class="row gap8 px t13 muted" style="justify-content:center;margin-top:20px">${C.avatar('coach', 20)}Coach ${COACH.first} sees this session and your notes.</div>
    </div>`,
    fixed:`<div class="fade-b" style="height:120px"></div><button class="cta" data-act="done">Done</button>` };
};

      <div class="ctx px" style="margin-top:4px"><span class="pill">${icon('building',13)}${BRAND.short}</span><span class="pill">${icon('clipboard',13)}${TODAY.title} · plan v${s.planVer}</span>${run ? `<span class="pill">${icon('pin',13)}${liveEx(s).station}</span>` : ''}</div>
      ${s.aiCapped ? `<div class="offline" style="margin-top:12px">${icon('clock',18)}<span><b>Daily AI limit reached.</b> Quick answers still work, and so do your plan, logging and trainer help.</span></div>` : ''}</div>

      ${run ? C.miniBar(s) : ''}${C.tabBar('ai')}` };

/* ---------- Trainer chat (MEM-16) ---------- */
S.coach = (s) => {
  const wave = [6,10,16,22,14,8,18,24,20,12,8,14,22,18,10,6,12,16,10,6,8,12,8,5];
  const run = s.running && !s.completed;

    if (m.who === 'sep') return `<div class="daysep">${m.t}</div>`;

    if (m.who === 'them') return `<div class="mrow them">${C.avatar('coach', 28)}<div class="msg them">${m.t}<span class="tm">${m.tm}</span></div></div>`;
    if (m.who === 'voice') return `<div class="mrow them">${C.avatar('coach', 28)}<div class="msg them voice"><span class="pb">${icon('play',14)}</span><span class="wave">${wave.map((h, i) => `<i class="${i < 9 ? 'p' : ''}" style="height:${h}px"></i>`).join('')}</span><span class="t12 muted num">${m.dur}</span></div></div>`;
    if (m.who === 'shared') return `<div class="shared"><div class="row gap8"><span class="tile-ic acc" style="width:32px;height:32px">${icon('dumbbell',16)}</span><div style="flex:1"><div style="font-weight:600;font-size:14px">Upper Body A · completed</div><div class="t12 muted">Thu, 12 Nov</div></div><span class="st-done" style="width:24px;height:24px">${icon('check',13,'stroke-width="2.6"')}</span></div>
      <div class="row between t12 mt12" style="padding-top:10px;border-top:1px solid var(--line-2)"><span><b style="font-size:14px">46</b> <span class="muted">min</span></span><span><b style="font-size:14px">21</b> <span class="muted">sets</span></span><span><b style="font-size:14px">6,080</b> <span class="muted">kg</span></span><span class="muted">Felt: Hard</span></div></div>`;

      <div style="font-weight:700;font-size:16px;margin-top:8px">Week 1 · 4 of 4 workouts</div>

      <li><span class="b" style="color:var(--orange)">${icon('alert',14)}</span><span>1 set marked very hard: Lat Pulldown, set 4.</span></li></ul>
      <div class="row gap8 mt12" style="padding-top:12px;border-top:1px solid var(--line-2)">${C.avatar('coach', 22)}<span class="t13"><span class="muted">${COACH.first}, reviewed:</span> Great week. Keep elbows at 45° on incline.</span></div></div>`;
    return '';
  }).join('');
  return { pb: run ? 250 : 190, scrollEnd:true, body:`<div style="height:206px"></div><div class="chat">${msgs}</div>`,
    fixed:`<div class="coach-top">
      <div class="nav" style="height:48px;padding-top:0"><div class="h1" style="font-size:28px">My Trainer</div><button class="btn-ic">${icon('more')}</button></div>
      <div class="card" style="margin:4px 16px 0;padding:14px 16px">
        <div class="trainer" style="gap:12px">${C.avatarDot('coach', 52)}<div style="flex:1;min-width:0"><div style="font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap">Coach ${COACH.name}</div><div class="t12 muted" style="margin-top:1px">${COACH.role}</div>
          <div class="row gap8" style="margin-top:4px;white-space:nowrap"><span class="onfloor"><i></i>On shift ${COACH.shift}</span></div></div>
          <button class="btn-ic" style="background:var(--accent);color:var(--accent-ink);border:0" data-act="callFromCoach" title="${run ? 'Call to my station' : 'Call'}">${icon(run ? 'hand' : 'phone',19)}</button>

};

/* ---------- Progress (MEM-17) ---------- */

  const y = (v) => 8 + (mx - v) / (mx - mn) * (H - 16);
  const pts = WEIGHTS.map((v, i) => [i * st, y(v)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const gid = uid(), last = pts[pts.length - 1];
  const chart = `<svg width="100%" viewBox="-4 0 ${W + 8} ${H + 22}" style="display:block;overflow:visible">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[0, 1, 2].map(i => `<line x1="0" x2="${W}" y1="${8 + i * (H - 16) / 2}" y2="${8 + i * (H - 16) / 2}" stroke="var(--line-2)" stroke-dasharray="2 4"/>`).join('')}
    <polygon points="0,${H} ${line} ${W},${H}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="3"/>
    ${[[0,'Aug 31'],[4,'Sep 28'],[8,'Oct 26'],[11,'Nov 16']].map(([i, t]) => `<text x="${i * st}" y="${H + 18}" text-anchor="${i === 0 ? 'start' : i === 11 ? 'end' : 'middle'}" font-size="11" fill="var(--text-2)">${t}</text>`).join('')}</svg>`;
  let cal = ['M','T','W','T','F','S','S'].map(d => `<span class="cl">${d}</span>`).join('') + '<span></span>'.repeat(6);
  for (let d = 1; d <= 30; d++) cal += `<span class="cd ${VISITS.includes(d) ? 'v' : ''} ${d === 19 ? 't' : ''} ${d > 19 ? 'f' : ''}">${d}</span>`;
  const photos = s.consent.photos ? `<div class="photos px mt8">
      <div class="ph"><span class="cap">Aug 31</span>${bodyFig({ view:'front', h:128, crop:'full' })}</div>
      <div class="ph"><span class="cap" style="background:var(--accent);color:var(--accent-ink)">Nov 16</span>${bodyFig({ view:'front', h:128, crop:'full' })}</div>
      <div class="ph add">${icon('camera',22)}</div></div>
      <div class="row gap8 t12 muted px" style="margin-top:8px;padding-left:20px">${icon('lock',13)}Private to you and Coach ${COACH.first}</div>`
    : `<div class="card row gap12" style="margin:8px 16px 0;padding:14px 16px"><span class="tile-ic">${icon('camera',18)}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px">Progress photos are off</div><div class="t13 muted" style="margin-top:2px">Private, for your check-ins only.</div></div><button class="btn sec sm" data-act="photosOn">Turn on</button></div>`;
  return { body:`

function build(s){
  let base;
  if (s.role === 'trainer'){
    base = (T[s.trn] || T.today)(s);
    if (s.trnSheet === 'resolve') base.fixed += trnResolveSheet(s);
    if (s.trnSheet === 'checkin') base.fixed += trnCheckinSheet(s);
  } else {
    if (s.route === 'onb') base = ONB[s.onb](s);
    else if (s.route === 'inviteBad') base = S.inviteBad(s);
    else if (s.tab === 'ai') base = S.ai(s);
    else if (s.tab === 'coach') base = S.coach(s);
    else if (s.tab === 'profile') base = S.profile(s);
    else base = (S[s.route] || S.home)(s);
    if (s.sheet && SHEETS[s.sheet] && (s.sheet !== 'log' || s.edit)) base.fixed += SHEETS[s.sheet](s);
  }
  if (s.toast) base.fixed += `<div class="toast">${icon('check',16,'stroke-width="2.4"')}${s.toast}</div>`;
  return base;
}

    const [q, a] = Q[k]; P.ai.push({ who:'me', t:q }, { who:'ai', ...a }); P.ai = P.ai.slice(-12); setTimeout(scrollChat, 0);
  },
  aiSore(){ P.ai.push({ who:'me', t:'Muscle soreness' }, { who:'ai', src:'cues', t:'Some soreness after training is normal. Do the full warm-up and stick to your planned weights. If it turns sharp, stop and get a trainer.' }); setTimeout(scrollChat, 0); },
  aiPain(){ P.ai.push({ who:'me', t:'Sharp pain' }, { who:'ai', src:'stop', t:`Stop the exercise that hurts and don’t add weight. If the pain is severe or sudden, or you feel unwell, get medical help.`, acts:[['Call a trainer','aiCallPain',1]] }); if (P.running) P.holds[P.ex] = true; setTimeout(scrollChat, 0); },
  aiCallPain(){ P.req = req('discomfort', P.running ? liveEx(P).station : 'Gym floor'); P.sheet = 'called'; },
  aiSend(){ const inp = document.querySelector('#protoDevice [data-input]'), v = inp?.value.trim(); if (!v || P.aiCapped) return 'noRender'; inp.value = '';
    P.ai.push({ who:'me', t:esc(v) }, { who:'ai', src:'ai', t:`Today is ${TODAY.title}: ${EX.length} exercises at verified ${BRAND.short} stations. For weight changes or anything that hurts, Coach ${COACH.first} decides.` }); setTimeout(scrollChat, 0); },
  askRavi(){ P.tab = 'coach'; P.chat.push({ who:'me', t:'Can I go heavier on bench today?', tm:'Now' }); },
  /* trainer chat */
  callFromCoach(){ if (P.running){ P.tab = 'workout'; P.route = 'active'; P.sheet = 'help'; } else toast(`Calling ${COACH.first}…`); },
  focusInput(){ document.querySelector('#protoDevice [data-input]')?.focus(); return 'noRender'; },
  send(){ const inp = document.querySelector('#protoDevice [data-input]'), v = inp?.value.trim(); if (!v) return 'noRender'; inp.value = '';
    P.chat.push({ who:'me', t:esc(v), tm:'Now' });
    setTimeout(() => { P.chat.push({ who:'them', t:'Got it. I’ll come by your station after this client.', tm:'Now' }); renderProto(); scrollChat(); }, 1400);
    setTimeout(scrollChat, 0); },
  /* progress + check-in */
  photosOn(){ P.consent.photos = true; toast('Progress photos turned on'); },
  evAddW(){ P.ev.weight = 85; }, evW(d){ P.ev.weight = Math.round((P.ev.weight + +d) * 10) / 10; },
  ev(k){ const [f, v] = k.split(':'); P.ev[f] = v; },
  evSubmit(){ P.ev.saved = true; toast(`Sent to Coach ${COACH.first}`); }, evEdit(){ P.ev.saved = false; },
  /* trainer app */
  trnGo(k){ P.trn = k; P.trnSheet = null; }, trnBack(){ P.trn = 'today'; P.trnSheet = null; }, trnCloseSheet(){ P.trnSheet = null; },
  trnAccept(){ if (P.req) P.req.status = 'accepted'; toast(`Accepted · ${ME.first} can see it now`); },
  trnOnway(){ if (P.req) P.req.status = 'onway'; },
  trnResolveOpen(){ P.trnSheet = 'resolve'; P.resolveOutcome = null; },
  trnOutcome(k){ P.resolveOutcome = k; },
  trnResolve(){ if (!P.resolveOutcome || !P.req) return;
    if (P.req.type === 'discomfort' && P.resolveOutcome === 'release') delete P.holds[P.req.ex];
    P.req.status = 'resolved'; P.trnSheet = null; toast('Resolved · logged as trainer attention'); },
  trnSwap(v){ if (!P.swapReq) return; const { ex, i } = P.swapReq;
    if (v === 'yes'){ const o = SWAPS[ex][i], base = EX[ex], unit = o.unit || 'kg';
      P.overrides[ex] = { ...base, name:o.name, station:o.station, load:`${o.w} ${unit}`, unit, bar:null, note:null };
      P.log[ex] = P.log[ex].map(() => ({ w:o.w, r:o.r, pw:o.w, pr:o.r, done:false })); toast(`Swap approved · ${o.w} ${unit} set`); }
    else toast('Swap declined');
    P.swapReq = null; },
  trnLoads(){ P.loadsSet = true; },
  trnApprove(){ if (!P.loadsSet){ toast('Set all starting weights first'); return; } P.planStatus = 'approved'; P.trn = 'today'; toast(`Plan v${P.planVer} approved · ${ME.first} notified`); },
  trnChanges(){ toast('Draft sent back with your notes'); },
  trnCheckinOpen(){ P.trnSheet = 'checkin'; }, ciType(k){ P.ciType = k; }, ciOut(k){ P.ciOutcome = k; },
  trnCheckinSave(){ P.trnSheet = null; toast('Check-in logged · next due 3 Dec'); },
};
function scrollChat(){ const sc = document.querySelector('#protoDevice .scroll'); if (sc) sc.scrollTop = sc.scrollHeight; }

function jump(r){
  P.sheet = null; P.trnSheet = null; P.edit = null;
  const asMember = () => { P.role = 'member'; };
  const asTrainer = (k) => { P.role = 'trainer'; P.trn = k; };
  switch (r){
    case 'reset': P = freshState(); break;
    case 'onb': asMember(); Object.assign(P, { route:'onb', onb:0, tab:'workout' }); break;
    case 'pending': asMember(); Object.assign(P, { tab:'workout', route:'home', planStatus:'pending', planVer:1, loadsSet:false, running:false, checkedIn:false, readiness:null }); break;
    case 'active': asMember(); if (P.running) A.resume(); else { Object.assign(P, { planStatus:'approved', checkedIn:true, checkMethod:P.checkMethod || 'Gym QR · front desk', readiness:P.readiness && P.readiness !== 'pain' ? P.readiness : 'ready' }); A.begin(); } break;
    case 'complete': asMember(); if (!P.log.flat().some(x => x.done)) P = completedState(); else A.finish(); break;
    case 'ai': case 'coach': case 'profile': asMember(); P.tab = r; if (P.route === 'onb') P.route = 'home'; break;
    case 'trainer': asTrainer('today'); break;
    case 'trequest': asTrainer('request'); break;
    case 'review': asTrainer('review'); break;
    case 'tmember': asTrainer('member'); break;
    default: asMember(); P.tab = 'workout'; P.route = r;
  }
  renderProto();
}

/* ruler drag (onboarding) */
function bindRuler(screen){
  const r = screen.querySelector('[data-ruler]'); if (!r) return;
  const track = r.querySelector('.ruler-track');
  let sx = 0, sw = 0, drag = false;
  r.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; sw = P.weight; r.setPointerCapture(e.pointerId); track.style.transition = 'none'; });
  r.addEventListener('pointermove', e => {
    if (!drag) return;
    const per = P.unit === 'kg' ? 1 : 1 / 2.20462;
    P.weight = Math.min(150, Math.max(40, Math.round((sw - (e.clientX - sx) / (10 * DZ) * per) * 2) / 2));
    const val = P.unit === 'kg' ? P.weight : P.weight * 2.20462, min = +r.dataset.min;
    track.style.transform = `translateX(${-(val - min) * 10}px)`;
    screen.querySelector('[data-w]').textContent = (Math.round(val * 2) / 2).toFixed(1).replace(/\.0$/, '');
  });
  r.addEventListener('pointerup', () => { drag = false; track.style.transition = ''; });
}

/* collapsing sticky header: hysteresis avoids flicker when the header height changes */
function syncSticky(sc){
  const h = sc.querySelector('.home-top'); if (!h) return;
  const on = h.classList.contains('compact'), t = sc.scrollTop;
  if (!on && t > 24) h.classList.add('compact');
  else if (on && t < 4) h.classList.remove('compact');
}
document.addEventListener('scroll', e => { if (e.target.classList?.contains('scroll')) syncSticky(e.target); }, true);

/* event delegation for the prototype */
document.addEventListener('click', e => {
  const jt = e.target.closest('[data-jump]'); if (jt){ jump(jt.dataset.jump); return; }
  const op = e.target.closest('[data-open]'); if (op){ openFrame(op.dataset.open); return; }
  const tg = e.target.closest('[data-theme]'); if (tg){ setTheme(tg.dataset.theme); return; }
  const proto = e.target.closest('#protoDevice');
  if (!proto){ // static frames: let set checks animate for demo
    const c = e.target.closest('.chk'); if (c){ c.classList.toggle('done'); c.classList.remove('pop'); void c.offsetWidth; if (c.classList.contains('done')) c.classList.add('pop'); }
    return;
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (fn(t.dataset.arg) === 'noRender') return;
  renderProto();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#protoDevice [data-input]')){ if (P.tab === 'ai' && P.role === 'member') A.aiSend(); else A.send(); renderProto(); scrollChat(); } });

/* live ticking: elapsed + rest without full re-render */
setInterval(() => {
  if (!P.running) return;
  P.elapsed++;
  const host = document.getElementById('protoDevice');
  host.querySelectorAll('[data-tick="elapsed"]').forEach(el => el.textContent = fmt(P.elapsed));
  if (P.rest != null && !P.paused){
    P.rest--;
    if (P.rest <= 0){ P.rest = null; if (P.role === 'member') renderProto(); return; }
    host.querySelectorAll('[data-tick="rest"]').forEach(el => el.textContent = fmt(P.rest));
    const pill = host.querySelector('.rest'); if (pill) pill.style.setProperty('--p', (P.rest / P.restTotal * 100) + '%');
  }
}, 1000);

/* fit phones to the window height and desktop frames to the canvas width (CSS zoom keeps hit-testing correct) */
let DZ = 1;
function fitDevices(){
  DZ = Math.max(0.55, Math.min(1, (window.innerHeight - 72) / 868));
  const dzd = Math.max(0.42, Math.min(1, (Math.min(window.innerWidth, 2000) - 136) / 1282));
  document.documentElement.style.setProperty('--dz', DZ.toFixed(3));
  document.documentElement.style.setProperty('--dzd', dzd.toFixed(3));
}
fitDevices();
window.addEventListener('resize', fitDevices);

/* theme */
function setTheme(t){
  document.body.className = 'theme-' + t;
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('it-theme', t); } catch(e){}
  renderSwatches();
}
document.querySelector('[data-theme="dark"]').innerHTML = icon('moon', 16) + 'Dark';
document.querySelector('[data-theme="light"]').innerHTML = icon('sun', 16) + 'Light';

renderCanvas();
renderProto();
try { const t = localStorage.getItem('it-theme'); if (t) setTheme(t); } catch(e){}
</script>
