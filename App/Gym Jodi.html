.ix-link:hover,.idx .acts a:hover{background:#E5E7EB}
.ix-link.wide{padding:3px 8px}
.ix-top{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;color:#6B7280;text-decoration:none}
/* ---------- Gym Jodi: trainer-set prescription, set chips, cardio timer, feedback ---------- */
.rx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rx>div{background:var(--card-2);border-radius:16px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px}
.theme-light .rx>div{background:var(--raised)}
.rx span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.rx b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:34px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rx b small{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:0}
.rxby{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--text-2)}
.setchips{display:flex;gap:8px;margin-top:14px}
.setchips .sc{flex:1;height:48px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;color:var(--text-2);font:600 14px var(--font);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .15s,border-color .15s}
.theme-light .setchips .sc{border-color:var(--line-2)}
.setchips .sc .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text-3);display:grid;place-items:center;color:transparent;box-sizing:border-box}
.setchips .sc.cur{border-color:var(--accent);color:var(--text)}
.setchips .sc.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.setchips .sc.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qa.two{grid-template-columns:repeat(2,1fr)}
.ctimer{position:relative;width:200px;height:200px;margin:18px auto 0}
.ctimer svg{display:block}
.cprog{transition:stroke-dashoffset 1s linear}
.ct-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ct-in b{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:50px}
.ct-in span{font-size:13px;color:var(--text-2);font-weight:600;margin-top:2px}
.ctarget{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;color:var(--text-2);text-align:center}
.ctarget .ic{color:var(--accent)}
.feelopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.feelopts button{min-height:100px;border-radius:18px;background:var(--card-2);border:1.5px solid transparent;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font-family:inherit;color:var(--text);cursor:pointer}
.theme-light .feelopts button{background:var(--raised)}
.feelopts button b{font-size:15px;font-weight:700}
.feelopts .fs{font-size:12px;color:var(--text-2);line-height:16px}
.feelopts .lv{display:flex;align-items:flex-end;gap:3px;height:18px;margin-bottom:8px}
.feelopts .lv i{width:5px;border-radius:2px;background:var(--text-3)}
.feelopts .lv i.f{background:var(--accent)}
.feelopts button.on{border-color:var(--accent);background:var(--accent-soft)}
button.tag{border:0;font-family:inherit;cursor:pointer}
.lrow2 .pill.acc{height:26px;font-size:12px}
.atgym{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.ag-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.theme-light .ag-ic{color:color-mix(in srgb,var(--accent) 85%,#000)}
.ag-ic.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.outtag{position:absolute;top:196px;right:16px;z-index:6;height:28px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,var(--card));color:var(--orange);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}

function bodyFig({ view = 'front', on = [], h = 160, crop = 'full', cls = '' } = {}){

}

  setRow(set, i, state, unit){
    const diff = set.done && (set.w !== set.pw || set.r !== set.pr) ? 'diff' : '';
    return `<div class="setrow ${state}">
      <span class="sn">${i + 1}</span>
      <span class="val ${diff}" data-act="openLog" data-arg="${i}">${kg(set.w)}<small>${unit === 'kg each' ? 'kg ea' : 'kg'}</small></span><span class="x">${icon('x', 14)}</span>
      <span class="val ${diff}" data-act="openLog" data-arg="${i}">${set.r}<small>reps</small></span>
      <button class="chk ${set.done ? 'done' : ''} ${set.pop ? 'pop' : ''}" data-act="check" data-arg="${i}" aria-label="Log set ${i + 1} as planned">${icon('check', 18, 'stroke-width="2.5"')}</button></div>`;

  sheet(content){
    return `<div class="backdrop" data-act="closeSheet"></div><div class="sheet"><div class="grabber"></div>${content}</div>`;
  },
  closeBtn(act = 'closeSheet'){ return `<button class="btn-ic" style="width:36px;height:36px" data-act="${act}">${icon('x',18)}</button>`; },
  spark(data, w = 72, h = 28, color = 'var(--accent)'){
    const mn = Math.min(...data), mx = Math.max(...data), st = w / (data.length - 1);
    const pts = data.map((v, i) => [i * st, h - 3 - ((v - mn) / (mx - mn || 1)) * (h - 6)]);
    const p = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    const last = pts[pts.length - 1];
    return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
  },
  opt({ act, arg, on, ic, em, t, s, danger }){
    return `<button class="goal sm ${on ? 'on' : ''} ${danger ? 'danger' : ''}" data-act="${act}" data-arg="${arg}" style="text-align:left;width:100%">
      <span class="em">${ic ? icon(ic, 21) : em}</span><span style="min-width:0;flex:1"><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</span>
      <span class="ck">${on ? icon('check', 15, 'stroke-width="2.6"') : ''}</span></button>`;
  },
  vtl(items){
    const ic = { ok:icon('check', 14, 'stroke-width="2.6"'), now:icon('clock', 14) };
    return `<div class="vtl">${items.map(([st, t, sub]) => `<div class="it ${st}"><span class="dot">${ic[st] || ''}</span><div style="min-width:0"><div class="tt">${t}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div></div>`).join('')}</div>`;

  // Barbell loading, drawn from the verified bar and plate set (M01-FR06, M07-FR02)
  plates(total, bar = 20){
    const side = (total - bar) / 2, set = [20, 15, 10, 5, 2.5, 1.25];
    const col = { 20:'#3E7CB1', 15:'#E3B341', 10:'#3DDC84', 5:'#E9E9EE', 2.5:'#FF5A5F', 1.25:'#9A9A9A' };
    const H = { 20:38, 15:34, 10:30, 5:24, 2.5:20, 1.25:16 }, W = { 20:7, 15:7, 10:6, 5:5, 2.5:4, 1.25:4 };
    let rem = side, ps = []; for (const p of set) while (rem >= p - 1e-9){ ps.push(p); rem -= p; }
    let l = '', r = '', xl = 38, xr = 82;
    ps.forEach(p => { xl -= W[p] + 1; l += `<rect x="${xl}" y="${22 - H[p] / 2}" width="${W[p]}" height="${H[p]}" rx="1.5" fill="${col[p]}"/>`;

    return `<div class="plates"><svg width="120" height="44" viewBox="0 0 120 44"><rect x="2" y="20" width="116" height="4" rx="2" fill="var(--text-3)"/>${l}${r}<rect x="38" y="16" width="3" height="12" rx="1" fill="var(--text-2)"/><rect x="79" y="16" width="3" height="12" rx="1" fill="var(--text-2)"/></svg>
      <div class="pt"><b>${kg(side)} kg each side</b><div class="muted">${bar} kg bar · ${kg(total)} kg total<br>Verified at this station</div></div></div>`;
  },
};

        <div class="bigstat"><b class="num">${done}</b><span>/3 workouts</span></div></div>
      <div class="card" style="padding:16px">
        <div class="row gap8"><span class="tile-ic">${icon('qr',18)}</span><span style="font-weight:600;font-size:14px">November</span></div>
        <div class="ticks mt16" style="height:6px">${Array.from({ length:19 }, (_, i) => `<i class="${VISITS.includes(i + 1) ? 'on' : ''}" style="${VISITS.includes(i + 1) ? 'background:var(--accent)' : ''}"></i>`).join('')}</div>
        <div class="bigstat"><b class="num">${VISITS.length}</b><span>visits</span></div></div>
    </div>

    <div class="sec-title"><h3>This week by muscle</h3><a>Sets done / planned</a></div>
    <div class="card" style="margin:0 16px;padding:20px 16px 24px"><div class="rings">${WEEK_MUSCLES.map(m => { const add = s.completed && m.today ? setsFor(s, m, true) : 0, d = Math.min(m.plan, m.done + add);
      return C.muscleRing({ ...m, pct:d / m.plan * 100, label:`${d}/${m.plan}`, color: d >= m.plan ? 'var(--green)' : 'var(--accent)' }, 72); }).join('')}</div></div>

      <div style="text-align:right"><div class="t12 muted">Next check-in</div><div style="font-weight:700;margin-top:2px">Thu 26 Nov</div></div></div>

    <div class="sec-title"><h3>Up next</h3><a data-act="go" data-arg="plan">Full week${icon('chev-r',16)}</a></div>

/* ---------- Before you start (MEM-04). Reached from Start; replaces QR check-in ---------- */
S.ready = (s) => {
  const r = s.readiness, out = s.where === 'outside';
  const fixed = '<div class="fade-b"></div>' + (r === 'pain'
    ? (out ? `<button class="cta" data-act="msgCoach">${icon('chat',18)}Message Coach ${COACH.first}</button>` : `<button class="cta" data-act="painReq">${icon('headset',18)}Ask a trainer to come over</button>`)
    : `<button class="cta" data-act="begin" ${r ? '' : 'disabled'}>${icon('play',18)}Start ${TODAY.title}</button>`);
  return { pb:130, body:`${C.nav({ title:'Before you start', sub:TODAY.title, right:null })}
    ${out ? `<div class="px mt8"><span class="tag warn">${icon('pin',12)}Not at ${BRAND.short} · not counted as a visit</span></div>` : ''}
    <div class="px mt24"><div class="h2">How’s your body today?</div></div>
    <div class="stack gap8 px mt16">${[
      ['ready','zap','Ready to train','No pain, normal energy'],
      ['sore','activity','A bit sore or tired','Your plan stays the same'],
      ['pain','alert','Pain or unusual symptoms','Sharp pain, dizziness, chest pain…',1]].map(([k, ic, t, sub, d]) => C.opt({ act:'ready', arg:k, on:r === k, ic, t, s:sub, danger:d })).join('')}</div>
    ${r === 'sore' ? `<div class="px mt12">${C.info('info', `Some soreness is normal. Tell ${COACH.first} if anything feels sharp.`)}</div>` : ''}
    ${r === 'pain' ? `<div class="px mt12">${C.hold('Today’s workout is on hold', out ? `Talk to Coach ${COACH.first} before training. If symptoms are severe or sudden, get medical care.` : `A trainer needs to check in with you first. If symptoms are severe or sudden, stop and get medical care.`)}</div>` : ''}`,
    fixed };
};
// Opening the app inside the gym (location matches) when today's workout hasn't started
const atGymSheet = (s) => C.sheet(`<div class="sheet-head" style="padding-bottom:0"><span class="pill acc"><i class="d"></i>${BRAND.short}</span>${C.closeBtn()}</div>
  <div class="atgym"><div class="ag-ic">${icon('pin',26)}</div><div class="h2" style="margin-top:14px">You’re at ${BRAND.short}</div><div class="t13 muted" style="margin-top:4px">${TODAY.title} · ${TODAY.mins} min · ${EX.length} exercises</div></div>
  <button class="btn pri block mt24" data-act="start">${icon('play',18)}Start workout</button>
  <button class="btn sec block mt8" data-act="closeSheet">Not now</button>`);
// Start tapped but the phone's location doesn't match the gym (or location is off)
const whereSheet = (s) => C.sheet(`<div class="sheet-head" style="padding-bottom:0"><span></span>${C.closeBtn()}</div>
  <div class="atgym"><div class="ag-ic warn">${icon('pin',26)}</div><div class="h2" style="margin-top:14px">Are you at ${BRAND.short}?</div><div class="t13 muted" style="margin-top:4px">${s.loc === 'off' ? 'Location is off.' : 'Your location doesn’t match the gym.'}</div></div>
  <button class="btn pri block mt24" data-act="whereGym">Yes, I’m at ${BRAND.short}</button>
  <button class="btn sec block mt8" data-act="whereElse">No, somewhere else</button>`);

/* ---------- Weekly plan (MEM-08) ---------- */
S.plan = (s) => {
  const chips = Array.from({ length:PROGRAM.weeks }, (_, i) => { const w = i + 1, c = w < 2 ? 'done' : w === 2 ? 'on' : 'fut';
    return `<div class="wchip ${c}"><span>WEEK</span><b>${w < 2 ? icon('check', 16, 'stroke-width="2.6"') : w}</b></div>`; }).join('');
  const rows = WEEK.map(d => {
    const status = d.st === 'done' ? `<span class="st-done">${icon('check',15,'stroke-width="2.5"')}</span>`
      : d.st === 'today' ? `<span class="tag acc">Today</span>` : d.st === 'next' ? `<span class="st-next"></span>` : `<span class="faint">${icon('moon',18)}</span>`;
    const tags = d.tags ? `<div class="tg">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}${d.extra ? `<span class="tag acc">${d.extra}</span>` : ''}</div>` : `<div class="t12 muted" style="margin-top:4px">${d.sub}</div>`;
    return `<div class="dayrow ${d.st === 'rest' ? 'rest' : ''} ${d.st === 'today' ? 'today' : ''}"><div class="dd"><span>${d.d}</span><b>${d.n}</b></div><div class="mn"><div class="tt">${d.t}</div>${tags}</div>${status}</div>`;
  }).join('');
  const v1 = s.planVer === 1;
  return { body:`${C.nav({ title:'Your plan', sub:PROGRAM.name })}
    <div class="card" style="margin:8px 16px 0;padding:16px 18px">
      <div class="row gap12">${C.avatar('coach', 40)}<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">Plan v${s.planVer} · approved by ${COACH.first}</div><div class="t12 muted" style="margin-top:2px">${v1 ? 'Today · your first version' : '16 Nov · replaces v1 from 9 Nov'}</div></div><span style="color:var(--green)">${icon('badge',22)}</span></div>
      ${v1 ? '' : `<div class="divider mt16"></div><div class="t13 mt12"><span class="muted">What changed:</span> leg press up to 40 kg, after your feedback.</div>`}</div>
    <div class="px mt12"><div class="note">
      <div class="row gap12">${C.avatar('coach', 36)}<div style="flex:1"><div style="font-weight:600;font-size:14px">Note from Coach ${COACH.first}</div><div class="t12 muted">Mon, 16 Nov</div></div></div>
      <q>“Tell me how each exercise felt. I raise your weights from that. Keep the shoulder press light until I’ve watched a set.”</q></div></div>
    <div class="px row between mt24"><div><div class="h3">4-week program</div><div class="t13 muted" style="margin-top:2px">Started 9 Nov · check-in on 6 Dec</div></div>${C.coachBadge('Approved')}</div>
    <div class="wchips mt16">${chips}</div>
    <div class="card" style="margin:12px 16px 0;padding:12px">
      <div class="row between" style="padding:8px 8px 12px"><div><div style="font-weight:700;font-size:16px">Week 2 · 16–22 Nov</div><div class="t12 muted" style="margin-top:2px">3 workouts · 4 rest days</div></div><span class="pill acc">1 of 3 done</span></div>
      ${rows}</div>
    <div class="card row between" style="margin:12px 16px 0;padding:16px 20px"><div><div style="font-weight:600">Week 3 · 23–29 Nov</div><div class="t13 muted" style="margin-top:2px">Same exercises · weights set by ${COACH.first} from your feedback</div></div>${icon('chev-d',20)}</div>
    <div class="card row between" style="margin:8px 16px 0;padding:16px 20px"><div><div style="font-weight:600">Week 4 · 30 Nov – 6 Dec</div><div class="t13 muted" style="margin-top:2px">Ends with your 4-week check-in</div></div>${icon('chev-d',20)}</div>`,
    fixed:`${s.running ? C.miniBar(s) : ''}${C.tabBar('workout')}`, pb: s.running ? 200 : 128 };
};

/* ---------- Workout preview (MEM-09) ---------- */
const exMeta = (e) => e.kind === 'cardio' ? `${e.mins} min · ${e.target}` : `${e.sets} × ${e.reps} · ${e.load}`;
S.detail = (s) => ({ body:`${C.nav({ title:TODAY.title, sub:TODAY.sub })}
  <div class="stats3"><div><span>EXERCISES</span><b>${EX.length}</b></div><div><span>TARGET</span><b>${TODAY.mins} <small>min</small></b></div><div><span>PLAN</span><b>v${s.planVer}</b></div></div>
  <div class="sec-title" style="margin-top:28px"><h3>Target muscles</h3><a>Share of ${metrics(s).total} sets</a></div>
  <div class="rings px">${MUSCLES.map(m => { const n = setsFor(s, m); return C.muscleRing({ ...m, pct:n / metrics(s).total * 100, label:`${n} sets` }, 76); }).join('')}</div>
  <div class="px mt24"><div class="ai-note"><span class="ico">${icon('building',17)}</span><div class="t13" style="line-height:19px"><b style="font-weight:600">Built for ${BRAND.short}.</b> <span class="muted">Every exercise uses equipment at your gym, and Coach ${COACH.first} set the weights and reps.</span></div></div></div>
  <div class="sec-title"><h3>${EX.length} exercises</h3><a style="color:var(--green)">${icon('badge',15)}Approved</a></div>
  <div class="px">${EX.map((_, i) => { const e = liveEx(s, i); return `<div class="ex-card">${C.thumb(e.mus, e.view)}<div style="flex:1;min-width:0">
    <div class="row gap8" style="min-width:0"><span style="font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name}</span>${e.kind === 'cardio' ? `<span class="tag">${icon('timer',11)}${e.tags}</span>` : ''}</div>
    <div class="t13 muted" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${exMeta(e)}</div>
    <div class="t12 muted row gap4" style="margin-top:3px">${icon('pin',12)}${e.station}${e.note ? `<span style="color:var(--orange);font-weight:600">· Supervised</span>` : ''}</div></div><span class="ex-idx">${i + 1}</span></div>`; }).join('')}</div>`,
  fixed:`<div class="fade-b"></div><button class="cta" data-act="start">${icon('play', 18)}${s.running ? 'Resume workout' : 'Start workout'}</button>`, pb:130 });

/* =========================================================
   GYM JODI · ACTIVE WORKOUT (MEM-10)
   Strength: the trainer's sets × reps × weight, tap each set
   when done (no typing, no rest timer). Cardio: countdown timer.
   After each exercise: optional "How did it feel?" (MEM-11).
   ========================================================= */
const FEEL_CARDIO = { easy:'Could go much longer', right:'Breathing hard, but OK', hard:'Struggled to keep the pace', fail:'Stopped early' };
const feelLabel = k => (FEEL.find(f => f[0] === k) || [])[1];
const feelTag = k => ({ easy:'acc', right:'good', hard:'warn', fail:'bad' }[k]);
const ringC = 2 * Math.PI * 88;
const cardioRing = (s, ex) => {
  const c = s.cardio, total = ex.mins * 60, left = c.left == null ? total : c.left, pct = (total - left) / total;
  return `<div class="ctimer"><svg viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--raised)" stroke-width="10"/>
      <circle class="cprog" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${ringC.toFixed(1)}" stroke-dashoffset="${(ringC * (1 - pct)).toFixed(1)}" transform="rotate(-90 100 100)"/></svg>
    <div class="ct-in"><b data-tick="cardio">${fmt(left)}</b><span>${c.left == null ? 'minutes' : c.paused ? 'paused' : 'left'}</span></div></div>`;
};

S.active = (s) => {
  const ex = liveEx(s), log = s.log[s.ex], held = !!s.holds[s.ex], cardio = ex.kind === 'cardio', cur = curSet(s), allDone = !cardio && cur >= log.length;
  const prog = cardio ? (s.cardio.left == null ? 0 : (1 - s.cardio.left / (ex.mins * 60)) * 100) : cur / log.length * 100;
  const segs = EX.map((_, i) => s.exDone[i] ? '<i class="on"></i>' : i === s.ex ? `<i class="cur" style="--p:${prog}%"></i>` : '<i></i>').join('');
  const nextI = EX.findIndex((_, i) => i > s.ex && !s.exDone[i]), nextEx = nextI > -1 ? liveEx(s, nextI) : null;
  const swapPending = s.swapReq && s.swapReq.ex === s.ex ? `<div class="mt12"><span class="tag warn">${icon('clock',12)}Swap requested · waiting for ${COACH.first}</span></div>` : '';
  const unit = ex.unit === 'kg each' ? 'kg each' : 'kg';
  const rx = cardio
    ? `${cardioRing(s, ex)}<div class="ctarget">${icon('activity',15)}${ex.target}</div>`
    : `<div class="rx"><div><span>Sets</span><b>${log.length}</b></div><div><span>Reps</span><b>${ex.reps}</b></div><div><span>Weight</span><b>${kg(log[0].w)}<small> ${unit}</small></b></div></div>
       <div class="rxby">${C.avatar('coach', 18)}Set by Coach ${COACH.first}</div>
       <div class="setchips">${log.map((x, i) => `<button class="sc ${x.done ? 'done' : i === cur && !held ? 'cur' : ''}" data-act="setDone" data-arg="${i}" aria-pressed="${x.done}"><span class="ck">${icon('check', 15, 'stroke-width="2.8"')}</span>Set ${i + 1}</button>`).join('')}</div>`;
  let bottom;
  if (held) bottom = `<div class="logbar"><button class="btn cta-in" data-act="nextEx">${nextEx ? `Skip to ${nextEx.name}` : 'Finish workout'}${icon('arrow',18)}</button></div>`;
  else if (cardio && s.cardio.left == null) bottom = `<div class="logbar"><button class="btn cta-in" data-act="cardioStart">${icon('play',18)}Start ${ex.mins}-min timer</button></div>`;
  else if (cardio) bottom = `<div class="logbar row gap8"><button class="btn sec" style="flex:.8;height:56px" data-act="cardioPause">${icon(s.cardio.paused ? 'play' : 'pause',18)}${s.cardio.paused ? 'Resume' : 'Pause'}</button><button class="btn cta-in" style="flex:1" data-act="cardioDone">${icon('check',18,'stroke-width="2.4"')}Done</button></div>`;
  else if (allDone) bottom = `<div class="logbar"><button class="btn cta-in" data-act="finishEx">${icon('check',18,'stroke-width="2.4"')}Finish ${ex.name}</button></div>`;
  else bottom = `<div class="logbar"><button class="btn cta-in" data-act="setDone" data-arg="${cur}">${icon('check',18,'stroke-width="2.4"')}Set ${cur + 1} done</button></div>`;
  return { pb:120, body:`
    ${C.nav({ left:'x', leftAct:'closeActive', title:`Exercise ${s.ex + 1} of ${EX.length}`, sub:`${TODAY.title} · <span data-tick="elapsed">${fmt(s.elapsed)}</span>`, right:'more', rightAct:'finish' })}
    <div class="segs">${segs}</div>
    ${s.offline ? `<div class="offline">${icon('wifi-off',18)}<span><b>No signal.</b> Your progress is saved on this phone and syncs when you’re back online.</span></div>` : ''}
    <div class="illus">${bodyFig({ view:'front', on:ex.mus, h:140 })}${bodyFig({ view:'back', on:ex.mus, h:140 })}</div>
    <div class="card" style="margin:8px 16px 0;padding:18px 20px 16px">
      <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:28px">${ex.name}</div>
      <div class="row gap4 t13 muted" style="margin-top:6px">${icon('pin',14)}${ex.station}${cardio ? ` · ${ex.tags}` : ''}</div>
      ${ex.note ? `<div class="row gap8 t13" style="margin-top:8px;color:var(--orange);font-weight:600">${icon('user',14)}${ex.note}</div>` : ''}
      ${held ? '' : rx}${swapPending}
      <div class="qa two"><button data-act="demo">${icon('video',20)}How to</button><button data-act="swap">${icon('swap',20)}Swap</button></div>
    </div>
    ${held ? `<div class="px mt12">${C.hold(`${ex.name} is on hold`, s.where === 'outside' ? `You reported pain. Don’t continue this exercise. Coach ${COACH.first} has been told.` : `You reported pain. Don’t continue this exercise until a trainer has checked in with you. Trainer request: <b>${reqWord(s)}</b>.`)}</div>` : ''}
    ${nextEx ? `<div class="px mt16"><div class="t12 muted" style="font-weight:600;letter-spacing:.06em;margin:0 4px 8px">UP NEXT</div><div class="ex-card">${C.thumb(nextEx.mus, nextEx.view, 48)}<div style="flex:1;min-width:0"><div style="font-weight:600">${nextEx.name}</div><div class="t13 muted" style="margin-top:2px">${exMeta(nextEx)}</div></div>${icon('chev-r',18)}</div></div>` : ''}`,
    fixed:`${s.where === 'outside' ? `<div class="outtag">${icon('pin',12)}Not at ${BRAND.short}</div>` : `<div class="fab-wrap" style="${s.offline ? 'top:214px' : ''}"><button class="fab" data-act="help">${icon('headset',24)}</button><span>Trainer</span></div>`}${bottom}` };
};

/* ---------- Sheets ---------- */
const fbSheet = (s) => {
  const i = s.fbFor == null ? s.ex : s.fbFor, ex = liveEx(s, i), cur = s.fb[i], review = s.route === 'complete';
  const sub = k => ex.kind === 'cardio' ? FEEL_CARDIO[k] : FEEL.find(f => f[0] === k)[2];

    <div class="feelopts">${FEEL.map(([k, t], n) => `<button class="${cur === k ? 'on' : ''}" data-act="fbAnswer" data-arg="${k}"><span class="lv">${[1,2,3,4].map(b => `<i class="${b <= n + 1 ? 'f' : ''}" style="height:${4 + b * 3}px"></i>`).join('')}</span><b>${t}</b><span class="fs">${sub(k)}</span></button>`).join('')}</div>
    ${review || s.where === 'outside' ? '' : `<button class="hrow danger" style="width:100%;text-align:left;margin-top:12px" data-act="pain"><span class="hi">${icon('alert',20)}</span><span class="mid"><div class="ht">I felt pain</div><div class="hs">Holds this exercise and calls a trainer</div></span>${icon('chev-r',18)}</button>`}
    <button class="btn sec block mt12" data-act="fbSkip">${review ? 'Cancel' : 'Skip'}</button>`);
};
const demoSheet = (s) => {
  const ex = liveEx(s);
  return C.sheet(`<div class="sheet-head"><div><div class="h2">${ex.name}</div><div class="t13 muted row gap4" style="margin-top:4px">${icon('pin',13)}${ex.station}</div></div>${C.closeBtn()}</div>
    <div class="vid">${bodyFig({ view:ex.view, on:ex.mus, h:176 })}<span class="play">${icon('play',22)}</span><span class="vsrc">${icon('badge',12)}Filmed at ${BRAND.short}</span><span class="vdur">0:38</span></div>
    <div class="qlabel" style="margin:18px 4px 12px">${ex.kind === 'cardio' ? 'How to' : 'Setup &amp; technique'} · checked by ${COACH.first}</div>
    <ol class="olist">${ex.cues.map(c => `<li>${c}</li>`).join('')}</ol>
    ${ex.kind === 'cardio' ? '' : `<div class="mt16">${C.info('activity', '<b>Breathing:</b> breathe in on the easy part, breathe out as you push.')}</div>`}
    <button class="btn pri block mt16" data-act="closeSheet">Got it</button>`);
};
const swapSheet = (s) => {
  const ex = EX[s.ex], opts = SWAPS[s.ex] || [], pend = s.swapReq && s.swapReq.ex === s.ex;
  return C.sheet(`<div class="sheet-head"><div><div class="h2">Swap exercise</div><div class="t13 muted" style="margin-top:4px">Instead of ${ex.name} · available at ${BRAND.short}</div></div>${C.closeBtn()}</div>
    ${pend ? `<div class="card" style="padding:14px 16px;margin-bottom:12px;border-color:var(--accent-line)"><div class="row gap12"><span class="tile-ic" style="color:var(--orange)">${icon('clock',18)}</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">Waiting for ${COACH.first}</div><div class="t12 muted">Keep going with ${ex.name} for now</div></div><button class="t13" style="font-weight:600;color:var(--red);padding:8px" data-act="cancelSwap">Cancel</button></div></div>` : ''}
    ${opts.map((a, i) => `<button class="hrow" style="width:100%;text-align:left" data-act="doSwap" data-arg="${i}">${C.thumb(ex.mus, ex.view, 44)}<span class="mid"><div class="ht">${a.name}</div><div class="hs row gap4">${icon('pin',12)}${a.station}</div></span>${pend && s.swapReq.i === i ? `<span class="tag warn">Requested</span>` : icon('chev-r',18)}</button>`).join('')}
    <div class="row gap8 t12 muted" style="margin-top:16px;padding:0 4px;line-height:16px">${icon('shield',14)}Coach ${COACH.first} approves the swap and sets the weight first.</div>`);
};
const helpSheet = (s) => C.sheet(`
  <div class="sheet-head"><div><div class="h2">Get help</div><div class="t13 muted" style="margin-top:4px">On shift now: ${COACH.first} and Imran</div></div>${C.closeBtn()}</div>
  <button class="hrow primary" style="width:100%;text-align:left" data-act="callCoach" data-arg="spotting"><span class="hi">${icon('hand',22)}</span><span class="mid"><div class="ht">Call a trainer to my station</div><div class="hs">${liveEx(s).station} · setup or form help</div></span>${icon('chev-r',20)}</button>
  <button class="hrow" style="width:100%;text-align:left;margin-top:8px" data-act="callCoach" data-arg="equipment"><span class="hi">${icon('wrench',20)}</span><span class="mid"><div class="ht">Equipment problem</div><div class="hs">Broken, missing or feels unsafe</div></span>${icon('chev-r',18)}</button>

const calledSheet = (s) => {

/* ---------- Workout complete (MEM-14) ---------- */
S.complete = (s) => {
  const m = metrics(s), partial = m.exDone < m.exTotal;
  const conf = [[30,90,'var(--accent)',8,4,20],[70,60,'#fff',6,6,-30],[110,120,'var(--green)',5,10,45],[300,80,'var(--accent)',10,4,-20],[340,140,'var(--orange)',6,6,15],[260,50,'#fff',4,10,60],[50,180,'var(--orange)',8,3,-40],[330,210,'var(--accent)',5,5,30],[160,40,'var(--accent)',4,4,10],[230,110,'var(--green)',8,3,-60]];
  const rows = EX.map((_, i) => { const e = liveEx(s, i), f = s.fb[i];
    const right = s.holds[i] ? `<span class="tag bad">On hold</span>` : !s.exDone[i] ? `<span class="tag">Skipped</span>` : f ? `<button class="tag ${feelTag(f)}" data-act="rateEx" data-arg="${i}">${feelLabel(f)}</button>` : `<button class="pill acc" data-act="rateEx" data-arg="${i}">${icon('plus',12)}Rate</button>`;
    return `<div class="lrow2"><div class="mn"><div class="t" style="font-size:14px">${e.name}</div><div class="s">${exMeta(e)}</div></div>${right}</div>`; }).join('');
  return { pb:120, body:`
    ${partial ? '' : `<div class="confetti">${conf.map(([x, y, c, w, h, r], i) => `<i style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};transform:rotate(${r}deg);--r2:${r + 30}deg;opacity:${c === '#fff' ? .35 : .9};animation-delay:${i * .2}s"></i>`).join('')}</div>`}
    <div style="position:relative;z-index:1">
      <div class="row" style="justify-content:space-between;padding:6px 16px 0"><button class="btn-ic" data-act="done">${icon('x',20)}</button><span class="row gap8">${s.where === 'outside' ? `<span class="pill" style="color:var(--orange)">${icon('pin',13)}Outside ${BRAND.short}</span>` : ''}<span class="pill">${icon('cal',13)}${TODAY.date}</span></span></div>
      <div class="row gap16" style="padding:12px 24px 0">
        <div class="medal" style="width:72px;height:72px;margin:6px 6px 0;flex:none">${icon(partial ? 'check' : 'trophy', 32)}</div>
        <div><div class="h1" style="font-size:28px;line-height:32px">${partial ? 'Workout<br>saved' : 'Workout<br>complete!'}</div><div class="t13 muted" style="margin-top:4px">${TODAY.title} · ${TODAY.sub}</div></div></div>
      <div class="sum3 px mt24">
        <div><span>${icon('clock',14)}Time</span><b>${fmt(m.duration)}</b></div>

      <div class="card row" style="margin:12px 16px 0;padding:12px 16px;gap:12px">
        <div class="row" style="gap:0">${bodyFig({ view:'front', on:['chest','shoulders','quads'], h:84 })}${bodyFig({ view:'back', on:['back','traps','glutes'], h:84 })}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:15px">Muscles worked</div><div class="chips mt8" style="gap:4px">${MUSCLES.filter(mm => setsFor(s, mm, true)).map(mm => `<span class="tag acc">${mm.k} · ${setsFor(s, mm, true)} sets</span>`).join('')}</div></div></div>

        <button class="chip ${s.chips.tired ? 'on' : ''}" data-act="chip" data-arg="tired">${icon('moon',15)}Very tired</button>

function build(s){
  let base;

  return base;
}

let P = freshState();

function renderProto(){
  const host = document.getElementById('protoDevice');
  if (!host.firstChild) host.innerHTML = C.device('', { proto:true });
  const screen = host.querySelector('.screen');
  const key = protoKey(), same = key === lastKey;
  const old = screen.querySelector('.scroll'), top = same && old ? old.scrollTop : 0;
  const inputVal = screen.querySelector('[data-input]')?.value || '';
  const sheetKey = P.sheet || P.trnSheet;
  screen.innerHTML = C.phone(build(P));
  screen.classList.toggle('settled', same);
  if (same && sheetKey === lastSheet) screen.querySelectorAll('.sheet,.backdrop').forEach(el => el.style.animation = 'none');
  const sc = screen.querySelector('.scroll'); if (sc) sc.scrollTop = (!same && sc.hasAttribute('data-end')) ? sc.scrollHeight : top;
  const inp = screen.querySelector('[data-input]'); if (inp) inp.value = inputVal;
  lastKey = key; lastSheet = sheetKey;
  P.log.forEach(l => l.forEach(x => delete x.pop));
  bindRuler(screen);
  if (sc) syncSticky(sc);
}
function toast(msg){ P.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { P.toast = null; renderProto(); }, 2200); }
const req = (type, station) => ({ status:'sent', type, station, ex:P.ex });

const A = {
  noop(){},
  /* navigation */
  tab(t){ P.tab = t; P.sheet = null; if (t === 'workout' && ['active','evaluation'].includes(P.route)) P.route = 'home'; },
  go(r){ P.tab = 'workout'; P.route = r; P.sheet = null; },
  back(){ P.route = 'home'; P.sheet = null; },
  /* onboarding */
  onbNext(){ P.onb = Math.min(ONB.length - 1, P.onb + 1); }, onbBack(){ if (P.onb > 0) P.onb--; },
  consent(k){ P.consent[k] = !P.consent[k]; },
  unit(u){ P.unit = u; }, goal(g){ P.goal = g; }, exp(k){ P.exp = k; }, days(n){ P.days = +n; }, mins(n){ P.mins = +n; },
  area(k){ if (k === 'none'){ P.areas = []; return; } P.areas = P.areas.includes(k) ? P.areas.filter(a => a !== k) : [...P.areas, k]; },
  symptom(k){ P.symptom = k; },
  finishOnb(){ Object.assign(P, { route:'home', tab:'workout', planStatus:'pending', planVer:1, where:null, readiness:null }); },
  /* start: location is checked once, here. In the gym → body check. Otherwise ask. */
  ready(k){ P.readiness = k; },
  whereGym(){ P.where = 'gym'; P.locIssue = true; P.sheet = null; P.tab = 'workout'; P.route = 'ready'; }, // mismatch logged for review; visit counted
  whereElse(){ P.where = 'outside'; P.sheet = null; P.tab = 'workout'; P.route = 'ready'; },          // not counted as a visit; trainer help hidden
  painReq(){ P.req = { status:'sent', type:'discomfort', station:'Front desk', ex:0 }; P.sheet = 'called'; },
  start(){ if (P.running) return A.resume(); if (P.planStatus !== 'approved'){ P.sheet = null; return; }
    if (P.loc === 'in'){ P.where = 'gym'; P.sheet = null; P.tab = 'workout'; P.route = 'ready'; } else P.sheet = 'where'; },
  begin(){ if (P.planStatus !== 'approved'){ P.route = 'home'; return; } if (!P.running){ Object.assign(P, { running:true, elapsed:0, ex:0, completed:false }); } P.tab = 'workout'; P.route = 'active'; P.sheet = null; },
  resume(){ P.tab = 'workout'; P.route = 'active'; },
  closeActive(){ P.route = 'home'; P.sheet = null; },
  /* strength: tap each set when done; all done → optional feedback */
  setDone(i){ i = +i; if (P.route !== 'active') return; if (P.holds[P.ex]){ P.sheet = 'pain'; return; }
    const set = P.log[P.ex][i]; if (!set) return;
    set.done = !set.done; if (set.done && P.offline) P.pendingSync++;
    if (set.done && P.log[P.ex].every(x => x.done)){ P.sheet = 'fb'; P.fbFor = P.ex; } },
  finishEx(){ P.sheet = 'fb'; P.fbFor = P.ex; },
  /* cardio timer */
  cardioStart(){ const t = liveEx(P).mins * 60; P.cardio = { left:t, total:t, paused:false }; },
  cardioPause(){ P.cardio.paused = !P.cardio.paused; },
  cardioDone(){ P.cardio.paused = true; P.sheet = 'fb'; P.fbFor = P.ex; },
  /* feedback: optional, per exercise */
  fbAnswer(k){ const i = P.fbFor == null ? P.ex : P.fbFor; P.fb[i] = k; P.sheet = null; if (P.offline) P.pendingSync++;
    if (P.route === 'complete'){ P.fbFor = null; toast('Saved'); return; } A._completeEx(); toast('Saved'); },
  fbSkip(){ P.sheet = null; if (P.route === 'complete'){ P.fbFor = null; return; } A._completeEx(); },
  rateEx(i){ P.fbFor = +i; P.sheet = 'fb'; },
  _completeEx(){ P.exDone[P.ex] = true; P.fbFor = null; A._advance(); },
  _advance(){ P.cardio = { left:null, total:0, paused:false }; const n = EX.findIndex((_, i) => i > P.ex && !P.exDone[i]); if (n > -1) P.ex = n; else A.finish(); },
  demo(){ P.sheet = 'demo'; }, swap(){ P.sheet = 'swap'; },
  doSwap(i){ if (P.log[P.ex].some(x => x.done) || P.cardio.left != null){ toast('Finish this exercise first, or swap the next one'); return; } P.swapReq = { ex:P.ex, i:+i }; P.sheet = null; toast(`Swap sent to ${COACH.first}`); },
  cancelSwap(){ P.swapReq = null; toast('Swap request cancelled'); },
  nextEx(){ P.sheet = null; P.fbFor = null; A._advance(); },
  finish(){ Object.assign(P, { route:'complete', running:false, sheet:null, fbFor:null, tab:'workout', cardio:{ left:null, total:0, paused:false } }); },
  chip(k){ P.chips[k] = !P.chips[k]; },
  done(){ Object.assign(P, { route:'home', completed:true, running:false }); },
  /* help */
  help(){ P.sheet = 'help'; },
  callCoach(type){ P.req = req(type || 'spotting', liveEx(P).station); P.sheet = 'called'; },
  cancelCall(){ P.req = null; P.sheet = null; toast('Request cancelled'); },
  reqFeedback(v){ P.sheet = null; P.req = null; toast(v === 'yes' ? 'Thanks · shared with the gym' : 'Thanks · the gym will follow up'); },
  pain(){ P.holds[P.ex] = true; P.cardio.paused = true; P.fbFor = null; P.req = P.where === 'outside' ? null : req('discomfort', liveEx(P).station); P.sheet = 'pain'; },
  closeSheet(){ P.sheet = null; if (P.route === 'complete') P.fbFor = null; },
  msgCoach(){ P.sheet = null; P.tab = 'coach'; },
  /* AI coach — deterministic answers first; free text is the only "model" path */
  aiQuick(k){
    const ex = liveEx(P), run = P.running && !P.completed, n = Math.min(curSet(P) + 1, P.log[P.ex].length), set = P.log[P.ex][n - 1];
    const Q = {
      next:['What’s next?', { src:'plan', t: !run ? `Today starts with <b>${EX[0].name}</b>, ${EX[0].mins} minutes. Tap Start workout to begin.`
        : ex.kind === 'cardio' ? `<b>${ex.name}</b>: ${ex.mins} minutes, ${ex.target}.` : `<b>${ex.name}</b>, set ${n}: <b>${kg(set.w)} ${ex.unit} × ${set.r}</b>.` }],
      breathe:['How should I breathe?', { src:'cues', t:'Breathe in and brace as you lower the weight. Breathe out as you push. Don’t hold your breath for the whole set.', acts:[['Watch setup','demo']] }],
      where:['Where is cable stack 1?', { src:'equip', t:'<b>Cable stack 1</b> is on the back wall, left of the dumbbell rack. Today you use it for Lat Pulldown.' }],
      sore:['I feel sore.', { src:'cues', t:'Is it general muscle soreness, or sharp pain in a joint?', acts:[['Muscle soreness','aiSore'],['Sharp pain','aiPain',1]] }],
      ravi:['I want to talk to Coach Ravi.', { src:'plan', t:`Coach ${COACH.first} is on shift ${COACH.shift}.`, acts: run ? [['Message','msgCoach'],['Call to my station','help',1]] : [['Message Ravi','msgCoach',1]] }],
    };
    const [q, a] = Q[k]; P.ai.push({ who:'me', t:q }, { who:'ai', ...a }); P.ai = P.ai.slice(-12); setTimeout(scrollChat, 0);
  },
  aiSore(){ P.ai.push({ who:'me', t:'Muscle soreness' }, { who:'ai', src:'cues', t:'Some soreness after training is normal. Do the full warm-up and stick to your planned weights. If it turns sharp, stop and get a trainer.' }); setTimeout(scrollChat, 0); },
  aiPain(){ P.ai.push({ who:'me', t:'Sharp pain' }, { who:'ai', src:'stop', t:`Stop the exercise that hurts and don’t add weight. If the pain is severe or sudden, or you feel unwell, get medical help.`, acts:[['Call a trainer','aiCallPain',1]] }); if (P.running) P.holds[P.ex] = true; setTimeout(scrollChat, 0); },
  aiCallPain(){ P.req = req('discomfort', P.running ? liveEx(P).station : 'Gym floor'); P.sheet = 'called'; },
  aiSend(){ const inp = document.querySelector('#protoDevice [data-input]'), v = inp?.value.trim(); if (!v || P.aiCapped) return 'noRender'; inp.value = '';
    P.ai.push({ who:'me', t:esc(v) }, { who:'ai', src:'ai', t:`Today is ${TODAY.title}: ${EX.length} exercises on ${BRAND.short} equipment. For weight changes or anything that hurts, Coach ${COACH.first} decides.` }); setTimeout(scrollChat, 0); },
  askRavi(){ P.tab = 'coach'; P.chat.push({ who:'me', t:'Can I go heavier on leg press today?', tm:'Now' }); },
  /* trainer chat */
  callFromCoach(){ if (P.running){ P.tab = 'workout'; P.route = 'active'; P.sheet = 'help'; } else toast(`Calling ${COACH.first}…`); },
  focusInput(){ document.querySelector('#protoDevice [data-input]')?.focus(); return 'noRender'; },
  send(){ const inp = document.querySelector('#protoDevice [data-input]'), v = inp?.value.trim(); if (!v) return 'noRender'; inp.value = '';
    P.chat.push({ who:'me', t:esc(v), tm:'Now' });
    setTimeout(() => { P.chat.push({ who:'them', t:'Got it. I’ll come by your station after this client.', tm:'Now' }); renderProto(); scrollChat(); }, 1400);
    setTimeout(scrollChat, 0); },
  /* progress + check-in */
  photosOn(){ P.consent.photos = true; toast('Progress photos turned on'); },
  evAddW(){ P.ev.weight = 85; }, evW(d){ P.ev.weight = Math.round((P.ev.weight + +d) * 10) / 10; },
  ev(k){ const [f, v] = k.split(':'); P.ev[f] = v; },
  evSubmit(){ P.ev.saved = true; toast(`Sent to Coach ${COACH.first}`); }, evEdit(){ P.ev.saved = false; },
};
function scrollChat(){ const sc = document.querySelector('#protoDevice .scroll'); if (sc) sc.scrollTop = sc.scrollHeight; }

function jump(r){
  P.fbFor = null;
  if (r.startsWith('loc-')){ P.loc = r.slice(4); document.querySelectorAll('#locJump button').forEach(b => b.classList.toggle('on', b.dataset.jump === r)); renderProto(); return; }
  P.sheet = null;
  switch (r){
    case 'reset': { const loc = P.loc; P = freshState(); P.loc = loc; if (loc === 'in') P.sheet = 'atgym'; break; }
    case 'atgym': Object.assign(P, { tab:'workout', route:'home' }); if (P.running) A.resume(); else if (P.loc === 'in' && !P.completed) P.sheet = 'atgym'; break;
    case 'onb': Object.assign(P, { route:'onb', onb:0, tab:'workout' }); break;
    case 'pending': Object.assign(P, { tab:'workout', route:'home', planStatus:'pending', planVer:1, running:false, where:null, readiness:null }); break;
    case 'active': if (P.running) A.resume(); else { Object.assign(P, { planStatus:'approved', where:P.where || (P.loc === 'in' ? 'gym' : 'outside'), readiness:P.readiness && P.readiness !== 'pain' ? P.readiness : 'ready' }); A.begin(); } break;
    case 'complete': if (!Object.keys(P.exDone).length) P = completedState(); else A.finish(); break;
    case 'ai': case 'coach': case 'profile': P.tab = r; if (P.route === 'onb') P.route = 'home'; break;
    default: P.tab = 'workout'; P.route = r;
  }
  renderProto();
}

/* ruler drag (onboarding) */
function bindRuler(screen){
  const r = screen.querySelector('[data-ruler]'); if (!r) return;
  const track = r.querySelector('.ruler-track');
  let sx = 0, sw = 0, drag = false;
  r.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; sw = P.weight; r.setPointerCapture(e.pointerId); track.style.transition = 'none'; });
  r.addEventListener('pointermove', e => {
    if (!drag) return;
    const per = P.unit === 'kg' ? 1 : 1 / 2.20462;
    P.weight = Math.min(150, Math.max(40, Math.round((sw - (e.clientX - sx) / (10 * DZ) * per) * 2) / 2));
    const val = P.unit === 'kg' ? P.weight : P.weight * 2.20462, min = +r.dataset.min;
    track.style.transform = `translateX(${-(val - min) * 10}px)`;
    screen.querySelector('[data-w]').textContent = (Math.round(val * 2) / 2).toFixed(1).replace(/\.0$/, '');
  });
  r.addEventListener('pointerup', () => { drag = false; track.style.transition = ''; });
}

/* collapsing sticky header: hysteresis avoids flicker when the header height changes */
function syncSticky(sc){
  const h = sc.querySelector('.home-top'); if (!h) return;
  const on = h.classList.contains('compact'), t = sc.scrollTop;
  if (!on && t > 24) h.classList.add('compact');
  else if (on && t < 4) h.classList.remove('compact');
}
document.addEventListener('scroll', e => { if (e.target.classList?.contains('scroll')) syncSticky(e.target); }, true);

/* event delegation for the prototype */
document.addEventListener('click', e => {
  const jt = e.target.closest('[data-jump]'); if (jt){ jump(jt.dataset.jump); return; }
  const op = e.target.closest('[data-open]'); if (op){ openFrame(op.dataset.open); return; }
  const tg = e.target.closest('[data-theme]'); if (tg){ setTheme(tg.dataset.theme); return; }
  const proto = e.target.closest('#protoDevice');
  if (!proto) return;
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = A[t.dataset.act]; if (!fn) return;
  if (fn(t.dataset.arg) === 'noRender') return;
  renderProto();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#protoDevice [data-input]')){ if (P.tab === 'ai' && P.role === 'member') A.aiSend(); else A.send(); renderProto(); scrollChat(); } });

/* live ticking: elapsed + cardio countdown without full re-render */
setInterval(() => {
  if (!P.running) return;
  P.elapsed++;
  const host = document.getElementById('protoDevice');
  host.querySelectorAll('[data-tick="elapsed"]').forEach(el => el.textContent = fmt(P.elapsed));
  const c = P.cardio;
  if (c.left != null && !c.paused && isCardio(P)){
    c.left = Math.max(0, c.left - 1);
    host.querySelectorAll('[data-tick="cardio"]').forEach(el => el.textContent = fmt(c.left));
    const pr = host.querySelector('.cprog'); if (pr) pr.setAttribute('stroke-dashoffset', (ringC * c.left / c.total).toFixed(1));
    if (c.left === 0){ c.paused = true; if (P.route === 'active' && P.tab === 'workout'){ P.sheet = 'fb'; P.fbFor = P.ex; } renderProto(); }
  }
}, 1000);

/* fit phones to the window height and desktop frames to the canvas width (CSS zoom keeps hit-testing correct) */
let DZ = 1;
function fitDevices(){
  DZ = Math.max(0.55, Math.min(1, (window.innerHeight - 72) / 868));
  const dzd = Math.max(0.42, Math.min(1, (Math.min(window.innerWidth, 2000) - 136) / 1282));
  document.documentElement.style.setProperty('--dz', DZ.toFixed(3));
  document.documentElement.style.setProperty('--dzd', dzd.toFixed(3));
}
fitDevices();
window.addEventListener('resize', fitDevices);

/* theme */
function setTheme(t){
  document.body.className = 'theme-' + t;
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('jodi-theme', t); } catch(e){}
  renderSwatches();
}
document.querySelector('[data-theme="dark"]').innerHTML = icon('moon', 16) + 'Dark';
document.querySelector('[data-theme="light"]').innerHTML = icon('sun', 16) + 'Light';

renderCanvas();
P.sheet = 'atgym';
renderProto();
try { const t = localStorage.getItem('jodi-theme'); if (t) setTheme(t); } catch(e){}
</script>
