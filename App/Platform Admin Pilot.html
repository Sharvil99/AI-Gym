.ring-badge{white-space:nowrap}

/* screen & feature index (canvas level, always light) */
html{scroll-behavior:smooth}
.cv-section[id],.frame[id]{scroll-margin-top:24px}
.ix-jump{color:#111;font-weight:600;text-decoration:none;border-bottom:1.5px solid #C7CBD1;margin-left:6px}
.idx-wrap{display:grid;gap:24px}
.idx{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(17,24,39,.05);padding:20px 24px 12px}
.idx-h{display:flex;align-items:baseline;gap:12px;padding:0 12px 4px}
.idx-h h3{font-size:17px;font-weight:700;color:#111;letter-spacing:-.01em}
.idx-h span{font-size:13px;color:#6B7280}
.idx table{width:100%;border-collapse:collapse;font-size:13px;color:#111}
.idx th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9CA3AF;padding:14px 12px 10px;border-bottom:1px solid #E5E7EB}
.idx td{padding:11px 12px;border-bottom:1px solid #F1F2F4;vertical-align:top;line-height:1.45}
.idx tr:last-child td{border-bottom:0}
.idx tr:not(.grp):hover td{background:#FAFAFB}
.idx .n{color:#9CA3AF;font-variant-numeric:tabular-nums;font-weight:600}
.idx .sc{font-weight:600}
.idx .feat{color:#4B5563}
.idx .prd{font-size:10px;font-weight:700;letter-spacing:.06em;color:#6B7280;background:#EEF0F3;border-radius:6px;padding:3px 6px;white-space:nowrap}
.idx .grp td{background:#F7F8FA;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;padding:10px 12px;border-bottom:1px solid #EEF0F3}
.idx .acts{white-space:nowrap;text-align:right}
.idx .acts a,.idx .acts button{display:inline-block;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:#F3F4F6;color:#111;text-decoration:none;cursor:pointer;margin-left:4px}
.idx .acts button{background:#121212;color:#fff}
.ix-link{display:inline-block;min-width:28px;text-align:center;font-size:12px;font-weight:600;padding:3px 6px;margin:0 4px 4px 0;border-radius:6px;background:#F3F4F6;color:#111;text-decoration:none;font-variant-numeric:tabular-nums}
.ix-link:hover,.idx .acts a:hover{background:#E5E7EB}
.ix-link.wide{padding:3px 8px}
.ix-top{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;color:#6B7280;text-decoration:none}

/* platform admin · locked "after pilot" pattern */
.dside .nlab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:18px 12px 6px}
.dside .ni.locked{color:var(--text-3)}
.dside .ni.locked .ic{color:var(--text-3)}
.dside .ni.locked.on{background:var(--raised);color:var(--text-2)}
.soon{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);border:1px dashed var(--line-2);border-radius:999px;padding:3px 8px;white-space:nowrap}
.lockrow .at{color:var(--text-2)}
.dlocked{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px dashed var(--line-2);font-size:13px;color:var(--text-2)}
.dlocked b{color:var(--text);font-weight:600}
.lockbig{width:72px;height:72px;border-radius:50%;background:var(--raised);color:var(--text-2);display:grid;place-items:center}
.lockprev{margin-top:32px;display:flex;flex-direction:column;align-items:center}
.lockprev .dgrid{filter:blur(1.2px) grayscale(.4);opacity:.55;pointer-events:none}
/* gyms list: scales to any number of gyms */
.kpi .kv2.warn{color:var(--orange)}
.theme-light .kpi .kv2.warn{color:#B85E00}
.nxtc{display:flex;align-items:center;gap:8px}
.nxtc .t{display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nxtc .wdot{width:6px;height:6px;border-radius:50%;background:var(--orange);flex-shrink:0}
.morec{flex-shrink:0;height:20px;padding:0 7px;border-radius:999px;background:var(--raised);color:var(--text-2);font-size:11px;font-weight:700;display:inline-flex;align-items:center}
.dtable td.go{width:24px;padding-left:0;color:var(--text-3)}
.dtable th .sort{display:inline-flex;vertical-align:-2px;color:var(--text-2)}
.dtable .row.gap6{gap:6px}
/* pilot setup + one-go equipment entry */
.setnote{display:flex;align-items:center;gap:10px;margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--raised);font-size:13px;color:var(--text-2)}
.setnote b{color:var(--text);font-weight:600}
.eqcard{padding:12px 10px 0;display:flex;flex-direction:column;overflow:hidden}
.eqcard .dtable td{padding:7px 10px}
.ein{height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-weight:500;font-size:13px;box-sizing:border-box}
.theme-light .ein{background:var(--bg)}
.ein .caret{margin-left:auto;padding-left:6px;color:var(--text-3);display:inline-flex}
.ethumb{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--raised)),var(--raised));color:var(--text-2)}
.ethumb.add{background:transparent;border:1px dashed var(--line-2);color:var(--text-3)}
.eqadd{display:flex;align-items:center;gap:8px;padding:12px 10px 14px;margin-top:auto;border-top:1px solid var(--line-2);font-size:13px;font-weight:600;color:var(--text-2)}
.pchip{height:28px;min-width:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.eqscroll{flex:1;min-height:0;overflow:hidden;position:relative}
.eqscroll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,var(--card));pointer-events:none}
.eqtable{table-layout:fixed}
.eqtable .ein{width:100%}
.eqtable td.go{text-align:right;padding-right:6px}
.pchip{min-width:34px;padding:0 6px}
.eqtable .ein:not(.sel){display:block;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqtable td{padding-left:6px;padding-right:6px}
.eqtable .ein.sel{display:flex;width:100%}
.dfld div.ph{justify-content:flex-start}
.dcheck{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2)}
.dcheck .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--text-3);display:grid;place-items:center;box-sizing:border-box}
.dcheck.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* add-gym form: one centred column, cards with headings on top, 2-up fields */
.desk.tall{height:auto;min-height:820px}
.desk.tall .dmain{overflow:visible}
.fcol{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ftitle{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:30px;margin-bottom:4px}
.fbox{padding:22px 24px 24px}
.fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.fhead h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .full{grid-column:1/-1}
.fgrid .dfld div{height:42px}
.fgrid .dfld div.notes{height:96px}
.optl{color:var(--text-3);font-weight:500;margin-left:4px;font-size:12px}
.dfld .pre{align-self:stretch;display:flex;align-items:center;padding-right:10px;margin-right:2px;border-right:1px solid var(--line-2);color:var(--text-2);font-weight:600}
.dfld .fv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfld .suf{display:inline-flex;color:var(--text-3)}
.ffoot{display:flex;justify-content:flex-end;gap:8px;padding:4px 0 6px}
/* add-gym wizard */
.wfoot{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px}
.flab{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.fbox .eqtable{margin:0 -6px;width:calc(100% + 12px)}
.fbox .eqadd{margin:4px 0 -8px;padding:14px 0 0}

.wsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:2px 0 6px;align-items:start}
.wstep{display:flex;flex-direction:column;gap:2px;min-width:0}
.wstep .wbar{height:4px;border-radius:4px;background:var(--line-2);margin-bottom:10px}
.theme-light .wstep .wbar{background:var(--line)}
.wstep.done .wbar,.wstep.now .wbar{background:var(--accent)}
.wstep .wsk{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-3)}
.wstep .wsl{font-size:13px;font-weight:600;color:var(--text-3)}
.wstep.now .wsl{color:var(--text)}
.wstep.done .wsl{color:var(--text-2)}
.wstep .wso{font-size:12px;font-weight:500;color:var(--text-3);margin-left:6px}
.wstep.now .wsk{color:var(--accent)}
.theme-light .wstep.now .wsk{color:#D9531E}
.pchip{height:32px;padding:0 12px;gap:6px;color:var(--text-2);cursor:default}
.pchip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.pchip.on .ic{color:var(--accent)}
.theme-light .pchip.on .ic{color:#D9531E}
.dcard .kv{align-items:center}
/* ---------- interactive states (prototype + rules board) ---------- */
button.dbtn,button.pchip,button.ethumb,button.xbtn,button.fback,.fchips button{border:0;font-family:inherit;cursor:pointer}
button.dbtn{font-size:13px;font-weight:700}
button.dbtn.sm{font-size:12px}
.dbtn.off,.dbtn:disabled{opacity:.4;pointer-events:none}
button.pchip{background:transparent;border:1px solid var(--line-2);font-size:12px;font-weight:600}
button.pchip.on{background:var(--accent-soft);border-color:var(--accent-line)}
button.pchip:not(.on):hover{border-color:var(--text-3)}
.fchips button{height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.fchips button b{color:var(--text);font-weight:700}
.fchips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.fchips button.on b{color:var(--bg)}
.dfld .fi input,.dfld .fi select,.dfld .fi textarea,.ein input,.ein select,.tabox input{all:unset;box-sizing:border-box;flex:1;min-width:0;width:100%;height:100%;font-family:inherit;font-size:13px;font-weight:500;color:var(--text)}
.dfld .fi input::placeholder,.dfld .fi textarea::placeholder,.ein input::placeholder,.tabox input::placeholder{color:var(--text-3)}
.dfld .fi select,.ein select{cursor:pointer}
.dfld .fi select.empty{color:var(--text-3)}
.dfld .fi select option,.ein select option{color:#111;background:#fff}
.dfld .fi{transition:border-color .12s,box-shadow .12s}
.dfld .fi:hover,.dfld .fi.is-hover{border-color:var(--text-3)}
.dfld .fi:focus-within,.dfld .fi.is-focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dfld.err .fi,.dfld.err .fi:hover{border-color:var(--red)}
.dfld.err .fi:focus-within{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.ferr{display:block;margin-top:6px;font-size:12px;font-weight:500;color:var(--red)}
.dfld.dis .fi{background:var(--raised);opacity:.6;pointer-events:none}
.fgrid .dfld .fi.ta,.dfld .fi.ta{height:96px;align-items:flex-start;padding:10px 12px}
.dfld .fi textarea{resize:none;line-height:20px;white-space:pre-wrap}
.ein{transition:border-color .12s,box-shadow .12s}
.ein:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.eqtable .ein input{height:30px}
.ethumb.add{cursor:pointer}
button.ethumb.has{background-size:cover;background-position:center}
.xbtn{background:none;color:var(--text-3);display:grid;place-items:center;width:26px;height:26px;border-radius:7px}
.xbtn:hover{background:var(--raised);color:var(--text)}
.dcheck{cursor:pointer;user-select:none}
.dcheck:hover .box{border-color:var(--text-2)}
.dcheck.on .box{border-color:var(--accent)}
.dcheck:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.fback{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:-8px;background:none;padding:0;width:max-content}
.fback:hover{color:var(--text)}
/* equipment search */
.tawrap{position:relative;margin-bottom:14px}
.tabox{height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;font-weight:500;color:var(--text-3);transition:border-color .12s,box-shadow .12s;box-sizing:border-box}
.theme-light .tabox{background:var(--bg)}
.tabox:hover{border-color:var(--text-3)}
.tabox:focus-within,.tabox.is-focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabox .fv{color:var(--text)}
.fv.fph,.tabox .fv.fph{color:var(--text-3)}
.tadrop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.35);padding:6px;max-height:320px;overflow:auto}
.theme-light .tadrop{box-shadow:0 14px 36px rgba(0,0,0,.12)}
.taitem{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;font-size:13px;cursor:pointer}
.taitem.on,.taitem:hover{background:var(--raised)}
.taitem .tan{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--text-2)}
.taitem .tan b{font-weight:700;color:var(--text)}
.taitem .tat{font-size:12px;color:var(--text-3)}
.taitem .taadded{font-size:11px;font-weight:700;color:var(--green)}
.taitem.add{color:var(--text);font-weight:600;margin-top:4px;position:relative}
.taitem.add::before{content:"";position:absolute;left:4px;right:4px;top:-3px;height:1px;background:var(--line-2)}
.eqcount{font-size:12px;color:var(--text-3);padding-top:12px;text-align:right}
.eqempty{padding:26px 0 14px;text-align:center;font-size:13px;color:var(--text-3)}
/* prototype desk */
.pdesk{position:relative}
.pdesk .dmain{overflow-y:auto;overscroll-behavior:contain}
.pdesk .ni{cursor:pointer}
.pdesk .ni:not(.on):hover{background:var(--raised)}
.pdesk .prow{cursor:pointer}
.pdesk .prow:hover td{background:var(--raised)}
.pdesk .tabox input{color:var(--text)}
.plogo{display:inline-block;border-radius:50%;background-size:cover;background-position:center;flex:none}
.dinput{all:unset;box-sizing:border-box;height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;font-size:12px;font-weight:600;color:var(--text);color-scheme:dark;font-family:inherit}
.theme-light .dinput{color-scheme:light}
.dinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pmodal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center}
.mcard{width:560px;max-height:680px;overflow:auto;background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:22px 24px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.mcard h3{font-size:16px;font-weight:700;margin-bottom:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.pastepv{margin-top:10px;max-height:200px;overflow:auto}
.pvrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.pvrow .pvl{color:var(--text-2)} .pvrow .pvr{font-weight:600} .pvrow .pvr.cust{color:var(--orange)}
.trow{display:grid;grid-template-columns:1fr 1fr 26px;gap:12px;margin-bottom:12px;align-items:start}
.trow .dfld .fi{height:42px}
.ptoast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.ptoast[hidden]{display:none}
.ptbar{display:flex;align-items:center;gap:8px;margin:-8px 0 18px}
.ptbar button{height:32px;padding:0 12px;border-radius:8px;border:1px solid #D9DCE1;background:#fff;font:600 12px var(--font);color:#111;cursor:pointer}
.ptbar button:hover{background:#F3F4F6}
/* developer rules board */
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1282px}
.scard{background:var(--bg);color:var(--text);border:1px solid var(--line-2);border-radius:18px;padding:22px 24px}
.scard h3{font-size:15px;font-weight:700;margin-bottom:16px}
.srow{display:flex;flex-wrap:wrap;gap:18px 20px;align-items:flex-start}
.sspec{min-width:180px}
.sspec .dfld{width:200px}
.scap{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.srules{margin:18px 0 0;padding-left:18px;font-size:13px;line-height:20px;color:var(--text-2)}
.srules li+li{margin-top:4px}
.svals{margin-top:16px;width:100%;border-collapse:collapse;font-size:12.5px}
.svals td,.svals th{padding:7px 0;border-top:1px solid var(--line-2);vertical-align:top;text-align:left}
.svals th{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.svals td:first-child{color:var(--text-2);width:38%;padding-right:12px}
.svals.wide td:first-child{width:46%}
.svals.tok td:first-child{width:30%}
.svals.tok i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-2px;border:1px solid var(--line-2)}

.dfld .fi select{display:block;line-height:40px}
.ein select{display:block;height:30px;line-height:30px}
.scard .tadrop{position:static;margin-top:6px;box-shadow:none}
.scard .tawrap{margin:0}
/* gym location: Google Maps link */
.gmeta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}

.gopen{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--text);text-decoration:none}
.gopen:hover{text-decoration:underline}
a.dbtn{text-decoration:none}
.sspec .wide .dfld{width:100%}

/* Admin sign in */
.alog{align-items:center;justify-content:center;background:var(--bg)}
.alog-card{width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;gap:20px}
.alog-brand{display:flex;align-items:center;gap:10px}
.alog-h{font-size:22px;font-weight:700;letter-spacing:-.02em}
.alog-sub{font-size:13px;color:var(--text-2);margin-top:6px}
.alog .dbtn{justify-content:center;height:40px;width:100%}
.aotp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.aotp i{height:48px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;font-size:20px;font-weight:700;font-style:normal;font-variant-numeric:tabular-nums}
.aotp i.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.alog-row{display:flex;justify-content:space-between;font-size:13px}
.alog-foot{font-size:12px;color:var(--text-3);text-align:center}
/* ===== Brands & branches ===== */
.bpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btile{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card-2);font:inherit;font-size:13px;font-weight:600;color:var(--text-2);text-align:left;cursor:pointer}
.btile:hover{border-color:var(--text-3)}
.btile .bico{width:30px;height:30px;border-radius:9px;background:var(--raised);display:grid;place-items:center;color:var(--text-2);flex:none}
.btile .bdot{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text-3);flex:none}
.btile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card));color:var(--text)}
.btile.on .bico{color:var(--accent)}
.btile.on .bdot{border:5px solid var(--accent)}
.bchip{height:20px;padding:0 8px;border-radius:999px;border:0;background:var(--raised);font:inherit;font-size:11px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap}
.bchip:hover{color:var(--text);background:var(--line-2)}
.bfixed{display:flex;align-items:center;gap:10px;font-size:13px}
.dfld.dis > div:not(.fi){background:var(--raised);opacity:.6}
.bmeta{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-2);margin-top:8px}
.bmeta:empty{display:none}
.bwrap{position:relative}
.bwrap .bdrop-host{position:absolute;left:0;right:0;top:68px;z-index:30}
.bwrap .bdrop-host .tadrop{position:static;margin-top:0}
span.bmeta{display:flex}
.ptabs{display:flex;gap:26px;border-bottom:1px solid var(--line-2)}
.ptabs button,.ptabs span{display:flex;align-items:center;gap:7px;padding:2px 2px 12px;margin-bottom:-1px;background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
.ptabs b{font-weight:700;color:var(--text-3)}
.ptabs .on{color:var(--text);border-bottom-color:var(--accent)}
.ptabs .on b{color:var(--text)}
</style>

/* Every typed word must appear in the name, aliases or type.
   Ranking: name starts with query > a word in the name starts with it > substring > alias-only. */
function searchEquip(q, limit = 8){
  const nq = normTxt(q); if (!nq) return [];
  const words = nq.split(' ');
  const out = [];
  for (const it of EQUIP_CATALOG){
    if (!words.every(w => it._h.includes(w))) continue;
    let s = it._n.startsWith(nq) ? 100 : (' ' + it._n).includes(' ' + nq) ? 70 : it._n.includes(nq) ? 45 : words.every(w => it._n.includes(w)) ? 30 : 10;
    out.push([s - it._n.length * 0.15, it]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, limit).map(x => x[1]);
}

  const listRows = (brandId = null) => {

  /* ---------- brands tab: one row per brand. Facts only; status stays per gym. ---------- */
  const brandListRows = () => {
    const q = S.bsq.trim().toLowerCase();

      .filter(b => !q || [b.n, b.owner.name, ...branchesOf(b.id).flatMap(g => [g.branch, g.city])].some(v => String(v).toLowerCase().includes(q)));

  };
  const vGyms = () => {
    const G = S.gyms, live = G.filter(g => g.live).length, need = G.filter(g => openItems(g).length).length, items = G.reduce((a, g) => a + openItems(g).length, 0);
    const wk = G.filter(g => g.live && (TODAY - g.liveFrom) / 864e5 <= 7).length, B = S.brands.filter(b => branchesOf(b.id).length);
    const k = (l, v, d, cls = '') => `<div class="dcard kpi" style="padding:14px 18px"><div class="kl">${l}</div><div class="kv2 ${cls}" style="font-size:26px">${v}</div><div class="kd">${d}</div></div>`;

    const tab = (v, l, n) => `<button class="${S.tab === v ? 'on' : ''}" data-a="tab" data-v="${v}" role="tab" aria-selected="${S.tab === v}">${l} <b>${n}</b></button>`;
    const gymsTab = `<div class="row gap12"><div class="fi tabox" style="width:290px">${icon('search', 15)}<input data-search placeholder="Search gym, branch, city or owner" value="${esc(S.q)}" autocomplete="off"></div>
        <div class="fchips">${chip('all', 'All', G.length)}${chip('live', 'Live', live)}${chip('setup', 'Setting up', G.length - live)}${chip('action', 'Needs action', need)}</div></div>
      <div class="dcard" style="padding:14px 10px 6px"><table class="dtable"><tr><th>Gym</th><th>Status</th><th>Go-live</th><th>Members</th><th>Setup</th><th>Owner</th><th>Next step</th><th></th></tr><tbody id="pt-rows">${listRows()}</tbody></table></div>`;
    const brandsTab = `<div class="row"><div class="fi tabox" style="width:290px">${icon('search', 15)}<input data-bsq placeholder="Search brand, branch or owner" value="${esc(S.bsq)}" autocomplete="off"></div></div>
      <div class="dcard" style="padding:14px 10px 6px"><table class="dtable"><tr><th>Brand</th><th>Branches</th><th>Members</th><th>Owner</th><th>Owner mobile</th><th></th></tr><tbody id="pt-brrows">${brandListRows()}</tbody></table></div>`;

  /* ---------- brand page: its branches and "Add a gym" with the brand already selected ---------- */
  const vBrand = () => {

    return `<button class="fback" data-a="nav" data-v="gyms">${icon('chev-l', 14)}Gyms</button>

        <div class="dfilt"><button class="dbtn sec" data-a="editbrand">Edit brand</button><button class="dbtn" data-a="addbranch" data-id="${b.id}">${icon('plus', 14)}Add a gym</button></div></div>
      <div class="dgrid" style="grid-template-columns:repeat(3,1fr)">${k('Branches', G.length, `${G.length - live} setting up`)}${k('Members using the app', G.reduce((a, g) => a + g.mem, 0), `${live} live`)}${k('Owner', esc(b.owner.name), `+91 ${tel(b.owner.mob)}`, false)}</div>
      <div class="row gap12"><div class="fi tabox" style="width:290px">${icon('search', 15)}<input data-bsearch placeholder="Search branch, city or contact" value="${esc(S.bq)}" autocomplete="off"></div>
        <div class="fchips">${chip('all', 'All', G.length)}${chip('live', 'Live', live)}${chip('setup', 'Setting up', G.length - live)}${chip('action', 'Needs action', need)}</div></div>
      <div class="dcard" style="padding:14px 10px 6px"><table class="dtable"><tr><th>Branch</th><th>Status</th><th>Go-live</th><th>Members</th><th>Setup</th><th>Point of contact</th><th>Next step</th><th></th></tr><tbody id="pt-brows">${listRows(b.id)}</tbody></table></div>`;
  };

  /* ---------- form fields ---------- */
  const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
  const setP = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
  const inp = (label, path, o = {}) => {
    const W = S.wiz, src = o.from || path, v = getP(W.d, src) ?? '', err = W.err[path];
    const val = o.mask === 'tel' ? tel(v) : v;
    return `<div class="dfld${o.full ? ' full' : ''}${err ? ' err' : ''}${o.dis ? ' dis' : ''}"><label>${label}${o.opt ? ' <span class="optl">optional</span>' : ''}</label>
      <div class="fi">${o.pre ? `<span class="pre">${o.pre}</span>` : ''}<input data-f="${path}" ${o.mask ? `data-mask="${o.mask}" inputmode="numeric"` : ''} ${o.type ? `type="${o.type}"` : ''} value="${esc(val)}" placeholder="${esc(o.ph || '')}" autocomplete="off" ${o.dis ? 'disabled tabindex="-1"' : ''}></div>${err ? `<span class="ferr">${err}</span>` : ''}</div>`;
  };
  const selState = () => {
    const v = S.wiz.d.gym.state, err = S.wiz.err['gym.state'];

  };
  const person = (p, same) => fGrid(`${inp('Name', p + '.name', { dis:same, from: same ? 'owner.name' : null })}${inp('Email', p + '.email', { opt:1, type:'email', dis:same, from: same ? 'owner.email' : null })}
    ${inp('Mobile', p + '.mob', { pre:'+91', mask:'tel', dis:same, from: same ? 'owner.mob' : null })}${inp('Alternate mobile', p + '.alt', { pre:'+91', mask:'tel', opt:1, dis:same, from: same ? 'owner.alt' : null })}`);

  /* ---------- validation ---------- */
  const RULES = {
    0: [['brand.name', 'req'], ['gym.branch', 'req'], ['gym.phone', 'tel'], ['gym.email', 'email?'], ['gym.addr1', 'req'], ['gym.area', 'req'], ['gym.city', 'req'], ['gym.state', 'req'], ['gym.pin', 'pin'], ['gym.maps', 'maps']],
    1: [['owner.name', 'req'], ['owner.mob', 'tel'], ['owner.alt', 'tel?'], ['owner.email', 'email?'], ['poc.name', 'req'], ['poc.mob', 'tel'], ['poc.alt', 'tel?'], ['poc.email', 'email?']],
  };
  const check = (v, r) => {
    v = String(v || '').trim(); const opt = r.endsWith('?'); r = r.replace('?', '');
    if (!v) return opt ? '' : 'Required';
    if (r === 'tel' && digits(v).length !== 10) return 'Enter a 10-digit number';
    if (r === 'pin' && digits(v).length !== 6) return 'Enter a 6-digit PIN code';
    if (r === 'maps' && parseMaps(v).bad) return 'Paste a Google Maps link';
    if (r === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Enter a valid email';
    return '';
  };
  const validate = step => {
    const W = S.wiz, e = {};
    const existing = !!W.d.brand.id;
    (RULES[step] || []).forEach(([p, r]) => { if (p.startsWith('poc.') && W.d.poc.same) return; if (p.startsWith('owner.') && existing && W.d.ownerSame) return; const m = check(getP(W.d, p), r); if (m) e[p] = m; });
    return e;
  };

  /* ---------- wizard ---------- */
  const blankData = () => ({ brand:{ id:'', name:'' }, ownerSame:false, gym:{ branch:'', phone:'', email:'', addr1:'', addr2:'', area:'', city:'', state:'', pin:'', maps:'' }, owner:{ name:'', email:'', mob:'', alt:'' }, poc:{ same:false, name:'', email:'', mob:'', alt:'' }, notes:'',
    eq:{ items:[], bars:['Olympic · 20 kg'], plates:['2.5', '5', '10', '15', '20', '25'] } });
  const newWiz = (mode = 'create', g = null, brandId = null) => { const w = { mode, step:0, err:{}, gymId: g ? g.id : null,
    d: g ? { brand:{ id:g.brandId, name:brandOf(g).n }, ownerSame: g.ownerBrand, gym:{ branch:g.branch, phone:g.phone, email:g.email, addr1:g.addr1, addr2:g.addr2, area:g.area, city:g.city, state:g.state, pin:g.pin, maps:g.maps || '' }, owner:clone(ownerOf(g)), poc:clone(g.poc), notes:g.notes, eq:clone(g.eq) } : blankData() };
    if (brandId){ const b = S.brands.find(x => x.id === brandId); Object.assign(w.d, { brand:{ id:brandId, name:b.n }, ownerSame:true, owner:clone(b.owner) }); }
    return w; };
  const wizBrand = () => S.wiz.d.brand.id ? S.brands.find(b => b.id === S.wiz.d.brand.id) : null;
  // Brand: type a name. Suggestions are existing brands; picking one (or typing its exact name) adds a branch to it.
  // Anything else creates a new brand. Every gym also gets a branch name, so a second branch never needs a fix-up.
  const normB = t => String(t || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const brandMeta = () => { const d = S.wiz.d, b = wizBrand();
    if (b) return `${icon('layers', 13)}Existing brand · ${plural(branchesOf(b.id).length, 'branch', 'branches')} · owner ${esc(b.owner.name)}`;
    return d.brand.name.trim() ? `${icon('plus', 13)}New brand` : ''; };
  const brandField = () => {
    const W = S.wiz, d = W.d, b = wizBrand(), err = W.err['brand.name'];
    if (W.mode === 'edit') return `<div class="dfld full dis"><label>Brand</label><div class="fi"><input value="${esc(b.n)}" disabled tabindex="-1"></div><span class="bmeta">${icon('layers', 13)}${plural(branchesOf(b.id).length, 'branch', 'branches')}</span></div>`;
    return `<div class="full bwrap"><div class="dfld${err ? ' err' : ''}"><label>Brand</label><div class="fi"><input data-brand value="${esc(d.brand.name)}" placeholder="Type a brand name" autocomplete="off" role="combobox" aria-expanded="false"></div>${err ? `<span class="ferr">${err}</span>` : ''}<span class="bmeta" id="pt-bmeta">${brandMeta()}</span></div><div class="bdrop-host"></div></div>`;
  };
  const bdRender = () => {
    const host = root.querySelector('.bdrop-host'), box = root.querySelector('[data-brand]'); if (!host) return;

    const res = S.brands.filter(b => !q || normB(b.n).includes(q)).sort((a, b) => a.n.localeCompare(b.n)).slice(0, 6), exact = res.some(b => normB(b.n) === q);
    S.bd.res = res; S.bd.n = res.length + (q && !exact ? 1 : 0); if (S.bd.i >= S.bd.n) S.bd.i = 0;

    host.innerHTML = `<div class="tadrop" role="listbox">${res.map((b, i) => `<div class="taitem${i === S.bd.i ? ' on' : ''}" data-bi="${b.id}" role="option"><span class="tan">${q ? taHL(b.n, S.wiz.d.brand.name.trim()) : esc(b.n)}</span><span class="tat">${plural(branchesOf(b.id).length, 'branch', 'branches')}</span></div>`).join('')}
      ${q && !exact ? `<div class="taitem add${S.bd.i === res.length ? ' on' : ''}" data-bnew>${icon('plus', 14)}New brand “${esc(S.wiz.d.brand.name.trim())}”</div>` : ''}</div>`;
    box && box.setAttribute('aria-expanded', 'true');
  };
  const pickBrand = id => { const d = S.wiz.d, b = S.brands.find(x => x.id === id); Object.assign(d, { brand:{ id:b.id, name:b.n }, ownerSame:true, owner:clone(b.owner) }); delete S.wiz.err['brand.name']; S.bd = { open:false, i:0, res:[], n:0 }; render({ keep:true }); };
  const ownerCard = () => {
    const d = S.wiz.d;

  };
  const vWizard = () => {
    const W = S.wiz, d = W.d, names = W.mode === 'edit' ? ['Gym details', 'Contacts'] : STEPS_CREATE, last = W.step === names.length - 1;
    const stepper = `<div class="wsteps" style="grid-template-columns:repeat(${names.length},1fr)">${names.map((t, i) => `<div class="wstep ${i < W.step ? 'done' : i === W.step ? 'now' : ''}" ${i < W.step ? `data-a="wizgo" data-i="${i}" style="cursor:pointer"` : ''}><span class="wbar"></span><span class="wsk">Step ${i + 1}</span><span class="wsl">${t}${i === 2 ? '<span class="wso">optional</span>' : ''}</span></div>`).join('')}</div>`;

    if (W.step === 0) body = fCard('Gym details', fGrid(`${brandField()}${inp('Branch', 'gym.branch', { full:1, ph:'Location, e.g. Banjara Hills' })}${inp('Phone', 'gym.phone', { pre:'+91', mask:'tel' })}${inp('Email', 'gym.email', { type:'email' })}
      ${inp('Address line 1', 'gym.addr1', { full:1, ph:'Building, street' })}${inp('Address line 2', 'gym.addr2', { full:1, opt:1, ph:'Floor, landmark' })}${inp('Area / locality', 'gym.area')}${inp('City', 'gym.city')}${selState()}${inp('PIN code', 'gym.pin', { mask:'pin' })}
      ${inp('Google Maps link', 'gym.maps', { full:1, type:'url', ph:'Paste the gym’s share link' })}<div class="full" id="pt-geo" style="margin-top:-8px">${geoMeta(d.gym.maps)}</div>`));
    if (W.step === 1) body = `${ownerCard()}${fCard('Point of contact', person('poc', d.poc.same), `<span class="dcheck${d.poc.same ? ' on' : ''}" data-a="same" role="checkbox" aria-checked="${d.poc.same}" tabindex="0"><span class="box">${d.poc.same ? icon('check', 12, 'stroke-width="3"') : ''}</span>Same as owner</span>`)}
      ${fCard('Notes <span class="optl">optional</span>', fGrid(`<div class="dfld full"><div class="fi ta"><textarea data-f="notes">${esc(d.notes)}</textarea></div></div>`))}`;
    if (W.step === 2) body = vEditor(d.eq);

    return `<div class="fcol">${W.mode === 'edit' ? `<button class="fback" data-a="open" data-id="${W.gymId}">${icon('chev-l', 14)}${esc(dispName(S.gyms.find(g => g.id === W.gymId)))}</button>` : ''}<h1 class="ftitle">${W.mode === 'edit' ? 'Edit gym' : 'Add a gym'}</h1>${stepper}${body}<div class="wfoot">${back}${fwd}</div></div>`;
  };

  /* ---------- equipment editor ---------- */
  const vEditor = E => {
    const noPhoto = E.items.filter(x => !x.photo).length;
    const rows = E.items.map((x, i) => `<tr>
      <td><button class="ethumb${x.photo ? ' has' : ' add'}" data-a="photo" data-i="${i}" title="Add photo" ${x.photo ? `style="background-image:url(${x.photo})"` : ''}>${x.photo ? '' : icon('camera', 15)}</button></td>
      <td><div class="ein"><input data-row="${i}" data-k="name" value="${esc(x.name)}"></div></td>
      <td><div class="ein sel"><select data-row="${i}" data-k="type">${EQUIP_TYPES.map(t => `<option ${t === x.type ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="caret">${caretDown()}</span></div></td>
      <td><div class="ein"><input data-row="${i}" data-k="qty" data-mask="qty" inputmode="numeric" value="${esc(x.qty)}"></div></td>
      <td><div class="ein"><input data-row="${i}" data-k="load" value="${esc(x.load)}" placeholder="e.g. 5–100 kg"></div></td>
      <td class="go"><button class="xbtn" data-a="rm" data-i="${i}" title="Remove">${icon('x', 15)}</button></td></tr>`).join('');
    const table = E.items.length ? `<table class="dtable eqtable"><colgroup><col style="width:52px"><col><col style="width:136px"><col style="width:60px"><col style="width:136px"><col style="width:28px"></colgroup>

      case 'create': createGym(true); break;
      case 'chip': { const arr = E[el.dataset.g], k = arr.indexOf(v); if (k < 0) arr.push(v); else arr.splice(k, 1); render({ keep:true }); break; }
      case 'rm': E.items.splice(i, 1); render({ keep:true }); break;
      case 'photo': photoRow = i; root.querySelector('[data-file="row"]').click(); break;
      case 'bulk': if (!E.items.some(x => !x.photo)) { toast(E.items.length ? 'Every item has a photo' : 'Add equipment first'); break; } root.querySelector('[data-file="bulk"]').click(); break;
      case 'paste': S.modal = 'paste'; S.paste = ''; render({ focus:'[data-paste]', keep:true }); break;
      case 'paste-add': {
        const lines = (S.paste || '').split('\n').map(parseLine).filter(Boolean);
        lines.forEach(x => x.it ? addEquip(x.it, x.qty) : E.items.push({ name:x.raw, type:'Other', qty:x.qty, load:'', photo:null }));
        S.modal = null; render({ keep:true }); toast(`${lines.length} item${lines.length === 1 ? '' : 's'} added`); break; }
      case 'close': S.modal = null; render({ keep:true }); break;
      case 'close-bg': S.modal = null; render({ keep:true }); break;
      case 'equip': go('equip', { draft:clone(g.eq) }); break;
      case 'saveeq': { g.eq = clone(S.draft); const wentLive = checkLive(g); go('gym', { draft:null }); toast(wentLive ? `${dispName(g)} is live` : `Equipment saved · ${g.eq.items.length} items`); break; }
      case 'logo': root.querySelector('[data-file="logo"]').click(); break;
      case 'trainers': S.trn = g.trainers.length ? clone(g.trainers) : [{ name:'', mob:'' }]; S.modal = 'trainers'; render({ keep:true, focus:'[data-tr="0"][data-k="name"]' }); break;
      case 'tadd': S.trn.push({ name:'', mob:'' }); render({ keep:true, focus:`[data-tr="${S.trn.length - 1}"][data-k="name"]` }); break;
      case 'trm': S.trn.splice(i, 1); if (!S.trn.length) S.trn.push({ name:'', mob:'' }); render({ keep:true }); break;
      case 'tsave': {
        let bad = false;
        S.trn.forEach(t => { t.e1 = t.e2 = ''; if (!t.name.trim() && !digits(t.mob)) return; if (!t.name.trim()) { t.e1 = 'Required'; bad = true; } if (digits(t.mob).length !== 10) { t.e2 = 'Enter a 10-digit number'; bad = true; } });
        if (bad){ render({ keep:true }); return; }
        const list = S.trn.filter(t => t.name.trim()).map(t => ({ name:t.name.trim(), mob:digits(t.mob) }));
        g.trainers = list; const wentLive = checkLive(g); S.modal = null; render({ keep:true });
        toast(wentLive ? `${dispName(g)} is live` : list.length ? `Invites sent to ${list.length} trainer${list.length === 1 ? '' : 's'}` : 'Trainers removed'); break; }
      case 'resend': toast(`Sign-in link sent to +91 ${tel(ownerOf(g).mob)}`); break;
      case 'qr': toast('Gym QR downloaded'); break;
      case 'call': { const p = poc(g); toast(`${p.name} · +91 ${tel(p.mob)}`); break; }
      case 'edit': go('add', { wiz:newWiz('edit', g) }); break;
    }
  }
  function onInput(e){
    const t = e.target;
    if (t.dataset.mask === 'tel'){ const pos = t.value.length; t.value = tel(t.value); }
    if (t.dataset.mask === 'pin') t.value = digits(t.value).slice(0, 6);
    if (t.dataset.mask === 'qty') t.value = digits(t.value).slice(0, 3);
    if (t.hasAttribute('data-search')){ S.q = t.value; root.querySelector('#pt-rows').innerHTML = listRows(); return; }
    if (t.hasAttribute('data-bsq')){ S.bsq = t.value; root.querySelector('#pt-brrows').innerHTML = brandListRows(); return; }
    if (t.hasAttribute('data-brand')){
      const d = S.wiz.d, had = d.brand.id, hit = S.brands.find(b => normB(b.n) === normB(t.value));
      d.brand.name = t.value; d.brand.id = hit ? hit.id : '';
      if (hit && hit.id !== had){ d.ownerSame = true; d.owner = clone(hit.owner); }
      if (!hit && had){ d.ownerSame = false; d.owner = { name:'', email:'', mob:'', alt:'' }; }
      if (S.wiz.err['brand.name']){ delete S.wiz.err['brand.name']; const f = t.closest('.dfld'); f.classList.remove('err'); const m = f.querySelector('.ferr'); m && m.remove(); }
      root.querySelector('#pt-bmeta').innerHTML = brandMeta(); S.bd.open = true; S.bd.i = 0; bdRender(); return; }
    if (t.hasAttribute('data-bsearch')){ S.bq = t.value; root.querySelector('#pt-brows').innerHTML = listRows(S.brandId); return; }
    if (t.dataset.be){ S.bedit[t.dataset.be] = t.value; return; }
    if (t.hasAttribute('data-ta')){ S.ta.q = t.value; S.ta.i = 0; S.ta.open = true; taRender(); return; }
    if (t.hasAttribute('data-paste')){ S.paste = t.value; const lines = t.value.split('\n').map(parseLine).filter(Boolean); root.querySelector('#pt-pv').innerHTML = pvRows(lines);
      const b = root.querySelector('#pt-pvbtn'); b.textContent = `Add ${lines.length || ''} item${lines.length === 1 ? '' : 's'}`; b.disabled = !lines.length; b.classList.toggle('off', !lines.length); return; }
    if (t.dataset.tr != null){ S.trn[+t.dataset.tr][t.dataset.k] = t.value; return; }
    if (t.dataset.row != null){ ed().items[+t.dataset.row][t.dataset.k] = t.value; return; }
    if (t.dataset.f){
      const W = S.wiz, p = t.dataset.f;
      setP(W.d, p, t.value);
      if (W.err[p]){ delete W.err[p]; const f = t.closest('.dfld'); f.classList.remove('err'); const m = f.querySelector('.ferr'); m && m.remove(); }
      if (p === 'gym.maps'){ const h = root.querySelector('#pt-geo'); if (h) h.innerHTML = geoMeta(t.value); }
      if (p === 'gym.branch') W.branchEdited = !!t.value.trim();
      if (p === 'gym.area' && !W.branchEdited && W.mode !== 'edit'){ W.d.gym.branch = t.value; const bi = root.querySelector('[data-f="gym.branch"]'); if (bi){ bi.value = t.value; if (W.err['gym.branch'] && t.value.trim()){ delete W.err['gym.branch']; const f = bi.closest('.dfld'); f.classList.remove('err'); const m = f.querySelector('.ferr'); m && m.remove(); } } }
      if (p.startsWith('owner.') && W.d.poc.same){ const m = root.querySelector(`[data-f="poc.${p.slice(6)}"]`); if (m) m.value = t.value; }
    }
  }
  function onChange(e){
    const t = e.target;
    if (t.tagName === 'SELECT' && t.dataset.f){ onInput(e); t.classList.toggle('empty', !t.value); return; }
    if (t.tagName === 'SELECT' && t.dataset.row != null){ ed().items[+t.dataset.row].type = t.value; return; }
    if (t.hasAttribute('data-golive')){ const g = gym(); g.golive = t.value ? new Date(t.value + 'T00:00') : null; const wentLive = checkLive(g); render({ keep:true }); if (wentLive) toast(`${dispName(g)} is live`); return; }
    if (t.dataset.file === 'row' && t.files[0]){ ed().items[photoRow].photo = URL.createObjectURL(t.files[0]); render({ keep:true }); return; }
    if (t.dataset.file === 'bulk' && t.files.length){
      const free = ed().items.filter(x => !x.photo); let n = 0;
      [...t.files].forEach((f, k) => { if (free[k]) { free[k].photo = URL.createObjectURL(f); n++; } });
      render({ keep:true }); toast(`${n} photo${n === 1 ? '' : 's'} added`); return; }
    if (t.dataset.file === 'logo' && t.files[0]){ const g = gym(), b = brandOf(g), url = URL.createObjectURL(t.files[0]); b.logo = url; branchesOf(b.id).forEach(x => { x.logo = url; }); const wentLive = checkLive(g); render({ keep:true });
      toast(wentLive ? `${dispName(g)} is live` : isChain(g) ? `Logo added · all ${branchesOf(b.id).length} branches` : 'Logo added'); }
  }
  function onKey(e){
    const t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-brand')){
      if (e.key === 'ArrowDown' && S.bd.n){ e.preventDefault(); S.bd.i = (S.bd.i + 1) % S.bd.n; bdRender(); }
      else if (e.key === 'ArrowUp' && S.bd.n){ e.preventDefault(); S.bd.i = (S.bd.i - 1 + S.bd.n) % S.bd.n; bdRender(); }
      else if (e.key === 'Enter'){ e.preventDefault(); if (S.bd.open && S.bd.i < S.bd.res.length) pickBrand(S.bd.res[S.bd.i].id); else { S.bd.open = false; bdRender(); } }
      else if (e.key === 'Escape'){ S.bd.open = false; bdRender(); }
      return;
    }
    if (t.hasAttribute && t.hasAttribute('data-ta')){
      if (e.key === 'ArrowDown' && S.ta.n){ e.preventDefault(); S.ta.i = (S.ta.i + 1) % S.ta.n; taRender(); }
      else if (e.key === 'ArrowUp' && S.ta.n){ e.preventDefault(); S.ta.i = (S.ta.i - 1 + S.ta.n) % S.ta.n; taRender(); }
      else if (e.key === 'Enter'){ e.preventDefault(); if (S.ta.q.trim()) chooseTa(S.ta.i); }
      else if (e.key === 'Escape'){ S.ta.open = false; taRender(); }
      return;
    }
    if ((e.key === ' ' || e.key === 'Enter') && t.dataset && (t.dataset.a === 'same' || t.dataset.a === 'samebrand')){ e.preventDefault(); t.click(); return; }
    if (e.key === 'Escape' && S.modal){ S.modal = null; render({ keep:true }); }
  }
  function onMouseDown(e){
    const bi = e.target.closest('[data-bi]'); if (bi && root.contains(bi)){ e.preventDefault(); pickBrand(bi.dataset.bi); return; }
    const bn = e.target.closest('[data-bnew]'); if (bn && root.contains(bn)){ e.preventDefault(); S.bd.open = false; bdRender(); return; }
    const it = e.target.closest('.taitem'); if (!it || !root.contains(it)) return;
    e.preventDefault(); chooseTa(+it.dataset.ti);
  }

  return {
    mount(el){
      root = el; render();
      el.addEventListener('click', onClick); el.addEventListener('input', onInput); el.addEventListener('change', onChange);
      el.addEventListener('keydown', onKey); el.addEventListener('mousedown', onMouseDown);
      el.addEventListener('focusin', e => { if (e.target.hasAttribute('data-ta')) { S.ta.open = true; taRender(); } if (e.target.hasAttribute('data-brand')) { S.bd.open = true; bdRender(); } });
      el.addEventListener('focusout', e => { if (e.target.hasAttribute('data-brand')) setTimeout(() => { const f = document.activeElement; if (f && f.hasAttribute && f.hasAttribute('data-brand')) return; S.bd.open = false; bdRender(); }, 120); });
      el.addEventListener('focusout', e => { if (e.target.hasAttribute('data-ta')) setTimeout(() => { const f = document.activeElement; if (f && f.hasAttribute && f.hasAttribute('data-ta')) return; S.ta.open = false; taRender(); }, 120); });
    },
    reset(){ S = fresh(); render(); },
    sample: fillSample,
  };
})();

function renderCanvas(){
  let html = `<header class="cv-head"><div class="cv-title"><div class="lg">${icon('layers',24)}</div><div><h1>${OPS_PAGE.title}</h1><p>${OPS_PAGE.tagline}</p></div></div></header>
    <p class="cv-sub">${OPS_PAGE.intro}</p>`;
  if (OPS_PAGE.pre) html += OPS_PAGE.pre();
  OPS_PAGE.sections.forEach(sec => {
    html += `<section class="cv-section"><h2>${sec.title}</h2>${sec.note ? `<p class="cv-sub" style="margin-top:-12px">${sec.note}</p>` : ''}<div class="cv-row">`;
    sec.items.forEach(([n, label, prd, k, hint]) => {
      html += `<div class="frame"><div class="frame-label"><span class="n">${n}</span>· ${label}<span class="prd">${prd}</span>${hint ? `<span class="hint">${hint}</span>` : ''}</div>${O[k]()}</div>`;
    });
    html += '</div></section>';
  });
  if (OPS_PAGE.post) html += OPS_PAGE.post();
  document.getElementById('canvas').innerHTML = html;

}
function fitDesks(){
  const dzd = Math.max(0.42, Math.min(1, (Math.min(window.innerWidth, 2000) - 136) / 1282));
  document.documentElement.style.setProperty('--dzd', dzd.toFixed(3));
}
fitDesks();
window.addEventListener('resize', fitDesks);
function setTheme(t){
  document.body.className = 'theme-' + t;
  document.querySelectorAll('#themeToggle button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('ops-theme', t); } catch(e){}
}
document.addEventListener('click', e => { const tg = e.target.closest('[data-theme]'); if (tg) setTheme(tg.dataset.theme); });
document.querySelector('[data-theme="dark"]').innerHTML = icon('moon', 16) + 'Dark';
document.querySelector('[data-theme="light"]').innerHTML = icon('sun', 16) + 'Light';
renderCanvas();
try { const t = localStorage.getItem('ops-theme'); if (t) setTheme(t); } catch(e){}
