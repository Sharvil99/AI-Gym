<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platform Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. BRAND (per-gym) — overwritten at runtime from BRAND{}
   ========================================================= */
:root{
  --brand-accent-dark:#D7F45B;
  --brand-accent-ink-dark:#121212;
  --brand-accent-light:#FF6B35;
  --brand-accent-ink-light:#FFFFFF;
  --canvas:#EEF0F3;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --green:#3DDC84; --orange:#FF9F43; --red:#FF5A5F;
  --r-card:24px; --r-pill:999px;
}

/* =========================================================
   2. THEME TOKENS — one class swap flips every screen
   ========================================================= */
.theme-dark{
  --bg:#121212; --bg-glow:rgba(255,255,255,.045);
  --card:#1E1E1E; --card-2:#242424; --raised:#2C2C2C; --raised-2:#333333;
  --text:#FFFFFF; --text-2:#9A9A9A; --text-3:#5E5E5E;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10);
  --accent:var(--brand-accent-dark); --accent-ink:var(--brand-accent-ink-dark);
  --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --accent-soft-2:color-mix(in srgb,var(--accent) 24%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 45%,transparent);
  --cta-bg:#FFFFFF; --cta-ink:#121212; --cta-shadow:0 12px 32px rgba(0,0,0,.45);
  --glass:rgba(34,34,34,.72); --glass-line:rgba(255,255,255,.10);
  --card-shadow:none; --card-hi:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 40%);
  --btn-ic:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  --body-base:#2A2A2A; --body-muscle:#3B3B3B; --body-line:#161616;
  --ring-track:rgba(255,255,255,.08); --stripe:rgba(255,255,255,.09);
  --status-ink:#121212; --sb:#FFFFFF;
}
.theme-light{
  --bg:#F5F5F7; --bg-glow:rgba(255,255,255,.9);
  --card:#FFFFFF; --card-2:#F4F4F6; --raised:#EEEEF1; --raised-2:#E6E6EA;
  --text:#111113; --text-2:#6E6E76; --text-3:#AEAEB5;
  --line:rgba(0,0,0,.05); --line-2:rgba(0,0,0,.08);
  --accent:var(--brand-accent-light); --accent-ink:var(--brand-accent-ink-light);
  --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --accent-soft-2:color-mix(in srgb,var(--accent) 20%,transparent);
  --accent-line:color-mix(in srgb,var(--accent) 45%,transparent);
  --cta-bg:#111113; --cta-ink:#FFFFFF; --cta-shadow:0 12px 28px rgba(17,17,19,.22);
  --glass:rgba(255,255,255,.78); --glass-line:rgba(0,0,0,.06);
  --card-shadow:0 1px 2px rgba(16,16,24,.03),0 8px 24px rgba(16,16,24,.05); --card-hi:none;
  --btn-ic:#FFFFFF;
  --body-base:#E2E2E7; --body-muscle:#CFCFD6; --body-line:#FFFFFF;
  --ring-track:rgba(0,0,0,.06); --stripe:rgba(0,0,0,.07);
  --status-ink:#FFFFFF; --sb:#111113;
}

/* =========================================================
   3. CANVAS
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;color:#111;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
.canvas{padding:32px 64px 120px;max-width:2000px;margin:0 auto}
.cv-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}
.cv-title{display:flex;align-items:center;gap:16px}
.cv-title .lg{width:48px;height:48px;border-radius:14px;background:#121212;color:#D7F45B;display:grid;place-items:center}
.cv-title h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.cv-title p{font-size:14px;color:#6B7280;margin-top:2px}
.theme-toggle{position:fixed;top:24px;right:32px;z-index:100;display:flex;padding:4px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(17,24,39,.08)}
.theme-toggle button{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#6B7280;cursor:pointer;transition:all .2s}
.theme-toggle button.on{background:#121212;color:#fff}
.cv-section{margin-bottom:72px}
.cv-section h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9CA3AF;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.cv-section h2::after{content:"";flex:1;height:1px;background:#DDE0E5}
.cv-row{display:flex;flex-wrap:wrap;gap:56px 48px;align-items:flex-start}
.frame{display:flex;flex-direction:column;gap:16px}
.frame-label{font-size:14px;font-weight:600;color:#111;display:flex;gap:8px;align-items:baseline;padding-left:8px}
.frame-label .n{color:#9CA3AF;font-variant-numeric:tabular-nums}
.frame-label .hint{font-weight:500;color:#9CA3AF;font-size:12px;margin-left:auto;padding-right:8px}

/* prototype side panel */
.proto-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:56px;align-items:start}
.proto-wrap .is-proto{grid-column:2;grid-row:1}
.panel{max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px;padding-top:36px}
.panel.left{grid-column:1;grid-row:1;justify-self:end}
.panel.right{grid-column:3;grid-row:1;justify-self:start}
@media (max-width:1300px){.proto-wrap{grid-template-columns:auto minmax(0,1fr);row-gap:16px}.panel.left{grid-column:2;justify-self:start}.panel.right{grid-column:2;grid-row:2;justify-self:start;padding-top:0}.proto-wrap .is-proto{grid-column:1;grid-row:1/3}}
.panel-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(17,24,39,.05)}
.panel-card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.panel-card p.sub{font-size:13px;color:#6B7280;margin-bottom:16px;line-height:1.5}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump button{padding:8px 14px;border-radius:999px;background:#F3F4F6;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.jump button:hover{background:#E5E7EB}
.jump button.dark{background:#121212;color:#fff}
.tips{list-style:none;display:grid;gap:10px;font-size:13px;color:#374151;line-height:1.45}
.tips li{display:flex;gap:10px}
.tips li b{font-weight:600;color:#111}
.tips li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#C7CBD1;margin-top:6px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px;font-size:11px;color:#6B7280}
.sw i{display:block;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.06)}
.sw b{color:#111;font-weight:600;font-size:12px}
.typespec{display:flex;align-items:baseline;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid #F0F1F3}
.typespec .big{font-size:40px;font-weight:700;letter-spacing:-.03em}
.typespec .big span{font-size:18px;color:#9CA3AF;font-weight:500}

/* =========================================================
   4. DEVICE FRAME
   ========================================================= */
.device{zoom:var(--dz,1);position:relative;width:414px;height:868px;padding:12px;border-radius:67px;
  background:linear-gradient(150deg,#3a3a3e 0%,#151517 18%,#0c0c0e 60%,#2a2a2e 100%);
  box-shadow:inset 0 0 0 1.5px #4a4a50,inset 0 0 0 6px #0b0b0c,0 60px 80px -40px rgba(17,24,39,.45),0 24px 48px -24px rgba(17,24,39,.35)}
.device .btn-side{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2a2e,#4a4a50)}
.screen i{font-style:normal}
.screen{position:relative;width:390px;height:844px;border-radius:55px;overflow:hidden;background:var(--bg);color:var(--text);isolation:isolate;font-size:15px;letter-spacing:-.005em}
.screen::before{content:"";position:absolute;inset:0 0 auto;height:320px;background:radial-gradient(120% 100% at 50% 0%,var(--bg-glow),transparent 70%);pointer-events:none;z-index:0}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:80}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 48px;z-index:79;color:var(--sb);pointer-events:none}
.sb .time{font-size:17px;font-weight:600;letter-spacing:-.01em}
.sb .icons{display:flex;gap:6px;align-items:center}
.sb-fade{position:absolute;top:0;left:0;right:0;height:62px;background:linear-gradient(var(--bg) 70%,transparent);z-index:40;pointer-events:none}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);z-index:90;opacity:.9}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:54px;z-index:1;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* =========================================================
   5. PRIMITIVES
   ========================================================= */
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .acc{color:var(--accent)}
.px{padding-left:16px;padding-right:16px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.card{position:relative;background:var(--card);background-image:var(--card-hi);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;box-shadow:var(--card-shadow)}
.theme-light .card{border-color:transparent}
.h1{font-size:30px;line-height:36px;font-weight:800;letter-spacing:-.025em}
.h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.t13{font-size:13px;line-height:18px}.t12{font-size:12px;line-height:16px}.t11{font-size:11px;line-height:14px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:24px 16px 12px}
.sec-title h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sec-title a{font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:2px}

.btn-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--btn-ic);border:1px solid var(--line-2);color:var(--text);position:relative;flex:none}
.theme-light .btn-ic{border-color:rgba(0,0,0,.04);box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04)}
.btn-ic .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;height:56px;position:relative;z-index:2}
.nav .title{position:absolute;left:72px;right:72px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .title small{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-top:1px}

.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--raised);color:var(--text);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.theme-light .pill.acc{color:color-mix(in srgb,var(--accent) 85%,#000)}
.pill.ghost{background:transparent;border:1px solid var(--line-2)}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap}
.btn.sec{background:var(--raised);color:var(--text)}
.theme-light .btn.sec{background:var(--card-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.cta{position:absolute;left:24px;right:24px;bottom:34px;height:56px;border-radius:999px;background:var(--cta-bg);color:var(--cta-ink);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--cta-shadow);z-index:30}
.fade-b{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,var(--bg) 55%);z-index:20;pointer-events:none}

.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--raised);font-size:11px;font-weight:600;color:var(--text-2)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.theme-light .tag.acc{color:color-mix(in srgb,var(--accent) 85%,#000)}
.divider{height:1px;background:var(--line-2)}
.theme-light .divider{background:var(--line)}
.toggle{width:52px;height:32px;border-radius:999px;background:var(--raised-2);position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.7,.4,1.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}

/* bars */
.bar{height:6px;border-radius:999px;background:var(--raised);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent);animation:barIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes barIn{from{width:0}}
.sbar{position:relative;height:28px;border-radius:999px;background:repeating-linear-gradient(-55deg,var(--stripe) 0 2px,transparent 2px 7px)}
.sbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);animation:barIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.sbar>i>b{position:absolute;right:3px;top:3px;bottom:3px;padding:0 8px;border-radius:999px;background:#fff;color:#121212;font-size:12px;font-weight:700;display:flex;align-items:center}
.segbar{display:flex;gap:4px}
.segbar>i{flex:1;height:6px;border-radius:999px;background:var(--raised)}
.segbar>i.on{background:var(--accent)}
.segbar>i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--raised) 50%)}
.ticks{display:flex;gap:3px;height:20px;align-items:stretch}
.ticks>i{flex:1;border-radius:2px;background:var(--raised)}
.ticks>i.on{background:var(--orange)}

/* rings */
.ring{position:relative;flex:none}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-p{animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ring-in{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.ring-badge{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);height:18px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;color:var(--status-ink);display:flex;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--card)}
.rings{display:flex;justify-content:space-between}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:12px;width:76px}
.ring-item .lb{font-size:13px;font-weight:600}

/* body figure */
.fig .bm{fill:var(--body-muscle);stroke:var(--body-line);stroke-width:1.1;stroke-linejoin:round;transition:fill .3s}
.fig .bb{fill:var(--body-base);stroke:var(--body-line);stroke-width:1.1}
.fig .bm.on{fill:var(--accent)}
.fig .seam{stroke:var(--body-line);stroke-width:1.1;fill:none}

/* avatar */
.av{border-radius:50%;flex:none;position:relative;overflow:hidden;display:grid;place-items:center}
.av svg{position:absolute;inset:0}
.av .on-dot{position:absolute}

/* thumbnail */
.thumb{width:56px;height:56px;border-radius:16px;flex:none;background:linear-gradient(160deg,var(--raised),var(--card-2));display:grid;place-items:center;overflow:hidden;position:relative;border:1px solid var(--line)}
.thumb .pl{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.theme-light .thumb .pl{background:rgba(0,0,0,.35)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.lrow .t{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:13px;color:var(--text-2);margin-top:2px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.lrow .s i{width:3px;height:3px;border-radius:50%;background:var(--text-3);display:inline-block}
.lrow .mid{flex:1;min-width:0}
.more{width:32px;height:32px;border-radius:50%;background:var(--raised);display:grid;place-items:center;color:var(--text-2);flex:none}

/* tab bar + mini bar */
.tabbar{position:absolute;left:24px;right:24px;bottom:26px;height:68px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-line);display:flex;padding:6px;z-index:35;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.theme-light .tabbar{box-shadow:0 10px 30px rgba(16,16,24,.10)}
.tab{flex:1;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-2);transition:all .25s}
.tab.on{background:var(--raised);color:var(--text)}
.theme-light .tab.on{background:var(--card-2)}
.tab.on .ic{color:var(--accent)}
.minibar{position:absolute;left:32px;right:32px;bottom:104px;height:60px;border-radius:22px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-line);display:flex;align-items:center;padding:0 8px 0 16px;gap:12px;z-index:34;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:popUp .4s cubic-bezier(.2,.8,.2,1) both}
.theme-light .minibar{box-shadow:0 10px 30px rgba(16,16,24,.10)}
.minibar .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--accent);display:flex;align-items:center;gap:6px}
.theme-light .minibar .lbl{color:color-mix(in srgb,var(--accent) 90%,#000)}
.minibar .lbl i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}
.minibar .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.minibar .tm{height:44px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.theme-light .minibar .tm{color:color-mix(in srgb,var(--accent) 90%,#000)}
@keyframes blink{50%{opacity:.25}}
@keyframes popUp{from{transform:translateY(16px);opacity:0}}

/* bottom sheet */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;animation:fadeIn .3s ease both}
.theme-light .backdrop{background:rgba(20,20,28,.28)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:44px;background:var(--card);border:1px solid var(--line-2);z-index:61;padding:12px 16px 32px;animation:slideUp .45s cubic-bezier(.2,.9,.25,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.theme-light .sheet{border-color:transparent;box-shadow:0 -10px 40px rgba(16,16,24,.12)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--raised-2);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 4px 16px}
@keyframes slideUp{from{transform:translateY(105%)}}
@keyframes fadeIn{from{opacity:0}}
.settled .sheet,.settled .backdrop,.settled .minibar{animation:none}
.settled .bar>i,.settled .sbar>i,.settled .ring-p,.settled .anim{animation:none!important}

/* toast */
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:85;background:var(--cta-bg);color:var(--cta-ink);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:var(--cta-shadow);animation:toastIn .35s cubic-bezier(.2,.9,.25,1) both}
@keyframes toastIn{from{transform:translate(-50%,-20px);opacity:0}}

/* =========================================================
   6. SCREEN-SPECIFIC
   ========================================================= */
/* onboarding */
.onb-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;height:56px}
.onb-prog{width:120px;height:4px;border-radius:2px;background:var(--raised-2);overflow:hidden}
.onb-prog i{display:block;height:100%;background:var(--text);border-radius:2px;animation:barIn .8s ease both}
.skip{height:40px;padding:0 16px;border-radius:999px;background:var(--btn-ic);border:1px solid var(--line-2);font-size:15px;font-weight:500;display:flex;align-items:center}
.theme-light .skip{border-color:rgba(0,0,0,.04);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.onb-title{text-align:center;padding:24px 24px 0}
.onb-title p{color:var(--text-2);margin-top:12px;font-size:15px;line-height:22px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--raised)}
.seg button{height:30px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--text);color:var(--bg)}
.bmi{margin:24px 16px 0;padding:20px;border-radius:24px;background:linear-gradient(120deg,color-mix(in srgb,var(--orange) 9%,var(--card)),var(--card) 70%);border:1px solid color-mix(in srgb,var(--orange) 18%,transparent);position:relative;overflow:hidden}
.bmi::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.bmi .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bmi-scale{display:flex;gap:4px;margin-top:14px}
.bmi-scale i{flex:1;height:6px;border-radius:3px;position:relative}
.bmi-scale i.mk::after{content:"";position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--text);left:var(--x);box-shadow:0 0 0 2px var(--card)}
.wt{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:32px}
.wt b{font-size:72px;font-weight:700;letter-spacing:-.04em;line-height:1}
.wt span{font-size:22px;color:var(--text-2);font-weight:500}
.ruler{position:relative;height:96px;margin-top:16px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);touch-action:none}
.proto .ruler{cursor:ew-resize}
.ruler-track{position:absolute;left:50%;top:0;bottom:0;transition:transform .15s ease-out}
.ruler-track .tk{position:absolute;bottom:8px;width:1.5px;border-radius:1px;background:var(--text-3)}
.ruler-track .tk.mid{background:var(--text-2)}
.ruler-track .tk.maj{background:var(--text-2)}
.ruler-track .tl{position:absolute;top:4px;transform:translateX(-50%);font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ruler .needle{position:absolute;left:50%;bottom:4px;width:4px;height:68px;margin-left:-2px;border-radius:2px;background:var(--accent);box-shadow:0 0 16px var(--accent-soft-2)}
.goal{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;background:var(--card);border:1.5px solid var(--line);transition:all .2s;box-shadow:var(--card-shadow)}
.theme-light .goal{border-color:transparent}
.goal .em{width:52px;height:52px;border-radius:16px;background:var(--raised);display:grid;place-items:center;font-size:26px;flex:none}
.theme-light .goal .em{background:var(--card-2)}
.goal .t{font-size:17px;font-weight:600}
.goal .s{font-size:13px;color:var(--text-2);margin-top:2px}
.goal .ck{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.goal.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.goal.on .em{background:var(--accent-soft)}
.goal.on .ck{background:var(--accent);border-color:var(--accent)}
.build-orb{width:120px;height:120px;margin:16px auto 0;position:relative;display:grid;place-items:center}
.build-orb .o1{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--accent) 30%,transparent 60%);animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 54px,#000 55px);mask:radial-gradient(circle,transparent 54px,#000 55px)}
.build-orb .o2{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.theme-light .build-orb .o2{color:color-mix(in srgb,var(--accent) 90%,#000)}
@keyframes spin{to{transform:rotate(360deg)}}
.chk-list .it{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.theme-light .chk-list .it{border-color:var(--line)}
.chk-list .it:last-child{border:0}
.chk-list .ico{width:36px;height:36px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--accent);flex:none}
.theme-light .chk-list .ico{background:var(--card-2);color:color-mix(in srgb,var(--accent) 90%,#000)}
.chk-list .tx{flex:1;font-size:15px;font-weight:500}
.chk-list .st{width:26px;height:26px;position:relative;flex:none}
.chk-list .st .sp{position:absolute;inset:2px;border-radius:50%;border:2px solid var(--raised-2);border-top-color:var(--accent);animation:spin .8s linear infinite, hideAt 0s linear forwards;animation-delay:0s,var(--d)}
.chk-list .st .ok{position:absolute;inset:0;border-radius:50%;background:var(--green);color:#0d2a18;display:grid;place-items:center;transform:scale(0);animation:popIn .45s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:var(--d)}
.chk-list .it{opacity:.35;animation:lightUp .3s ease forwards;animation-delay:calc(var(--d) - 1s)}
@keyframes hideAt{to{opacity:0}}
@keyframes popIn{to{transform:scale(1)}}
@keyframes lightUp{to{opacity:1}}
.coach-note{display:flex;gap:12px;align-items:center;padding:16px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line);opacity:0;animation:riseIn .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* home */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.greet{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:20px 12px 4px}
.wd{height:72px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wd .l{font-size:12px;color:var(--text-2);font-weight:500}
.wd .n{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2)}
.wd .dt{width:5px;height:5px;border-radius:50%;background:transparent}
.wd.tr .dt{background:var(--text-3)}
.wd.dn .dt{background:var(--accent)}
.wd.dn .n,.wd.tr .n{color:var(--text)}
.wd.today{background:var(--accent);}
.wd.today .l,.wd.today .n{color:var(--accent-ink)}
.wd.today .dt{background:var(--accent-ink)}
/* sticky + collapsing home header */
.home-top{position:sticky;top:-54px;margin-top:-54px;padding-top:54px;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
.home-top .home-head,.home-top .logo,.home-top .eyebrow,.home-top .greet,.home-top .btn-ic,.home-top .week,.home-top .wd,.home-top .wd .l,.home-top .wd .n,.home-top .wd .dt{transition:all .32s cubic-bezier(.2,.8,.2,1)}
.home-top .eyebrow{max-height:16px;overflow:hidden}
.home-top .logo svg{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.home-top.compact{border-bottom-color:var(--line-2);box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
.theme-light .home-top.compact{box-shadow:0 8px 24px -14px rgba(16,16,24,.18)}
.home-top.compact .home-head{padding-top:0}
.home-top.compact .logo{width:32px;height:32px;border-radius:10px}
.home-top.compact .logo svg{transform:scale(.78)}
.home-top.compact .eyebrow{max-height:0;opacity:0}
.home-top.compact .greet{font-size:17px;margin-top:0}
.home-top.compact .btn-ic{width:36px;height:36px}
.home-top.compact .btn-ic .dot{top:7px;right:8px}
.home-top.compact .week{padding:8px 12px 10px}
.home-top.compact .wd{height:42px;border-radius:14px;gap:1px}
.home-top.compact .wd .l{font-size:10px}
.home-top.compact .wd .n{font-size:15px}
.home-top.compact .wd .dt{width:4px;height:4px}
.coach-badge{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border-radius:999px;background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);font-size:12px;font-weight:600}
.theme-light .coach-badge{color:#1E9E5A}
.today-card{overflow:hidden}
.today-card::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft-2),transparent 70%);pointer-events:none}
.meta-list{display:grid;gap:10px;margin-top:16px}
.meta-list div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.meta-list b{color:var(--text);font-weight:600}
.bigstat{display:flex;align-items:baseline;gap:2px;margin-top:12px}
.bigstat b{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.bigstat span{font-size:15px;color:var(--text-2);font-weight:500}
.tile-ic{width:36px;height:36px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none}
.theme-light .tile-ic{background:var(--card-2)}
.datebox{width:52px;height:56px;border-radius:16px;background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.theme-light .datebox{background:var(--card-2)}
.datebox span{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.datebox b{font-size:20px;font-weight:700;line-height:1.1}

/* plan */
.wchips{display:flex;gap:6px;padding:0 16px}
.wchip{flex:1;height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.theme-light .wchip{border-color:transparent;box-shadow:var(--card-shadow)}
.wchip span{font-size:10px;font-weight:600;color:var(--text-2);letter-spacing:.04em}
.wchip b{font-size:16px;font-weight:700}
.wchip.done b{color:var(--accent)}
.theme-light .wchip.done b{color:color-mix(in srgb,var(--accent) 90%,#000)}
.wchip.on{background:var(--accent);border-color:var(--accent)}
.wchip.on span,.wchip.on b{color:var(--accent-ink)}
.wchip.fut b{color:var(--text-3)}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;position:relative}
.dayrow+.dayrow{margin-top:4px}
.dayrow .dd{width:44px;text-align:center;flex:none}
.dayrow .dd span{display:block;font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.dayrow .dd b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dayrow .mn{flex:1;min-width:0}
.dayrow .tt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .tg{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dayrow.today{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.dayrow.rest .tt{color:var(--text-2);font-weight:500}
.dayrow.rest .dd b{color:var(--text-2)}
.st-done{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green);display:grid;place-items:center;flex:none}
.st-next{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--text-3);flex:none}
.note{padding:20px;border-radius:24px;background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--card);border:1px solid var(--accent-line);position:relative}
.note q{display:block;font-size:17px;line-height:25px;font-weight:500;letter-spacing:-.01em;quotes:none;margin-top:12px}

/* detail */
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 16px 0}
.stats3>div{text-align:center;position:relative}
.stats3>div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.stats3 span{display:block;font-size:12px;letter-spacing:.06em;color:var(--text-2);font-weight:500}
.stats3 b{display:block;font-size:18px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stats3 b small{font-size:13px;color:var(--text-2);font-weight:500}
.ai-note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--accent-line)}
.theme-light .ai-note{box-shadow:var(--card-shadow)}
.ai-note .ico{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.theme-light .ai-note .ico{color:color-mix(in srgb,var(--accent) 90%,#000)}
.ex-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow)}
.theme-light .ex-card{border-color:transparent}
.ex-card+.ex-card{margin-top:8px}
.ex-idx{width:28px;height:28px;border-radius:50%;background:var(--raised);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--text-2);flex:none}
.theme-light .ex-idx{background:var(--card-2)}

/* active workout */
.segs{display:flex;gap:4px;padding:4px 16px 0}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--raised)}
.segs i.on{background:var(--accent)}
.segs i.cur{background:linear-gradient(90deg,var(--accent) var(--p),var(--raised) var(--p))}
.illus{position:relative;height:184px;display:flex;justify-content:center;align-items:flex-end;gap:28px;padding-bottom:4px}
.illus::before{content:"";position:absolute;left:50%;top:50%;width:260px;height:180px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.illus .cap{position:absolute;bottom:4px;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text-3)}
.fab-wrap{position:absolute;top:126px;right:16px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:32}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--accent);opacity:.5;animation:ripple 2.2s ease-out infinite}
.fab-wrap span{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-line)}
@keyframes ripple{from{transform:scale(.9);opacity:.6}to{transform:scale(1.45);opacity:0}}
.qa{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.theme-light .qa{border-color:var(--line)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;position:relative;color:var(--text)}
.qa button+button::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line-2)}
.qa .ic{color:var(--accent)}
.theme-light .qa .ic{color:color-mix(in srgb,var(--accent) 90%,#000)}
.qa button.on .ic{filter:drop-shadow(0 0 6px var(--accent))}
.sugg{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--accent-line);font-size:14px;line-height:19px}
.theme-light .sugg{box-shadow:var(--card-shadow)}
.sugg .ic{color:var(--accent)}
.sugg b{font-weight:700}
.sugg .ap{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--accent-soft);flex:none}
.theme-light .sugg .ic,.theme-light .sugg .ap{color:color-mix(in srgb,var(--accent) 90%,#000)}
.sets{margin:12px 16px 0;padding:8px 0;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow)}
.theme-light .sets{border-color:transparent}
.sets-h{display:grid;grid-template-columns:40px 1fr 20px 1fr 44px;gap:8px;padding:6px 16px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.sets-h span{text-align:center}
.setrow{display:grid;grid-template-columns:40px 1fr 20px 1fr 44px;gap:8px;align-items:center;padding:8px 16px;position:relative;transition:opacity .3s,background .3s}
.setrow .sn{width:32px;height:32px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.theme-light .setrow .sn{background:var(--card-2)}
.setrow .val{height:40px;border-radius:999px;background:var(--raised);display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.theme-light .setrow .val{background:var(--card-2)}
.setrow .val small{font-size:13px;color:var(--text-2);font-weight:500}
.setrow .x{text-align:center;color:var(--text-3)}
.setrow.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.setrow.cur .sn{background:var(--accent);color:var(--accent-ink)}
.setrow.cur .val{background:color-mix(in srgb,var(--accent) 16%,var(--raised))}
.theme-light .setrow.cur .val{background:#fff}
.setrow.fut{opacity:.42}
.chk{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;position:relative;color:var(--text-3);justify-self:end;overflow:hidden}
.theme-light .chk{border-color:rgba(0,0,0,.12)}
.setrow.cur .chk{border-color:var(--accent);color:var(--accent)}
.chk::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.chk svg{position:relative}
.chk.done{border-color:var(--accent);color:var(--accent-ink)}
.chk.done::before{transform:scale(1)}
.chk.done path{stroke-dasharray:24;stroke-dashoffset:0}
.chk.pop{animation:chkPop .5s cubic-bezier(.3,1.6,.5,1)}
.chk.pop::before{animation:fillIn .4s cubic-bezier(.3,1.5,.5,1) both}
.chk.pop path{animation:draw .4s .15s ease both}
@keyframes chkPop{40%{transform:scale(1.15)}}
@keyframes fillIn{from{transform:scale(0)}}
@keyframes draw{from{stroke-dashoffset:24}}
.addset{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;margin:4px 16px 0;border-top:1px solid var(--line-2);font-size:14px;color:var(--text-2);font-weight:500}
.theme-light .addset{border-color:var(--line)}
.rest{position:absolute;left:20px;right:20px;bottom:30px;height:68px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-line);display:flex;align-items:center;padding:0 10px 0 22px;z-index:33;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.theme-light .rest{box-shadow:0 12px 32px rgba(16,16,24,.14)}
.rest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:linear-gradient(90deg,transparent,var(--accent-soft));transition:width 1s linear;pointer-events:none}
.rest>*{position:relative}
.rest .rl{font-size:15px;font-weight:700;color:var(--accent);width:44px}
.theme-light .rest .rl{color:color-mix(in srgb,var(--accent) 90%,#000)}
.rest .adj{font-size:14px;font-weight:600;color:var(--text-2);padding:8px}
.rest .rt{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:1;text-align:center}
.rest .pz{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-left:4px}
.logbar{position:absolute;left:20px;right:20px;bottom:30px;display:flex;gap:8px;z-index:33}
.logbar .btn{height:60px;box-shadow:var(--cta-shadow)}
.logbar .cta-in{flex:1;background:var(--cta-bg);color:var(--cta-ink)}
.tipcard{margin:12px 16px 0;padding:16px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px;line-height:20px;animation:riseIn .35s ease both}
.tipcard ol{padding-left:18px;display:grid;gap:4px;margin-top:6px}

/* help sheet */
.hrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--card-2);border:1px solid var(--line)}
.theme-light .hrow{border-color:transparent}
.hrow+.hrow{margin-top:8px}
.hrow .hi{width:44px;height:44px;border-radius:14px;background:var(--raised);display:grid;place-items:center;flex:none}
.theme-light .hrow .hi{background:#fff}
.hrow .ht{font-size:16px;font-weight:600;letter-spacing:-.01em}
.hrow .hs{font-size:13px;color:var(--text-2);margin-top:2px;line-height:17px}
.hrow .mid{flex:1;min-width:0}
.hrow.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:18px 16px}
.hrow.primary .hi{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);color:var(--accent-ink)}
.hrow.primary .hs{color:color-mix(in srgb,var(--accent-ink) 70%,transparent)}
.hrow.primary .live{display:inline-flex;align-items:center;gap:6px}
.hrow.primary .live i{width:7px;height:7px;border-radius:50%;background:#1a9d55;box-shadow:0 0 0 3px rgba(26,157,85,.25)}
.theme-light .hrow.primary .live i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.hrow.danger{background:color-mix(in srgb,var(--red) 10%,var(--card-2));border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.hrow.danger .hi{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.hrow.danger .ht{color:var(--red)}
.pulse{position:relative;width:132px;height:132px;margin:8px auto 0;display:grid;place-items:center}
.pulse i{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:0;animation:pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
.pulse i:nth-child(2){animation-delay:.8s}.pulse i:nth-child(3){animation-delay:1.6s}
@keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}
.steps{display:flex;align-items:flex-start;margin-top:24px;padding:0 8px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);position:relative;text-align:center}
.step .dot{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;position:relative;z-index:1;color:var(--text-3)}
.step.ok .dot{background:var(--green);color:#0d2a18}
.step.now .dot{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.step.ok,.step.now{color:var(--text)}
.step+.step::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--raised)}
.step.ok+.step::before,.step.ok+.step.now::before{background:var(--green)}

/* complete */
.confetti{position:absolute;inset:0 0 auto;height:340px;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;border-radius:2px;animation:drift 4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(10px) rotate(var(--r2))}}
.medal{width:104px;height:104px;margin:16px auto 0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative;box-shadow:0 0 0 10px var(--accent-soft),0 0 0 22px color-mix(in srgb,var(--accent) 6%,transparent),0 20px 50px color-mix(in srgb,var(--accent) 30%,transparent);animation:medal .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes medal{from{transform:scale(.4);opacity:0}}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3>div{padding:16px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow)}
.theme-light .sum3>div{border-color:transparent}
.sum3 span{font-size:12px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.sum3 b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.sum3 b small{font-size:13px;font-weight:500;color:var(--text-2)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel button{height:76px;border-radius:18px;background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:600;color:var(--text-2);border:1.5px solid transparent;transition:all .2s}
.theme-light .feel button{background:var(--card-2)}
.feel .lv{display:flex;gap:2px;align-items:flex-end;height:18px}
.feel .lv i{width:4px;border-radius:2px;background:var(--text-3)}
.feel button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.feel button.on .lv i.f{background:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .2s}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.warn.on{background:var(--red);border-color:var(--red);color:#fff}

/* coach */
.trainer{display:flex;gap:16px;align-items:center}
.onfloor{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green)}
.theme-light .onfloor{color:#1E9E5A}
.onfloor i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent);animation:blink 2s infinite}
.chat{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.daysep{align-self:center;font-size:12px;font-weight:600;color:var(--text-3);padding:8px 0}
.msg{max-width:78%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:21px}
.msg.them{align-self:flex-start;background:var(--card-2);border-bottom-left-radius:6px}
.theme-light .msg.them{background:#fff;box-shadow:var(--card-shadow)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg .tm{display:block;font-size:11px;opacity:.55;margin-top:4px;text-align:right}
.mrow{display:flex;gap:8px;align-items:flex-end}
.mrow .msg{max-width:none}
.mrow.them{align-self:flex-start;max-width:86%}
.voice{display:flex;align-items:center;gap:10px;min-width:220px}
.voice .pb{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.wave i{width:3px;border-radius:2px;background:var(--text-3)}
.wave i.p{background:var(--text)}
.shared{align-self:flex-end;width:250px;padding:14px;border-radius:20px;border-bottom-right-radius:6px;background:var(--card);border:1px solid var(--accent-line);box-shadow:var(--card-shadow)}
.recap{padding:16px;border-radius:22px;background:linear-gradient(160deg,var(--accent-soft),transparent 55%),var(--card);border:1px solid var(--accent-line)}
.recap .lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.theme-light .recap .lbl{color:color-mix(in srgb,var(--accent) 90%,#000)}
.recap ul{list-style:none;display:grid;gap:10px;margin-top:12px}
.recap li{display:flex;gap:10px;font-size:14px;line-height:19px}
.recap li .b{width:24px;height:24px;border-radius:8px;background:var(--raised);display:grid;place-items:center;flex:none}
.theme-light .recap li .b{background:var(--card-2)}
.inputbar{position:absolute;left:16px;right:16px;bottom:104px;height:56px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-line);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:33}
.inputbar .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none}
.inputbar input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;font-size:15px;color:var(--text)}
.inputbar input::placeholder{color:var(--text-3)}
.inputbar .send{background:var(--accent);color:var(--accent-ink)}

.coach-top{position:absolute;top:0;left:0;right:0;padding-top:54px;padding-bottom:16px;background:linear-gradient(var(--bg) 86%,transparent);z-index:38}
/* profile */
.pf-av{width:96px;height:96px;margin:0 auto;border-radius:50%;padding:4px;background:conic-gradient(var(--accent) 0 80%,var(--raised) 80%)}
.pf-av>div{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow)}
.theme-light .stat{border-color:transparent}
.stat span{font-size:13px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:10px;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:14px;font-weight:500;color:var(--text-2);letter-spacing:0}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable td{padding:12px 0;border-top:1px solid var(--line-2)}
.theme-light .mtable td{border-color:var(--line)}
.mtable tr:first-child td{border-top:0}
.mtable td:nth-child(2){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mtable td:nth-child(3){text-align:right;width:72px;font-weight:600;font-variant-numeric:tabular-nums}
.dn{color:var(--green)} .up{color:var(--orange)}
.theme-light .dn{color:#1E9E5A}
.photos{display:grid;grid-template-columns:1fr 1fr 72px;gap:8px}
.ph{height:150px;border-radius:18px;background:linear-gradient(170deg,var(--raised),var(--card-2));position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:1px solid var(--line)}
.ph .cap{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center}
.ph.add{align-items:center;color:var(--text-2);border:1.5px dashed var(--line-2);background:transparent}
.lift{display:flex;align-items:center;gap:12px;padding:12px 0}
.lift+.lift{border-top:1px solid var(--line-2)}
.theme-light .lift+.lift{border-color:var(--line)}
.setrow2{display:flex;align-items:center;gap:14px;padding:14px 0}
.setrow2+.setrow2{border-top:1px solid var(--line-2)}
.theme-light .setrow2+.setrow2{border-color:var(--line)}
.setrow2 .si{width:36px;height:36px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none;color:var(--text-2)}
.theme-light .setrow2 .si{background:var(--card-2)}
.setrow2 .st{flex:1;font-size:15px;font-weight:500}
.setrow2 .sv{font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:4px}

/* prototype interactivity */
.proto [data-act]{cursor:pointer}
.proto [data-act]:active{transform:scale(.97)}
.proto .tab[data-act]:active,.proto .backdrop:active{transform:none}
.frame:not(.is-proto) .chk{cursor:pointer}

/* =========================================================
   7. GYM COMPANION — PRD screens (member, trainer, owner)
   ========================================================= */
.tabbar{left:16px;right:16px;padding:5px}
.tab{font-size:10.5px;gap:3px;position:relative}
.tbadge{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

/* canvas: PRD screen id on each frame */
.frame-label .prd{font-size:10px;font-weight:700;letter-spacing:.06em;color:#6B7280;background:#E4E7EC;border-radius:6px;padding:3px 6px;align-self:center}
.cv-sub{font-size:13px;color:#6B7280;margin:-12px 0 24px;max-width:760px;line-height:1.5}
.jump-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9CA3AF;margin:14px 0 8px}
.jump-h:first-of-type{margin-top:0}

/* status tags */
.tag.good{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.tag.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.tag.bad{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.theme-light .tag.good{color:#1B8A4E}
.theme-light .tag.warn{color:#B85E00}
.tag .ic{margin-right:4px}

/* buttons */
.btn.sm{height:42px;font-size:14px;padding:0 16px}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn[disabled],.cta[disabled]{opacity:.45}
.btn.off{background:var(--raised);color:var(--text-3)}
.theme-light .btn.off{background:var(--raised-2)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}

/* selection cards (extends .goal) */
.goal.sm{padding:14px 16px;border-radius:20px;gap:14px}
.goal.sm .em{width:44px;height:44px;border-radius:14px;font-size:21px}
.goal.sm .t{font-size:16px}
.goal .em .ic{color:var(--text-2)}
.goal.on .em .ic{color:var(--accent)}
.theme-light .goal.on .em .ic{color:color-mix(in srgb,var(--accent) 90%,#000)}
.goal.danger.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card))}
.goal.danger.on .em{background:color-mix(in srgb,var(--red) 16%,transparent)}
.goal.danger.on .em .ic{color:var(--red)}
.goal.danger.on .ck{background:var(--red);border-color:var(--red);color:#fff}
.choice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.choice.three{grid-template-columns:repeat(3,1fr)}
.choice button{height:66px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--card-shadow);transition:all .2s}
.theme-light .choice button{border-color:transparent}
.choice b{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.choice.three b{font-size:15px;letter-spacing:-.01em}
.choice span{font-size:11px;font-weight:600;color:var(--text-2)}
.choice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.qlabel{font-size:13px;font-weight:600;color:var(--text-2);margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:center}

/* consent rows */
.trow{display:flex;gap:14px;align-items:flex-start;padding:16px 0}
.trow+.trow{border-top:1px solid var(--line-2)}
.theme-light .trow+.trow{border-color:var(--line)}
.trow .ti{width:40px;height:40px;border-radius:13px;background:var(--raised);display:grid;place-items:center;flex:none;color:var(--text-2)}
.theme-light .trow .ti{background:var(--card-2)}
.trow .tt{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.trow .ts{font-size:13px;color:var(--text-2);line-height:18px;margin-top:3px}
.trow .toggle{margin-top:4px}
.toggle.lock{opacity:.5}
.req{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

/* invite + otp */
.invite{border-radius:28px;padding:28px 20px 24px;background:radial-gradient(120% 90% at 100% 0%,var(--accent-soft-2),transparent 60%),var(--card);border:1px solid var(--accent-line);text-align:center}
.invite .logo{width:64px;height:64px;border-radius:20px;margin:0 auto}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp i{height:58px;border-radius:16px;background:var(--card);border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--card-shadow)}
.otp i.on{border-color:var(--accent);position:relative}
.otp i.on::after{content:"";width:2px;height:24px;background:var(--accent);animation:blink 1s infinite}
.badico{width:76px;height:76px;margin:0 auto;border-radius:50%;background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);display:grid;place-items:center;box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 6%,transparent)}
.field{height:52px;border-radius:16px;background:var(--card-2);border:1px solid var(--line-2);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;color:var(--text-3)}

/* info / hold / success blocks */
.info{padding:14px 16px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);display:flex;gap:12px;font-size:13px;line-height:19px;color:var(--text-2)}
.theme-light .info{background:var(--card);border-color:transparent;box-shadow:var(--card-shadow)}
.info .ic{color:var(--text-2);margin-top:1px}
.info b{color:var(--text);font-weight:600}
.hold{padding:16px;border-radius:22px;background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.hold .ht{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--red);font-size:15px}
.hold p{font-size:13px;line-height:19px;color:var(--text);margin-top:6px}
.okhero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:24px;background:color-mix(in srgb,var(--green) 10%,var(--card));border:1px solid color-mix(in srgb,var(--green) 28%,transparent)}
.okhero .ico{width:44px;height:44px;border-radius:50%;background:var(--green);color:#0d2a18;display:grid;place-items:center;flex:none}
.offline{display:flex;align-items:flex-start;gap:10px;margin:8px 16px 0;padding:11px 14px;border-radius:16px;background:color-mix(in srgb,var(--orange) 13%,var(--card));border:1px solid color-mix(in srgb,var(--orange) 30%,transparent);font-size:13px;line-height:18px}
.offline .ic{color:var(--orange);margin-top:1px}
.offline b{font-weight:700}

/* vertical timeline */
.vtl .it{display:flex;gap:14px;position:relative;padding-bottom:18px}
.vtl .it:last-child{padding-bottom:0}
.vtl .it::before{content:"";position:absolute;left:13px;top:32px;bottom:4px;width:2px;border-radius:1px;background:var(--raised-2)}
.vtl .it:last-child::before{display:none}
.vtl .it.ok::before{background:var(--green)}
.vtl .dot{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;color:var(--text-3);position:relative;z-index:1}
.theme-light .vtl .dot{background:var(--raised-2)}
.vtl .ok .dot{background:var(--green);color:#0d2a18}
.vtl .now .dot{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.vtl .tt{font-size:15px;font-weight:600;line-height:20px;padding-top:4px}
.vtl .ts{font-size:13px;color:var(--text-2);margin-top:2px;line-height:18px}
.vtl .fut .tt{color:var(--text-2)}

/* QR scanner (camera view stays dark in both themes) */
.scan{position:relative;margin:8px 16px 0;height:316px;border-radius:32px;overflow:hidden;background:radial-gradient(90% 80% at 50% 38%,#33373c,#0b0c0d);display:grid;place-items:center}
.scan .vf{width:196px;height:196px;position:relative;margin-top:-24px}
.scan .vf>i{position:absolute;width:46px;height:46px;border:4px solid var(--brand-accent-dark)}
.scan .vf>i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:20px 0 0 0}
.scan .vf>i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 20px 0 0}
.scan .vf>i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 20px}
.scan .vf>i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 20px 0}
.scan .qr{position:absolute;inset:36px;opacity:.9}
.scan .line{position:absolute;left:16px;right:16px;height:2px;border-radius:1px;background:var(--brand-accent-dark);box-shadow:0 0 18px 2px var(--brand-accent-dark);animation:scanY 2.2s ease-in-out infinite alternate}
@keyframes scanY{from{top:20px}to{top:174px}}
.scan .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600}
.scan .cap small{display:block;font-size:12px;font-weight:500;opacity:.6;margin-top:2px}

/* barbell loading */
.plates{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 14px;border-radius:16px;background:var(--card-2)}
.theme-light .plates{background:var(--raised)}
.plates svg{flex:none}
.plates .pt{font-size:13px;line-height:18px;min-width:0}
.plates .pt b{font-weight:700}

/* set rows */
.setrow.held{opacity:.35}
.setrow .val[data-act]{cursor:pointer}
.setrow .val.diff{box-shadow:inset 0 0 0 1.5px var(--accent-line)}

/* log sheet */
.planned{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:16px;background:var(--card-2);font-size:13px;color:var(--text-2)}
.theme-light .planned{background:var(--raised)}
.planned b{color:var(--text);font-weight:700;font-size:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:24px;background:var(--card-2)}
.theme-light .stepper{background:var(--raised)}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--raised-2);display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1}
.theme-light .stepper button{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stepper .sv{text-align:center}
.stepper .sv b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stepper .sv span{display:block;font-size:11px;color:var(--text-2);margin-top:5px;font-weight:600}
.effort{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.effort button{height:62px;border-radius:16px;background:var(--card-2);border:1.5px solid transparent;font-size:11px;font-weight:500;color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.theme-light .effort button{background:var(--raised)}
.effort button b{font-size:15px;font-weight:700;color:var(--text)}
.effort button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}

/* demo sheet */
.vid{position:relative;height:196px;border-radius:24px;overflow:hidden;background:radial-gradient(80% 90% at 50% 30%,var(--accent-soft),transparent 70%),linear-gradient(160deg,var(--raised),var(--card-2));display:flex;align-items:flex-end;justify-content:center}
.vid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vid .vsrc,.vid .vdur{position:absolute;height:24px;padding:0 9px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.vid .vsrc{left:12px;top:12px}
.vid .vdur{right:12px;bottom:12px}
.olist{display:grid;gap:12px;counter-reset:o}
.olist li{list-style:none;display:flex;gap:12px;font-size:14px;line-height:20px}
.olist li::before{counter-increment:o;content:counter(o);width:24px;height:24px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.theme-light .olist li::before{background:var(--raised-2)}

/* help request status */
.steps.four .step{font-size:11px;gap:6px}
.steps.four .step small{display:block;font-size:10px;font-weight:500;color:var(--text-3);margin-top:-2px;min-height:12px}
.pulse-ic{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;position:relative}
.pulse.calm{width:104px;height:104px}

/* AI coach */
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.ans{align-self:flex-start;max-width:92%;padding:14px 16px;border-radius:22px;border-bottom-left-radius:6px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow);font-size:15px;line-height:21px}
.theme-light .ans{border-color:transparent}
.ans b{font-weight:700}
.ans .src{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:8px}
.ans .src .ic{color:var(--accent)}
.theme-light .ans .src .ic{color:color-mix(in srgb,var(--accent) 90%,#000)}
.ans .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ans .acts button{height:36px;padding:0 14px;border-radius:999px;background:var(--raised);font-size:13px;font-weight:600}
.theme-light .ans .acts button{background:var(--card-2)}
.ans .acts button.pri{background:var(--accent);color:var(--accent-ink)}
.ans.stop{border-color:color-mix(in srgb,var(--red) 35%,transparent);background:color-mix(in srgb,var(--red) 8%,var(--card))}
.ans.stop .src,.ans.stop .src .ic{color:var(--red)}
.ans.stop .acts button.pri{background:var(--red);color:#fff}
.qchips{position:absolute;left:0;right:0;display:flex;gap:8px;overflow-x:auto;padding:0 16px;z-index:33;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips button{flex:none;height:38px;padding:0 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--accent-line);font-size:13px;font-weight:600;color:var(--text)}
.inputbar input:disabled{opacity:.6}

/* progress */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .cl{font-size:11px;font-weight:600;color:var(--text-3);padding-bottom:2px}
.cal .cd{height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.cal .cd.v{background:var(--accent);color:var(--accent-ink)}
.cal .cd.t{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal .cd.f{color:var(--text-3);opacity:.6}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat.sm{padding:14px}
.stat.sm b{font-size:22px;margin-top:8px}
.stat.sm span{font-size:12px}

/* trainer app */
.live{padding:16px 16px 14px;border-radius:26px;background:var(--accent);color:var(--accent-ink);position:relative;overflow:hidden}
.live::after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.live.bad{background:var(--red);color:#fff}
.live .lt{font-size:11px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;gap:6px;opacity:.8}
.live .lt i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.live .ln{font-size:19px;font-weight:700;letter-spacing:-.02em}
.live .ls{font-size:13px;opacity:.72;margin-top:2px}
.live .lb{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.live .lb button{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:14px;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;gap:6px}
.live .lb button.ghost{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);color:var(--accent-ink)}
.live.bad .lb button{background:#fff;color:var(--red)}
.live.bad .lb button.ghost{background:rgba(255,255,255,.2);color:#fff}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qtile{padding:14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--card-shadow);text-align:left}
.theme-light .qtile{border-color:transparent}
.qtile span{font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.qtile b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.mrow2{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.mrow2+.mrow2{border-top:1px solid var(--line-2)}
.theme-light .mrow2+.mrow2{border-color:var(--line)}
.mrow2 .mn{flex:1;min-width:0}
.mrow2 .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow2 .s{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-ini{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.vrow{display:flex;gap:12px;padding:11px 0}
.vrow+.vrow{border-top:1px solid var(--line-2)}
.theme-light .vrow+.vrow{border-color:var(--line)}
.vi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.vi.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.vi.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.vt{font-size:14px;font-weight:600;line-height:20px}
.vs{font-size:12px;color:var(--text-2);margin-top:1px;line-height:16px}
.lrow2{display:flex;align-items:center;gap:12px;padding:12px 0}
.lrow2+.lrow2{border-top:1px solid var(--line-2)}
.theme-light .lrow2+.lrow2{border-color:var(--line)}
.lrow2 .mn{flex:1;min-width:0}
.lrow2 .t{font-size:15px;font-weight:600}
.lrow2 .s{font-size:12px;color:var(--text-2);margin-top:2px}
.ldin{height:34px;min-width:82px;padding:0 10px;border-radius:12px;background:var(--raised);display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.theme-light .ldin{background:var(--card-2)}
.ldin.need{background:transparent;border:1.5px dashed var(--orange);color:var(--orange)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;font-size:14px;line-height:19px}
.kv+.kv{border-top:1px solid var(--line-2)}
.theme-light .kv+.kv{border-color:var(--line)}
.kv span{color:var(--text-2);flex:none}
.kv b{font-weight:600;text-align:right}
.actbar{position:absolute;left:20px;right:20px;bottom:30px;display:flex;gap:8px;z-index:33}
.actbar .btn{flex:1;height:58px;box-shadow:var(--cta-shadow)}
.actbar .btn.sec{background:var(--card-2)}
.theme-light .actbar .btn.sec{background:#fff}

   8. OWNER CONSOLE (desktop web)

.desk{zoom:var(--dzd,1);width:1280px;height:820px;border-radius:14px;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px;letter-spacing:-.005em;box-shadow:0 1px 0 rgba(0,0,0,.04),0 40px 80px -40px rgba(17,24,39,.35),0 0 0 1px rgba(17,24,39,.08)}

.dchrome .url{flex:1;max-width:460px;margin:0 auto;height:26px;border-radius:8px;background:#fff;font-size:12px;color:#6B7280;display:flex;align-items:center;justify-content:center;gap:6px}

.dbody{flex:1;display:flex;min-height:0}

.dbtn{height:36px;padding:0 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dbtn.sec{background:var(--raised);color:var(--text)}

.dbtn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.dgrid{display:grid;gap:16px;min-height:0}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--card-shadow);min-width:0}

.dcard h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.dcard .sub{font-size:12px;color:var(--text-2);margin-top:2px;line-height:17px}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.kpi .kl{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}

.meter{height:6px;border-radius:999px;background:var(--raised);overflow:hidden}

.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 10px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.dtable td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
.dtable td.wr{white-space:normal}

.theme-light .dtable th,.theme-light .dtable td{border-color:var(--line)}
.dtable tr:last-child td{border-bottom:0}
.dtable tr.sel td{background:var(--accent-soft)}

.dtable .mut{color:var(--text-2)}
.dtable .num{font-variant-numeric:tabular-nums}
.alist .al{display:flex;align-items:center;gap:12px;padding:11px 0}

.alist .ai.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.alist .ai.warn{background:color-mix(in srgb,var(--orange) 14%,transparent);color:var(--orange)}
.alist .at{font-size:13px;font-weight:600;line-height:18px}
.alist .as{font-size:12px;color:var(--text-2)}
.fchips{display:flex;gap:8px}
.fchips span{height:32px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.fchips span b{color:var(--text);font-weight:700}
.fchips span.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1;min-height:0}

.perm{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--raised);font-size:11px;font-weight:600;color:var(--text-2);margin:2px 4px 2px 0;white-space:nowrap}

   ========================================================= */

.dform.three{grid-template-columns:repeat(3,1fr)}
