<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Gym Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E0F; --stage:#121212; --card:#1C1C1E; --card-2:#232325; --raised:#2C2C2E;
  --text:#FFFFFF; --text-2:#A1A1A6; --text-3:#5E5E63; --line:rgba(255,255,255,.08);
  --accent:#D7F45B; --accent-ink:#121212; --accent-soft:rgba(215,244,91,.12);
  --p0:#D7F45B; --p1:#6CB6FF; --p2:#A1A1A6; --np:#FF5A5F;
  --green:#3DDC84; --orange:#FF9F43; --red:#FF5A5F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* stage: 1920×1080 canvas scaled to fit the window */
.viewport{position:fixed;inset:0;overflow:hidden}
.deck{position:absolute;left:50%;top:calc(50% - 10px);width:1920px;height:1080px;transform-origin:center;transform:translate(-50%,-50%)}
.slide{position:absolute;inset:0;background:var(--stage);border-radius:28px;overflow:hidden;padding:96px 120px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1),visibility .45s}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.prev{transform:translateX(-40px)}
.slide::before{content:"";position:absolute;inset:0 0 auto;height:520px;background:radial-gradient(70% 100% at 50% 0%,rgba(255,255,255,.05),transparent 70%);pointer-events:none}
.slide>*{position:relative}

/* chrome */
.ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(28,28,30,.9);backdrop-filter:blur(16px);border:1px solid var(--line);z-index:10;transition:opacity .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ui button{height:40px;min-width:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:600}
.ui button:hover:not(:disabled){background:var(--raised);color:var(--text)}
.ui button:disabled{opacity:.3;cursor:default}
.ui .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.ui .count{padding:0 14px;color:var(--text);min-width:300px;justify-content:flex-start}
.ui .count b{font-size:15px;font-variant-numeric:tabular-nums}
.ui .count .of{color:var(--text-3);font-variant-numeric:tabular-nums}
.ui .count .t{color:var(--text-2);font-weight:500;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui .wide{padding:0 14px}
.ui kbd{font:600 11px 'Inter';color:var(--text-3);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
body.idle.fs .ui,body.idle.fs .rail{opacity:0}

/* top rail: one tick per slide, grouped by section */
.rail{position:fixed;left:24px;right:24px;top:10px;display:flex;gap:14px;z-index:10;transition:opacity .3s}
.rail .grp{display:flex;flex-direction:column;gap:6px;min-width:84px}
.rail .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.rail .grp.on .lbl{color:var(--text)}
.rail .ticks{display:flex;gap:3px}
.rail .tick{flex:1;height:5px;border-radius:3px;background:var(--raised);cursor:pointer;position:relative;transition:background .3s,transform .2s}
.rail .tick::before{content:"";position:absolute;inset:-8px 0}
.rail .tick:hover{transform:scaleY(1.8)}
.rail .tick.done{background:rgba(215,244,91,.4)}
.rail .tick.cur{background:var(--accent)}

/* overview */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,10,11,.88);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:48px 64px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;overflow-y:auto}
.ov.open{opacity:1;visibility:visible}
.ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.ov-head h3{font-size:28px}
.ov-head span{font-size:14px;color:var(--text-2)}
.ov-head button{width:44px;height:44px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
#ovBody{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;align-items:start}
.ov-sec{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ov-grid{display:flex;flex-direction:column;gap:8px}
.ov-card{text-align:left;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:flex-start;gap:12px;transition:border-color .2s,transform .2s}
.ov-card:hover{border-color:rgba(255,255,255,.25);transform:translateX(2px)}
.ov-card.cur{border-color:var(--accent);background:linear-gradient(90deg,rgba(215,244,91,.1),transparent),var(--card)}
.ov-card b{font-size:15px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums;width:22px;flex:none;line-height:20px}
.ov-card.cur b{color:var(--accent)}
.ov-card span{font-size:15px;font-weight:600;line-height:20px}

/* page number on every slide */
.pg{font-variant-numeric:tabular-nums;color:var(--text-2)}
.pg b{color:var(--text);font-weight:700}

/* type */
.eyebrow{font-size:22px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);display:flex;align-items:center;gap:14px}
.eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
h1{font-size:120px;line-height:1;font-weight:800;letter-spacing:-.045em}
h2{font-size:68px;line-height:1.05;font-weight:800;letter-spacing:-.035em;margin-top:20px}
h3{font-size:34px;font-weight:700;letter-spacing:-.02em}
.lead{font-size:32px;line-height:1.45;color:var(--text-2);max-width:1300px;margin-top:28px}
.lead b{color:var(--text);font-weight:600}
.acc{color:var(--accent)}
.foot{position:absolute;left:120px;right:120px;bottom:56px;display:flex;justify-content:space-between;font-size:18px;color:var(--text-3);font-weight:500}
.foot .brand{display:flex;align-items:center;gap:10px}
.foot .brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:36px}
.grid{display:grid;gap:24px}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:18px;font-weight:700;white-space:nowrap}
.pill.p0{background:var(--p0);color:#121212}
.pill.p1{background:rgba(108,182,255,.16);color:var(--p1)}
.pill.p2{background:rgba(161,161,166,.16);color:var(--text-2)}
.pill.np{background:rgba(255,90,95,.14);color:var(--np)}
.pill.ghost{background:var(--raised);color:var(--text)}
.ic{flex:none}
.icon-tile{width:72px;height:72px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pips{display:inline-flex;gap:5px}
.pips i{width:22px;height:8px;border-radius:4px;background:var(--raised)}
.pips i.on{background:var(--accent)}
.pips.gym i.on{background:var(--p1)}
.kv{display:flex;align-items:center;gap:14px;font-size:18px;color:var(--text-2);font-weight:500}

/* cover */
.cover{justify-content:space-between}
.cover .mark{width:96px;height:96px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.cover-stats{display:flex;gap:64px}
.cover-stats div b{display:block;font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1}
.cover-stats div span{font-size:22px;color:var(--text-2);font-weight:500}
.glow{position:absolute;right:-240px;top:-200px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(215,244,91,.16),transparent 65%);pointer-events:none}

/* people */
.person{display:flex;flex-direction:column;gap:20px}
.person p{font-size:26px;line-height:1.45;color:var(--text-2)}
.person ul{list-style:none;display:grid;gap:12px;margin-top:8px}
.person li{display:flex;gap:12px;font-size:22px;color:var(--text);align-items:flex-start;line-height:1.35}
.person li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:12px;flex:none}

/* ranking */
.score{display:flex;flex-direction:column;gap:12px}
.rank .card{padding:28px 32px}
.rank .score .big{margin-bottom:16px}
.rank .score .pips{margin-bottom:8px}
.rank .card.prio{padding:8px 32px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.03em}
.score p{font-size:24px;line-height:1.65;color:var(--text-2)}
.prio-row{display:flex;align-items:center;gap:24px;padding:18px 0;border-top:1px solid var(--line);font-size:24px;line-height:1.6;color:var(--text-2)}
.prio-row:first-child{border-top:0}
.prio-row .pill{width:150px;justify-content:center;flex:none}

/* matrix */
.matrix-wrap{display:grid;grid-template-columns:1080px 1fr;gap:56px;margin-top:40px;flex:1;min-height:0}
.legend{display:grid;gap:22px;align-content:start}
.legend h4{font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.legend h4 i{width:14px;height:14px;border-radius:50%}
.legend ol{list-style:none;columns:2;column-gap:24px}
.legend li{font-size:18px;color:var(--text-2);line-height:1.75;break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend li b{color:var(--text);font-variant-numeric:tabular-nums;display:inline-block;width:32px}
.mdot{cursor:pointer;transition:transform .2s,opacity .2s}
.mdot:hover,.mdot.hl{transform:scale(1.2)}
svg.dim .mdot:not(.hl){opacity:.35}
.legend li{transition:color .2s,background .2s;border-radius:8px;padding:0 6px;margin:0 -6px}
.legend li.hl{background:var(--raised);color:var(--text)}
.legend li[data-n]{cursor:pointer}
/* hover tooltip for chart dots */
.tip{position:fixed;z-index:30;pointer-events:none;background:#fff;color:#121212;border-radius:14px;padding:10px 14px;box-shadow:0 12px 32px rgba(0,0,0,.45);transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s;white-space:nowrap}
.tip.on{opacity:1}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip b{display:block;font-size:15px;font-weight:700}
.tip span{display:block;font-size:12px;color:#6E6E76;font-weight:600;margin-top:2px}

/* summary table */
.tables{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}
table{width:100%;border-collapse:collapse}
th{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:0 10px 14px}
td{padding:0 10px;height:62px;border-top:1px solid var(--line);font-size:21px;vertical-align:middle}
td.n{color:var(--text-3);font-variant-numeric:tabular-nums;width:44px;font-weight:600}
td.f{font-weight:600}
td .pill{height:30px;font-size:14px;padding:0 12px}
td.e{color:var(--text-2);font-weight:600;white-space:nowrap}
th.c,td.c{text-align:center}
.vbar{display:inline-flex;gap:3px}
.vbar i{width:10px;height:18px;border-radius:3px;background:var(--raised)}
.vbar i.on{background:var(--accent)}
.vbar.gym i.on{background:var(--p1)}

/* feature detail */
.feat-top{display:grid;grid-template-columns:1fr 600px;gap:64px;align-items:center;margin-top:44px}
.feat-top .pitch{font-size:42px;line-height:1.3;font-weight:600;letter-spacing:-.015em;color:var(--text)}
.scores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.scores>div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px}
.scores span{display:block;font-size:16px;font-weight:600;color:var(--text-2);margin-bottom:10px}
.scores b{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.scores b small{font-size:20px;color:var(--text-3);font-weight:600}
.scores .pips{display:flex;margin-top:14px}
.feat-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:48px;flex:1;min-height:0;margin-bottom:52px}
.feat-cols .card{padding:34px 36px;display:flex;flex-direction:column}
.feat-cols .stack{display:grid;grid-template-rows:auto 1fr;gap:24px}
.feat-cols .why{background:var(--accent-soft);border-color:transparent}
.feat-cols h5{font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:22px}
.feat-cols .why h5{color:var(--accent)}
.feat-cols ul{list-style:none;display:grid;gap:18px}
.feat-cols li{display:flex;gap:14px;font-size:25px;line-height:1.4;font-weight:500}
.feat-cols li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:14px;flex:none}
.feat-cols .why li{font-size:28px;font-weight:600;line-height:1.35}
.feat-cols .warn li::before{background:var(--orange)}
.feat-cols .meas li::before{background:var(--p1)}
.feat-num{font-size:200px;font-weight:800;letter-spacing:-.06em;color:var(--card-2);position:absolute!important;right:110px;top:50px;line-height:1}

/* P1/P2 card grids */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:44px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 32px;display:flex;flex-direction:column;gap:14px}
.fcard .top{display:flex;align-items:center;justify-content:space-between}
.fcard .num{font-size:20px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
.fcard h4{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.fcard p{font-size:20px;line-height:1.45;color:var(--text-2)}
.fcard .meta{display:flex;gap:18px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:16px;color:var(--text-2);font-weight:600;align-items:center}
.fcard.np{border-style:dashed;border-color:rgba(255,90,95,.35);background:transparent}

/* phases */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:36px;align-items:stretch}
.phase{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px 28px 24px;display:flex;flex-direction:column;position:relative}
.phase .ph{font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.phase h4{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:12px}
.phase p{font-size:19px;line-height:1.6;color:var(--text-2);margin-top:12px;min-height:calc(19px * 1.6 * 3)}
.phase .chips{display:flex;flex-direction:column;gap:8px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.phase .chip{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-radius:14px;background:var(--card-2);font-size:19px;font-weight:600;line-height:1.4}
.phase .chip i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:8px}
.phase .chip span{color:var(--text-3);font-variant-numeric:tabular-nums;width:40px;flex:none}
.phase .chip.note{background:transparent;border:1px dashed var(--line);color:var(--text-2);font-weight:500}
.phase.first{border-color:rgba(215,244,91,.45);background:linear-gradient(180deg,rgba(215,244,91,.08),transparent 40%),var(--card)}
.arrow{position:absolute!important;top:50%;right:-22px;width:20px;height:20px;color:var(--text-3);z-index:1}

/* measurement */
.meas-wrap{display:grid;grid-template-columns:520px 1fr;gap:40px;margin-top:44px}
.base li{display:flex;align-items:center;gap:18px;padding:18px 0;border-top:1px solid var(--line);font-size:23px}
.base li:first-child{border-top:0}
.base li i{width:44px;height:44px;border-radius:14px;background:var(--raised);display:grid;place-items:center;color:var(--accent);flex:none}
.base ul{list-style:none}
.mt td{height:68px;font-size:21px}
.mt td.who{color:var(--text-2)}
.chipn{display:inline-flex;height:30px;min-width:44px;padding:0 10px;border-radius:999px;background:var(--raised);font-size:15px;font-weight:700;align-items:center;justify-content:center;margin-right:6px;font-variant-numeric:tabular-nums}

/* questions */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:48px}
.q{display:flex;gap:24px;align-items:flex-start;padding:30px 32px;background:var(--card);border:1px solid var(--line);border-radius:28px}
.q b{font-size:44px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.03em;width:48px;flex:none}
.q p{font-size:24px;line-height:1.45}
.q p span{display:block;color:var(--text-2);font-size:19px;margin-top:6px}

/* print: one slide per page */
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:#121212}
  .viewport{position:static;display:block}
  .deck{position:static;transform:none!important;width:1920px;height:auto}
  .slide{position:relative;opacity:1;visibility:visible;transform:none;border-radius:0;width:1920px;height:1080px;page-break-after:always;transition:none}
  .ui,.rail,.ov{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="rail" id="rail"></div>
<div class="ov" id="ov"><div class="ov-head"><div><h3>All slides</h3><span>Click a slide to jump · Esc to close</span></div><button id="ovClose" title="Close (Esc)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div id="ovBody"></div></div>
<div class="viewport"><div class="deck" id="deck"></div></div>
<div class="ui">
  <button id="prev" title="Previous (←)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="count" id="count" title="All slides (G)"></button>
  <button id="next" title="Next (→)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <span class="sep"></span>
  <button class="wide" id="grid" title="All slides (G)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></svg>All slides <kbd>G</kbd></button>
  <button id="fs" title="Fullscreen (F)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
</div>

<script>
/* =========================================================
   ROADMAP DATA (mirrors ROADMAP.md)
   ========================================================= */
const F = [
  { n:1, name:'Trainer app and console', m:3, g:5, e:'M', p:0, ph:1, icon:'clipboard',
    pitch:'A floor app and desk console, so trainers can run every member from one place.',
    why:['Plan approvals, floor calls and feedback all depend on it','Delivers “trainer-supervised”, our edge over consumer AI apps'],
    scope:['Plan approval queue','Live floor-call feed','Members who need attention','Chat'],
    watch:'Requests must be loud and one-tap. Trainers are mid-session.',
    measure:['Plan approval time','Floor-call response time','Share of calls answered'] },
  { n:2, name:'Owner dashboard and at-risk alerts', m:3, g:5, e:'M', p:0, ph:1, icon:'radar',
    pitch:'AI flags members who are slipping away and prompts their coach to reach out.',
    why:['Our core promise: no member left unattended','What owners judge when renewing with us'],
    scope:['Weekly at-risk list per trainer','One-tap suggested message','Owner view: flagged → contacted → returned'],
    watch:'Alert fatigue. Cap and rank flags each week.',
    measure:['Contacted within 48 h','Back within 14 days','90-day retention'] },
  { n:3, name:'Membership, check-in and renewals', m:3, g:5, e:'M', p:0, ph:1, icon:'qr',

SEC = 'P1 · Next';
/* P1 + P2 card grids */
const fcard = (f, np = false) => `<div class="fcard ${np ? 'np' : ''}"><div class="top"><span class="num">${np ? '—' : '#' + f.n}</span>${np ? '<span class="pill np" style="height:32px;font-size:15px">Not planned</span>' : `<span class="pill ghost" style="height:32px;font-size:15px">Phase ${f.ph}</span>`}</div>
  <h4>${f.name}</h4><p>${f.d}</p>
  <div class="meta"><span>Member ${vbar(f.m)}</span><span>Gym ${vbar(f.g, 'gym')}</span><span style="margin-left:auto">Effort ${f.e}</span></div></div>`;
const p1 = F.filter(f => f.p === 1);
add(`<div class="eyebrow"><span class="dot" style="background:var(--p1)"></span>P1 · Next · Phase 2</div>
  <h2 style="font-size:60px">Reach, safety and loyalty</h2>
  <div class="fgrid">${p1.filter(f => f.ph === 2).map(f => fcard(f)).join('')}
    <div class="fcard" style="background:transparent;border-style:dashed;justify-content:center"><p style="font-size:22px">Four of phase 2’s seven features are small (S or S–M), which is why the busiest phase stays manageable.</p></div></div>${foot('P1 · 1 of 2')}`);
add(`<div class="eyebrow"><span class="dot" style="background:var(--p1)"></span>P1 · Next · Phase 3</div>
  <h2 style="font-size:60px">AI and new revenue</h2>
  <div class="fgrid">${p1.filter(f => f.ph === 3).map(f => fcard(f)).join('')}
    <div class="fcard" style="background:transparent;border-style:dashed;justify-content:center"><p style="font-size:22px">The heavier AI and shop work waits until the nutrition tracker, memberships and payments it depends on are live.</p></div></div>${foot('P1 · 2 of 2')}`);
SEC = 'P2 · Later';
add(`<div class="eyebrow"><span class="dot" style="background:var(--p2)"></span>P2 · Later · Phase 4</div>
  <h2 style="font-size:60px">Extras, once the core is proven</h2>
  <div class="fgrid" style="grid-template-columns:repeat(3,1fr)">${F.filter(f => f.p === 2).map(f => fcard(f)).join('')}${fcard(NOT_PLANNED, true)}
    <div class="fcard" style="background:transparent;border-style:dashed;justify-content:center"><p style="font-size:22px">Lower differentiation or high ongoing cost. Their value mostly comes from features built earlier.</p></div></div>${foot('P2')}`);

SEC = 'Plan';
/* Phases */
(function(){
  const meta = [
    ['Foundations','What everything else depends on: trainer and owner tools, memberships and a reliable logger.'],
    ['Habits and nutrition','Habit and nutrition features, once members are active.'],
    ['AI and revenue','The heavier AI and shop work.'],
    ['Extras','Nice-to-haves once the core is proven.'],
  ];
  const cols = [1,2,3,4].map(ph => `<div class="phase ${ph === 1 ? 'first' : ''}">${ph < 4 ? `<span class="arrow">${icon('arrow', 20, 2)}</span>` : ''}
    <span class="ph">Phase ${ph}</span><h4>${meta[ph - 1][0]}</h4><p>${meta[ph - 1][1]}</p>
    <div class="chips">${F.filter(f => f.ph === ph).map(f => `<div class="chip"><i style="background:${PCOL[f.p]}"></i><span>#${f.n}</span>${f.name}</div>`).join('')}
    ${ph === 1 ? '<div class="chip note">+ start sourcing the Indian food database</div>' : ''}</div></div>`).join('');
  add(`<div class="eyebrow"><span class="dot"></span>Sequence</div>
    <h2 style="font-size:60px">Four phases</h2>
    <div class="phases">${cols}</div>`);
})();

/* Measurement */
(function(){
  const M = [
    ['90-day member retention','Owner',[2,6,8]],
    ['Workouts per member per week','Owner, trainer',[6,16]],
    ['At-risk contacted within 48 hours','Owner',[1,2]],
    ['Median response time to floor calls','Member, owner',[1]],
    ['On-time renewal rate','Owner',[3,8]],
    ['Members logging food 4+ days a week','Member, trainer',[7,13]],
    ['Shop and PT revenue per gym per month','Owner, us',[10,14]],
  ];
  add(`<div class="eyebrow"><span class="dot"></span>Measurement</div>
    <h2 style="font-size:60px">Baseline first, then seven numbers</h2>
    <div class="meas-wrap">
      <div class="card base"><h5 style="font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Capture at each pilot gym · last 6 months</h5>
        <ul><li><i>${icon('users', 22)}</i>90-day retention of new members</li><li><i>${icon('calendar', 22)}</i>Average visits per member per week</li><li><i>${icon('repeat', 22)}</i>On-time renewal rate</li><li><i>${icon('clipboard', 22)}</i>Members per trainer</li></ul>
        <p style="font-size:19px;color:var(--text-2);line-height:1.45;margin-top:16px">Without a baseline, retention and attendance numbers have nothing to compare against.</p></div>
      <div class="card" style="padding:24px 36px"><table class="mt"><tr><th>Headline metric</th><th>Matters to</th><th>Driven by</th></tr>
        ${M.map(([m, w, d]) => `<tr><td class="f">${m}</td><td class="who">${w}</td><td>${d.map(n => `<span class="chipn">#${n}</span>`).join('')}</td></tr>`).join('')}</table></div>
    </div>${foot('Measurement')}`);
})();

/* Open questions */
(function(){
  const Q = [
    ['License or build the Indian food database?','Decides when the nutrition tracker and food photos ship.'],
    ['Which WhatsApp Business API provider?','And how per-message costs fit into our pricing.'],
    ['How do trainers get floor calls mid-session?','Their own phone, a gym tablet, or a smartwatch.'],
    ['What revenue share for the products space?','And do gyms or we handle fulfilment?'],
    ['Which two languages first?','Depends on where the first paying gyms are.'],
    ['Which body-composition machines are common?','And can we import their data into reassessments?'],
  ];
  add(`<div class="eyebrow"><span class="dot"></span>To decide</div>
    <h2 style="font-size:60px">Open questions</h2>
    <div class="qs">${Q.map(([q, s], i) => `<div class="q"><b>${i + 1}</b><p>${q}<span>${s}</span></p></div>`).join('')}</div>${foot('Open questions')}`);
})();

/* Close */
add(`<div class="glow"></div><div style="margin:auto 0">
  <div class="eyebrow"><span class="dot"></span>Next step</div>
  <h1 style="margin-top:28px">Start phase 1:<br><span class="acc">foundations</span></h1>
  <p class="lead">Trainer app and console · owner dashboard and at-risk alerts · memberships and check-in · offline logger · exercise videos. And start sourcing the Indian food database now.</p></div>
  ${foot('Thank you')}`, 'cover');

/* =========================================================
   DECK ENGINE
   ========================================================= */
const deck = document.getElementById('deck');
deck.innerHTML = SLIDES.map((s, i) => `<section class="slide ${s.cls}" data-i="${i}">${s.html}</section>`).join('');
const els = [...deck.children];
const N = els.length, pad = (n) => String(n).padStart(2, '0');
// slide titles come from each slide's main heading
const TITLES = els.map(el => { const h = el.querySelector('h1, h2'); return h ? h.innerHTML.replace(/<br\s*\/?>/g, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() : 'Slide'; });
// page number on every slide (bottom-right)
els.forEach((el, i) => {
  const pg = `<span class="pg"><b>${pad(i + 1)}</b> / ${N}</span>`;
  const f = el.querySelector('.foot');
  if (f) f.lastElementChild.innerHTML = `${f.lastElementChild.innerHTML} &nbsp;·&nbsp; ${pg}`;
  else el.insertAdjacentHTML('beforeend', `<div class="foot"><span></span>${pg}</div>`);
});
// top rail grouped by section
const groups = [];
SLIDES.forEach((s, i) => { const g = groups[groups.length - 1]; if (g && g.sec === s.sec) g.idx.push(i); else groups.push({ sec: s.sec, idx: [i] }); });
document.getElementById('rail').innerHTML = groups.map(g => `<div class="grp" data-sec="${g.sec}" style="flex:${g.idx.length}"><span class="lbl">${g.sec}</span><div class="ticks">${g.idx.map(i => `<i class="tick" data-go="${i}" title="${pad(i + 1)} · ${TITLES[i]}"></i>`).join('')}</div></div>`).join('');
// overview
document.getElementById('ovBody').innerHTML = groups.map(g => `<div><div class="ov-sec">${g.sec}</div><div class="ov-grid">${g.idx.map(i => `<button class="ov-card" data-go="${i}"><b>${pad(i + 1)}</b><span>${TITLES[i]}</span></button>`).join('')}</div></div>`).join('');
// chart hover: tooltip on dots, and dot <-> legend highlighting
const tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip);
function hl(n, on){
  document.querySelectorAll(`.mdot[data-n="${n}"], .legend li[data-n="${n}"]`).forEach(el => el.classList.toggle('hl', on));
  document.querySelectorAll('.matrix-wrap svg').forEach(svg => svg.classList.toggle('dim', on));
}
function showTip(dot){
  const r = dot.getBoundingClientRect();
  tip.innerHTML = `<b>${dot.dataset.name}</b><span>${dot.dataset.meta}</span>`;
  tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = r.top + 'px';
  tip.classList.add('on');
}
document.addEventListener('mouseover', e => {
  const d = e.target.closest('.mdot'), li = e.target.closest('.legend li[data-n]');
  if (d){ showTip(d); hl(d.dataset.n, true); }
  else if (li){ const dot = document.querySelector(`.mdot[data-n="${li.dataset.n}"]`); if (dot) showTip(dot); hl(li.dataset.n, true); }
});
document.addEventListener('mouseout', e => {
  const d = e.target.closest('.mdot, .legend li[data-n]');
  if (d && !d.contains(e.relatedTarget)){ tip.classList.remove('on'); hl(d.dataset.n, false); }
});

const ov = document.getElementById('ov');
const openOv = (on) => ov.classList.toggle('open', on);
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t){ go(+t.dataset.go); openOv(false); } });
document.getElementById('ovClose').onclick = () => openOv(false);

let cur = 0;
function go(i){
  cur = Math.max(0, Math.min(N - 1, i));
  els.forEach((el, j) => { el.classList.toggle('on', j === cur); el.classList.toggle('prev', j < cur); });
  document.getElementById('count').innerHTML = `<b>${pad(cur + 1)}</b><span class="of">/ ${N}</span><span class="t">${TITLES[cur]}</span>`;
  document.querySelectorAll('.rail .tick').forEach(t => { const k = +t.dataset.go; t.classList.toggle('cur', k === cur); t.classList.toggle('done', k < cur); });
  document.querySelectorAll('.rail .grp').forEach(g => g.classList.toggle('on', g.dataset.sec === SLIDES[cur].sec));
  document.querySelectorAll('.ov-card').forEach(c => c.classList.toggle('cur', +c.dataset.go === cur));
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === N - 1;
  history.replaceState(null, '', '#' + (cur + 1));
}
function fit(){
  const s = Math.min((innerWidth - 48) / 1920, (innerHeight - 124) / 1080);
  deck.style.transform = `translate(-50%,-50%) scale(${s})`;
}
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('count').onclick = () => openOv(true);
document.getElementById('grid').onclick = () => openOv(!ov.classList.contains('open'));
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener('keydown', e => {
  if (e.key === 'g' || e.key === 'G' || e.key === 'o' || e.key === 'O') { openOv(!ov.classList.contains('open')); return; }
  if (e.key === 'Escape') { openOv(false); return; }
  if (ov.classList.contains('open')) return;
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(els.length - 1);
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
let tx = null;
addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive:true });
addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2500); });
addEventListener('resize', fit);
fit();
go((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
